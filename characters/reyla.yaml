portrait: reyla/portrait.jpg   # percorso relativo alla cartella characters/

allies: |
  Famiglia adottiva di Dados (benestante): le ha dato una casa, ma lei è fuggita senza permesso.
  I druidi di Dados, custodi delle antiche tradizioni e dell'equilibrio naturale del regno di Gravion.
  Genitori biologici: sconosciuti, partiti per una missione segreta; non sa se siano ancora vivi.

treasure: ""

backstory: |
  Reyla è nata a Dados, il regno boscoso di Gravion, un luogo antico e incontaminato, dove le foreste si estendono a perdita d'occhio e la natura è parte integrante della vita di chi vi abita. In questo regno vivono principalmente druidi, custodi delle antiche tradizioni e dell'equilibrio naturale.
  Fin dalla nascita, però, Reyla era destinata a essere diversa.
  I suoi genitori biologici erano coinvolti in una missione segreta di estrema importanza. Per proteggerla e permettere loro di portare a termine il loro compito, furono costretti ad abbandonarla quando era ancora molto piccola. Reyla non ha mai saputo quale fosse la vera natura della missione, né cosa sia successo ai suoi genitori dopo la loro partenza.
  Fu accolta da una famiglia benestante di Dados, che la adottò e le offrì una vita sicura e agiata. Nonostante l'affetto e le possibilità che la sua nuova famiglia le offriva, Reyla non riuscì mai a sentirsi veramente parte di quel mondo. Dentro di lei rimase sempre una domanda alla quale nessuno sembrava voler dare una risposta: "Perché i miei genitori mi hanno abbandonata?"
  Crescendo, Reyla sviluppò un carattere sempre più indipendente. Era silenziosa, riservata e difficile da comprendere, ma allo stesso tempo incredibilmente curiosa. Osservava il mondo più di quanto ne parlasse e tendeva a non fidarsi facilmente degli altri. La sua curiosità, però, era più forte della paura.
  Cresciuta tra i druidi di Dados, imparò a combattere e a difendersi, ad ascoltare la foresta e a prenderne la forma, sviluppando una grande abilità nel muoversi tra gli alberi e nell'affrontare i pericoli. Ma vivere per sempre a Dados non era ciò che desiderava.
  A diciannove anni, Reyla prese una decisione che avrebbe cambiato per sempre la sua vita. Senza chiedere il permesso alla famiglia adottiva, lasciò la sua casa e decise di oltrepassare i confini di Dados. Sapeva perfettamente che lasciare il regno senza autorizzazione significava infrangere la legge, ma non le importava. Per la prima volta, voleva vedere cosa ci fosse oltre le foreste di Gravion. Ma soprattutto, voleva trovare i suoi veri genitori.
  Da quel giorno Reyla è diventata una fuggitiva, costretta a vivere lontano dalla sicurezza che aveva sempre conosciuto. Viaggia da un luogo all'altro, esplorando terre sconosciute, incontrando persone diverse e cercando ogni possibile traccia che possa condurla alla verità.
  Non sa se i suoi genitori siano ancora vivi. Non sa quale fosse la loro missione. Non sa perché abbiano scelto di lasciarla. E soprattutto, non sa se il motivo per cui l'hanno abbandonata fosse davvero quello che le è stato fatto credere.
  Reyla parla poco del proprio passato e tende a mantenere nascosti i suoi sentimenti. Dietro il suo atteggiamento silenzioso e apparentemente distaccato, però, porta con sé una domanda che non ha mai smesso di tormentarla: chi erano veramente i suoi genitori... e perché hanno dovuto abbandonarla?
  Ora, lontana da Dados e ricercata per aver infranto la legge, Reyla continua il suo viaggio. Non sa dove la porterà la strada. Ma sa che, qualunque sia la verità che troverà alla fine, è pronta ad affrontarla.
