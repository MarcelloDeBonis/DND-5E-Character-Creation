# Reyla — Elfa Alta, Druida (Circolo della Luna) di 3° livello
# Le chiavi (race, class, skills, spells...) usano gli identificatori dei file in dnd5e/rules/.
# Genera la scheda con:  python -m dnd5e build characters/reyla.yaml

name: Reyla
player: "Marcello"
race: elf
subrace: high_elf
class: druid
subclass: moon             # land (richiede circle_terrain) | moon
level: 3
xp: 900
background: outlander      # Forestiero
alignment: NG              # Neutrale Buono

abilities:
  method: point_buy        # point_buy | standard_array | manual | rolled
  base: {str: 8, dex: 14, con: 14, int: 10, wis: 15, cha: 10}   # prima dei bonus razziali (+2 DES, +1 INT)

hp:
  method: average          # average | rolled (hp.rolled: [tiri dal 2° livello]) | manual (hp.value)

skills: [nature, survival]             # 2 abilità di classe
background_skills: [athletics, animal_handling]   # Forestiero dà Atletica e Sopravvivenza: Sopravvivenza è già di classe, sostituita con Addestrare Animali
racial_cantrips: [minor_illusion]      # trucchetto dell'Elfo Alto (lista del mago, Intelligenza)
cantrips: [guidance, produce_flame]    # 2 trucchetti da druido al 3° livello  (PROVVISORI: scegli dalla lista)
spells: [cure_wounds, entangle, faerie_fire, goodberry, moonbeam]   # preparati: mod. SAG (+2) + livello (3) = 5  (PROVVISORI)
languages_extra: [sylvan, dwarvish]    # 1 dalla razza + 1 dal background (Comune, Elfico e Druidico sono automatici)
