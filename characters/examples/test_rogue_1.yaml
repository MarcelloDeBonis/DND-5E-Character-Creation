# TEST: Ladro di 1° livello (nessun archetipo), Halfling Piedelesto, Criminale, array standard
# Genera la scheda con:  python -m dnd5e build characters/examples/test_rogue_1.yaml

name: Pip Sottoponte
template: official_it
player: "Test"
race: halfling
