# TEST: Bardo di 1° livello (nessun collegio), Mezzelfo, Intrattenitore, array standard.
# Genera la scheda con:  python -m dnd5e build characters/examples/test_bard_1.yaml

name: Lirien
template: official_it
player: "Test"
race: half_elf
class: bard
level: 1
xp: 0
background: entertainer      # Intrattenitore: Acrobazia, Intrattenere, trucchi per il camuffamento + 1 strumento
alignment: CG

abilities:
  method: standard_array
  base: {str: 8, dex: 14, con: 13, int: 10, wis: 12, cha: 15}   # prima dei bonus razziali (+2 CAR, +1 DES, +1 COS)
  racial_choice: [dex, con]                                      # Mezzelfo: +1 a due caratteristiche diverse dal Carisma

hp:
