spells: [healing_word, dissonant_whispers, faerie_fire, tashas_hideous_laughter]   # 4 incantesimi conosciuti

armor: leather
weapons: [rapier, dagger]
equipment:
  - pack: entertainers_pack
  - "Liuto"
money: {gp: 15}

personality:
  traits: "Conosco una storia per ogni occasione."
  ideals: "Bellezza. La musica rende il mondo migliore."
  bonds: "Il mio liuto è un regalo del mio maestro."
  flaws: "Non resisto a un pubblico."

appearance:
  age: "24"
  height: "1,70 m"
  weight: "62 kg"
  eyes: "Grigi"
  skin: "Chiara"
  hair: "Neri"
