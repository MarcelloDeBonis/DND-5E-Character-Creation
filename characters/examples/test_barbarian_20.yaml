# TEST: Barbara di 20° livello, Cammino del Combattente Totemico (lupo / aquila / orso), Dragonide (drago d'argento), Marinaia.
# Genera la scheda con:  python -m dnd5e build characters/examples/test_barbarian_20.yaml

name: Vyrsa
