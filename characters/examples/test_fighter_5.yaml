# TEST: Guerriera di 5° livello, Maestra di Battaglia — Umana (Variante), Eroina Popolare. Versione semplice.
# Genera la scheda con:  python -m dnd5e build characters/examples/test_fighter_5.yaml

name: Lyra
template: official_it
player: "Test"
gender: f
simple: true
race: human
subrace: variant_human       # +1 a due caratteristiche, 1 abilità, 1 talento
class: fighter
subclass: battle_master
level: 5
xp: 6500
background: folk_hero        # Eroina Popolare: Addestrare Animali, Sopravvivenza
alignment: NG

abilities:
  method: standard_array     # 15, 14, 13, 12, 10, 8
  base: {str: 8, dex: 15, con: 14, int: 10, wis: 13, cha: 12}
