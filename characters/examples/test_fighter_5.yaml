  traits: "Giudico le persone dalle azioni, non dalle parole."
  ideals: "Equità. Nessuno deve avere privilegi davanti alla legge. (Buona)"
  bonds: "Proteggo il villaggio dove sono cresciuta."
  flaws: "Mi fido troppo di chi sembra sincero."

appearance:
  age: "22"
  height: "1,68 m"
  weight: "58 kg"
  eyes: "Grigi"
  skin: "Abbronzata"
  hair: "Castani, raccolti"

