# TEST: Tiefling, Paladina di 1° livello (nessun giuramento prima del 3°), Accolita.
# Genera la scheda con:  python -m dnd5e build characters/examples/test_paladin_1.yaml

name: Seraphine
template: official_it
player: "Test"
gender: f                   # nomi al femminile
race: tiefling              # +2 CAR, +1 INT; trucchetto taumaturgia (CAR)
class: paladin
level: 1
xp: 0
background: acolyte         # Accolita: Intuizione, Religione, 2 linguaggi
alignment: LG

abilities:
  method: point_buy
  base: {str: 15, dex: 10, con: 14, int: 8, wis: 12, cha: 13}   # 9+2+7+0+4+5 = 27 punti

