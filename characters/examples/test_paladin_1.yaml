weapons: [longsword, javelin]
equipment:
  - "Cotta di maglia"
  - "Scudo"
  - "Spada lunga"
  - "5 giavellotti"
  - pack: priests_pack
money: {gp: 15}

personality:
  traits: "Cito sempre i testi sacri."
  ideals: "Fede. (Legale)"
  bonds: "Il mio tempio."
  flaws: "Giudico chi non ha fede."
