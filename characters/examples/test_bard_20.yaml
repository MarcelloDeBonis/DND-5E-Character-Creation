# TEST: Bardo di 20° livello, Collegio della Sapienza, Tiefling, Saggio, array standard, 3 ASI + 2 talenti.
# Genera la scheda con:  python -m dnd5e build characters/examples/test_bard_20.yaml

name: Malachar
template: official_it
player: "Test"
race: tiefling
class: bard
subclass: lore               # Collegio della Sapienza
level: 20
xp: 355000
background: sage             # Saggio: Arcano, Storia, 2 linguaggi
alignment: N

abilities:
  method: standard_array
  base: {str: 8, dex: 14, con: 13, int: 10, wis: 12, cha: 15}   # razza +1 INT, +2 CAR
  asi:
    - {cha: 1, con: 1}       # 4° livello: CAR 17 -> 18, COS 13 -> 14
    - {cha: 2}               # 8° livello: CAR 18 -> 20
    - {dex: 2}               # 16° livello: DES 14 -> 16
feats:
  - war_caster               # 12° livello
  - alert                    # 19° livello

hp:
  method: average

skills: [persuasion, deception, insight]          # 3 abilità di classe
extra_skills: [perception, stealth, performance]  # Competenze Bonus del Collegio della Sapienza (3)
expertise: [persuasion, deception, perception, performance]   # Maestria al 3° e al 10° livello
tools: ["Liuto", "Viola", "Salterio"]              # i tre strumenti musicali del bardo
languages_extra: [elvish, draconic]                # 2 dal background Saggio

cantrips: [vicious_mockery, minor_illusion, mage_hand, prestidigitation]   # 4 trucchetti (+ Taumaturgia del tiefling)
spells:   # 22 conosciuti (con i 6 Segreti Magici del 10°, 14° e 18°) + 2 Segreti Magici Aggiuntivi del 6° = 24
  - healing_word
  - dissonant_whispers
  - faerie_fire
  - invisibility
  - suggestion
  - hypnotic_pattern
  - dispel_magic
  - greater_invisibility
  - dimension_door
  - polymorph
  - hold_monster
  - greater_restoration
  - ottos_irresistible_dance
  - forcecage
  - power_word_stun
  - foresight
  - counterspell             # Segreti Magici Aggiuntivi (6°)
  - fireball                 # Segreti Magici Aggiuntivi (6°)
  - spirit_guardians         # Segreti Magici (10°)
  - revivify                 # Segreti Magici (10°)
  - destructive_wave         # Segreti Magici (14°)
  - heal                     # Segreti Magici (14°)
  - simulacrum               # Segreti Magici (18°)
  - wish                     # Segreti Magici (18°)

armor: studded_leather
weapons: [rapier, hand_crossbow, dagger]
equipment:
  - pack: diplomats_pack
  - "Liuto"
  - "20 quadrelli"
money: {gp: 2500}

personality:
  traits: "Cito sempre un libro che nessuno ha letto."
  ideals: "Conoscenza. Ogni segreto merita di essere scoperto."
  bonds: "La grande biblioteca di Candelaria è casa mia."
  flaws: "Sottovaluto chi non ha studiato."

appearance:
  age: "60"
  height: "1,80 m"
  weight: "75 kg"
  eyes: "Oro"
  skin: "Rossa"
  hair: "Neri, corna ricurve"
