backstory: |
  Kate è una draconide cresciuta sull'isola del Monte Tha, un'isola separata dal continente di Gravion e collegata ad esso da un lunghissimo ponte. L'isola è abitata quasi esclusivamente dai Rigliovolar, una popolazione di nani conosciuta soprattutto per la produzione di armi. Le loro vite ruotano attorno alle fucine, alla lavorazione dei metalli e alla creazione di armi di altissima qualità.
  Kate, però, non è una nana. Nessuno sa da dove provenga realmente. Quando era ancora molto piccola, venne trovata sola nei pressi del Monte Tha, senza genitori e senza alcun indizio che potesse spiegare come fosse arrivata fin lì. I Rigliovolar non si fecero troppe domande: per loro era semplicemente una bambina che aveva bisogno di essere accolta. La crebbero quindi come una di loro.
  Kate trascorse tutta la sua infanzia tra le fucine dei nani, circondata da armi e fabbri. Mentre gli altri osservavano un'arma pensando a come costruirla o utilizzarla, Kate cercava di comprenderne ogni aspetto. Era affascinata dal combattimento, ma anche dalla strategia, dalla percezione e soprattutto dalla magia.
  Con il tempo iniziò a studiare da sola i poteri arcani, scoprendo di avere una particolare predisposizione per la magia: non solo uno strumento per distruggere un avversario, ma qualcosa capace di ingannare, confondere, proteggere e cambiare completamente il modo di affrontare uno scontro.
  A diciassette anni un gruppo di ladri umani assaltò l'isola per rubare le preziosissime armi dei nani. Kate decise di combattere per difendere la sua casa e, messa alle strette, risvegliò dentro di sé una magia rimasta sepolta per tutta la sua vita. Per la prima volta comprese che quella magia non era soltanto qualcosa che aveva imparato: era qualcosa che le apparteneva.
  Da quel giorno una domanda non l'ha più lasciata: "Da dove vengo?". Kate lasciò l'isola per raggiungere Aeurulia, dove spera di studiare la storia dei draconidi e dei Lunari e di scoprire se esista un legame con la sua misteriosa nascita.
  Nei tre anni successivi affinò enormemente le sue capacità, diventando una maga abile negli inganni e nella manipolazione, capace di vincere con l'astuzia più che con la forza.
  Ora Kate è diretta verso Aeurulia. Il viaggio non sarà semplice: i draconidi sono rari e spesso considerati mostruosi, e Kate ha imparato a convivere con gli sguardi sospettosi. Non conosce i suoi genitori, non sa perché sia stata trovata ai piedi del Monte Tha, né perché dentro di lei fosse nascosto un potere così forte. Aeurulia è il luogo dove spera finalmente di trovare le risposte.
