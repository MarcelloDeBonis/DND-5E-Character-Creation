# Manovre del Maestro di Battaglia (PHB 2014, p. 74).
precision_attack:   {name: Attacco Preciso,      text: "Quando effettui un tiro per colpire con un'arma, puoi spendere un dado di superiorità e aggiungerlo al tiro (anche dopo aver tirato, prima di sapere l'esito)."}
trip_attack:        {name: Attacco Sbilanciante, text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado; se il bersaglio è Grande o più piccolo deve superare un TS su FOR o cade prono."}
menacing_attack:    {name: Attacco Minaccioso,   text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il bersaglio deve superare un TS su SAG o è spaventato da te fino alla fine del tuo prossimo turno."}
disarming_attack:   {name: Attacco Disarmante,   text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il bersaglio deve superare un TS su FOR o lascia cadere un oggetto che impugna."}
pushing_attack:     {name: Attacco Spintonante,  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e, se il bersaglio è Grande o più piccolo, deve superare un TS su FOR o viene spinto di 4,5 m."}
goading_attack:     {name: Attacco Provocante,   text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il bersaglio deve superare un TS su SAG o ha svantaggio agli attacchi contro bersagli diversi da te fino alla fine del tuo prossimo turno."}
distracting_strike: {name: Colpo Distraente,     text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il prossimo tiro per colpire di un alleato contro il bersaglio, entro il tuo prossimo turno, ha vantaggio."}
maneuvering_attack: {name: Attacco di Manovra,   text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e un alleato può usare la reazione per muoversi di metà velocità senza provocare attacchi di opportunità dal bersaglio."}
evasive_footwork:   {name: Gioco di Gambe Evasivo, text: "Quando ti muovi, spendi un dado di superiorità: aggiungi il risultato alla CA finché non smetti di muoverti."}
riposte:            {name: Risposta,             text: "Quando una creatura manca un attacco in mischia contro di te, puoi usare la reazione e un dado di superiorità per un attacco in mischia contro di lei: danni extra pari al dado."}
parry:              {name: Parata,               text: "Quando subisci danni da un attacco in mischia, puoi usare la reazione e un dado di superiorità per ridurre i danni del dado + mod. DES."}
feinting_attack:    {name: Attacco di Finta,     text: "Azione bonus: spendi un dado di superiorità per fintare contro una creatura entro 1,5 m: vantaggio al prossimo attacco contro di lei nel turno e danni extra pari al dado se colpisci."}
lunging_attack:     {name: Attacco in Affondo,   text: "Quando attacchi in mischia, spendi un dado di superiorità per aumentare la portata di 1,5 m; se colpisci, danni extra pari al dado."}
sweeping_attack:    {name: Attacco Radente,      text: "Quando colpisci in mischia, spendi un dado di superiorità per infliggere danni pari al dado a un'altra creatura entro 1,5 m dal bersaglio, se il tiro per colpire la colpirebbe."}
rally:              {name: Incitare,             text: "Azione bonus: spendi un dado di superiorità; un alleato che ti vede o sente ottiene PF temporanei pari al dado + mod. CAR."}
commanders_strike:  {name: Colpo del Comandante, text: "Quando effettui l'azione di Attacco, rinuncia a un attacco e usa l'azione bonus per far attaccare un alleato con la sua reazione: danni extra pari al dado di superiorità."}
