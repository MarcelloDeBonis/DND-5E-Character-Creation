# Manovre del Maestro di Battaglia (PHB 2014, cap. 3, Guerriero). Testi riassunti con parole nostre.
# Nomi italiani come nel Manuale del Giocatore in italiano (elenco delle manovre riportato da
# telodoioildungeon.it; da ricontrollare sul manuale cartaceo se cambia l'edizione).
# Campi:
#   name  nome italiano;  text  regola per la scheda normale (niente segnaposto: il testo non passa da kid_fmt);
#   save  caratteristica del tiro salvezza del bersaglio (str, wis), solo per le manovre che lo chiedono.
#         CD = 8 + bonus di competenza + mod. FOR o DES (a scelta del guerriero);
#   kid   testo per la versione semplice (seconda persona). Segnaposto riempiti dal motore:
#         {t_superiority_die} = il dado di superiorità del livello (d8, poi d10 al 10°, d12 al 18°);
#         {cd_manovre} = la CD delle manovre.
precision_attack:
  name: Attacco Preciso
  text: "Quando effettui un tiro per colpire con un'arma, puoi spendere un dado di superiorità e aggiungerlo al tiro (anche dopo aver tirato, prima di sapere l'esito)."
  kid: "Il tuo tiro per colpire non basta? Spendi un dado di superiorità ({t_superiority_die}), tiralo e aggiungilo al tiro per colpire. Puoi deciderlo dopo aver visto il d20, prima che il Master dica se hai colpito."
trip_attack:
  name: Attacco Sbilanciante
  save: str
  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado; se il bersaglio è Grande o più piccolo deve superare un TS su FOR (CD delle manovre) o cade prono."
  kid: "Quando colpisci con un'arma, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo ai danni. Se il nemico è Grande o più piccolo, fa un tiro salvezza su Forza: se fa meno di {cd_manovre}, cade a terra (prono)."
menacing_attack:
  name: Attacco Minaccioso
  save: wis
  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il bersaglio deve superare un TS su SAG (CD delle manovre) o è spaventato da te fino alla fine del tuo prossimo turno."
  kid: "Quando colpisci con un'arma, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo ai danni. Il nemico fa un tiro salvezza su Saggezza: se fa meno di {cd_manovre}, ha paura di te (spaventato) fino alla fine del tuo prossimo turno."
disarming_attack:
  name: Attacco Disarmante
  save: str
  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il bersaglio deve superare un TS su FOR (CD delle manovre) o lascia cadere ai suoi piedi un oggetto che impugna, scelto da te."
  kid: "Quando colpisci con un'arma, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo ai danni. Scegli una cosa che il nemico tiene in mano, per esempio la spada: lui fa un tiro salvezza su Forza e, se fa meno di {cd_manovre}, gli cade ai piedi."
pushing_attack:
  name: Attacco con Spinta
  save: str
  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e, se il bersaglio è Grande o più piccolo, deve superare un TS su FOR (CD delle manovre) o viene spinto fino a 4,5 m lontano da te."
  kid: "Quando colpisci con un'arma, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo ai danni. Se il nemico è Grande o più piccolo, fa un tiro salvezza su Forza: se fa meno di {cd_manovre}, lo spingi via fino a 4,5 m."
goading_attack:
  name: Attacco Adescante
  save: wis
  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il bersaglio deve superare un TS su SAG (CD delle manovre) o ha svantaggio agli attacchi contro bersagli diversi da te fino alla fine del tuo prossimo turno."
  kid: "Quando colpisci con un'arma, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo ai danni. Il nemico fa un tiro salvezza su Saggezza: se fa meno di {cd_manovre}, fino alla fine del tuo prossimo turno ha svantaggio quando attacca qualcuno che non sei tu. Così proteggi il tuo gruppo!"
distracting_strike:
  name: Colpo Distraente
  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e il prossimo tiro per colpire contro il bersaglio fatto da qualcun altro, prima dell'inizio del tuo prossimo turno, ha vantaggio."
  kid: "Quando colpisci con un'arma, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo ai danni. Il prossimo attacco contro quel nemico fatto da qualcun altro, prima dell'inizio del tuo prossimo turno, ha vantaggio (tira due d20 e tiene il migliore)."
maneuvering_attack:
  name: Attacco con Manovra
  text: "Quando colpisci con un'arma, spendi un dado di superiorità: danni extra pari al dado e un alleato che può vederti o sentirti può usare la reazione per muoversi di metà velocità senza provocare attacchi di opportunità dal bersaglio."
  kid: "Quando colpisci con un'arma, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo ai danni. Scegli qualcuno del tuo gruppo che ti vede o ti sente: con la sua reazione si sposta di metà della sua velocità, e quel nemico non può fargli un attacco di opportunità."
evasive_footwork:
  name: Scarto Elusivo
  text: "Quando ti muovi, spendi un dado di superiorità: aggiungi il risultato alla CA finché non smetti di muoverti."
  kid: "Mentre ti muovi, spendi un dado di superiorità ({t_superiority_die}): tiralo e aggiungilo alla tua CA finché non ti fermi. Così è più difficile colpirti mentre corri."
riposte:
  name: Replica
  text: "Quando una creatura manca un attacco in mischia contro di te, puoi usare la reazione e un dado di superiorità per un attacco in mischia con un'arma contro di lei: se colpisci, danni extra pari al dado."
  kid: "Se un nemico ti attacca da vicino e ti manca, usa la reazione e spendi un dado di superiorità ({t_superiority_die}): lo attacchi subito con la tua arma. Se lo colpisci, tira il dado e aggiungilo ai danni."
parry:
  name: Parata
  text: "Quando una creatura ti infligge danni con un attacco in mischia, puoi usare la reazione e un dado di superiorità per ridurre i danni del dado + mod. DES."
  kid: "Se un nemico ti colpisce da vicino, usa la reazione e spendi un dado di superiorità ({t_superiority_die}): tiralo, aggiungi la tua Destrezza e togli il risultato dai danni."
feinting_attack:
  name: Attacco con Finta
  text: "Azione bonus: spendi un dado di superiorità per fintare contro una creatura entro 1,5 m: vantaggio al prossimo attacco contro di lei nel turno e danni extra pari al dado se colpisci."
  kid: "Con un'azione bonus fai finta di attaccare un nemico vicino (entro 1,5 m) e spendi un dado di superiorità ({t_superiority_die}): in questo turno il tuo prossimo attacco contro di lui ha vantaggio (tiri due d20 e tieni il migliore). Se colpisci, tira il dado e aggiungilo ai danni."
lunging_attack:
  name: Attacco con Affondo
  text: "Quando effettui un attacco in mischia con un'arma nel tuo turno, spendi un dado di superiorità per aumentare la portata di 1,5 m; se colpisci, danni extra pari al dado."
  kid: "Quando attacchi da vicino nel tuo turno, spendi un dado di superiorità ({t_superiority_die}): arrivi 1,5 m più lontano del solito. Se colpisci, tira il dado e aggiungilo ai danni."
sweeping_attack:
  name: Attacco con Spazzata
  text: "Quando colpisci in mischia con un'arma, spendi un dado di superiorità: un'altra creatura entro 1,5 m dal bersaglio e a tua portata subisce danni pari al dado (dello stesso tipo), se il tiro per colpire la colpirebbe."
  kid: "Quando colpisci un nemico da vicino, spendi un dado di superiorità ({t_superiority_die}): scegli un altro nemico accanto a lui (entro 1,5 m) che puoi raggiungere. Se il tuo tiro per colpire basta anche per lui, tira il dado: subisce quei danni."
rally:
  name: Incoraggiamento
  text: "Azione bonus: spendi un dado di superiorità; un alleato che ti vede o sente ottiene PF temporanei pari al dado + mod. CAR."
  kid: "Con un'azione bonus spendi un dado di superiorità ({t_superiority_die}) e fai coraggio a qualcuno del tuo gruppo che ti vede o ti sente: riceve punti ferita temporanei pari al dado + il tuo Carisma."
commanders_strike:
  name: Colpo del Comandante
  text: "Quando effettui l'azione di Attacco, rinuncia a un attacco e usa l'azione bonus per far attaccare un alleato che ti vede o sente con la sua reazione: danni extra pari al dado di superiorità."
  kid: "Quando attacchi, rinuncia a uno dei tuoi attacchi, usa l'azione bonus e spendi un dado di superiorità ({t_superiority_die}): dai un ordine a qualcuno del tuo gruppo che ti vede o ti sente. Con la sua reazione attacca subito con un'arma e aggiunge il dado ai danni."
