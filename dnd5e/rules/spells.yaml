    duration: fino a 1 minuto
    text: Fino a tre creature entro 9 m, per la durata, aggiungono 1d4 a ogni tiro per colpire e tiro salvezza. Una creatura in più per slot superiore. Richiede un pizzico di acqua santa.
    kid: Scegli fino a 3 amici entro 9 m (puoi esserci anche tu). Per 1 minuto, ogni volta che attaccano o fanno un tiro salvezza, tirano anche 1d4 e lo aggiungono al risultato.
    tip: All'inizio di una lotta difficile, sugli amici che attaccano di più.
  command:
    name: Comando
    level: 1
    lists:
    - cleric
    - paladin
    school: ammaliamento
    range: 18
    cast: 1 azione
    duration: 1 round
    save: wis
    text: 'Dai un ordine di una sola parola (per esempio avvicinati, lascia, fuggi, prostrati, fermo) a una creatura che vedi entro 18 m: se fallisce un TS su SAG lo esegue nel suo prossimo turno. Nessun
      effetto sui non morti, su chi non capisce la tua lingua o se l''ordine le farebbe direttamente del male. Una creatura in più per slot superiore (entro 9 m l''una dall''altra).'
    kid: 'Gridi un ordine di una sola parola (Fermo! Scappa! Molla! A terra!) a un nemico entro 18 m. Lui tira un d20 per resistere (tiro salvezza su Saggezza contro {cd}): se fallisce, nel suo turno ubbidisce.
      Non funziona sui non morti.'
    tip: Per fermare un nemico per un turno o fargli lasciare un oggetto.
  compelled_duel:
    name: Duello Obbligato
