    text: 'Reazione quando una creatura che vedi entro 18 m ti danneggia: viene avvolta da fiamme infernali e deve effettuare un TS su DES, subendo 2d10 danni da fuoco se fallisce o metà se supera. +1d10
      per slot superiore.'
    kid: 'Quando un nemico che vedi entro 18 m ti fa male, usi la tua reazione (anche nel suo turno): fiamme infernali lo avvolgono. Lui tira un d20 per resistere (tiro salvezza su Destrezza contro {cd}):
      2d10 danni da fuoco, metà se riesce.'
    tip: 'Quando un nemico ti ferisce: rispondi subito col fuoco.'
  heroism:
