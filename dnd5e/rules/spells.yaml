    school: ammaliamento
    range: 27
    conc: true
    cast: 1 azione bonus
    duration: fino a 1 ora
    damage: 1d6
    damage_type: necrotico
    text: 'Maledici una creatura che vedi entro 27 m: per la durata le infliggi 1d6 danni necrotici extra ogni volta che la colpisci con un attacco, e ha svantaggio alle prove della caratteristica che scegli.
      Se scende a 0 PF, in un tuo turno successivo puoi usare un''azione bonus per maledire un''altra creatura. Con slot di 3° o 4° livello dura fino a 8 ore, con slot di 5° o superiore fino a 24 ore. Richiede
      l''occhio pietrificato di un tritone.'
    kid: Con l'azione bonus maledici un nemico entro 27 m. Per 1 ora, ogni volta che lo colpisci con un attacco fai 1d6 danni necrotici in più. Se va a 0 punti ferita, con un'altra azione bonus sposti la
      maledizione su un altro.
    tip: All'inizio della lotta, sul nemico che colpirai più volte.
  hunters_mark:
    name: Marchio del Cacciatore
    level: 1
    lists:
    - ranger
    school: divinazione
    range: 27
    conc: true
    cast: 1 azione bonus
    duration: fino a 1 ora
    damage: 1d6
    text: 'Marchi una creatura che vedi entro 27 m: per la durata le infliggi 1d6 danni extra ogni volta che la colpisci con un attacco con arma, e hai vantaggio alle prove di Saggezza (Percezione) o Saggezza
      (Sopravvivenza) per trovarla. I danni extra sono dello stesso tipo dell''arma. Se scende a 0 PF, in un tuo turno successivo puoi usare un''azione bonus per marchiare un''altra creatura. Con slot di
      3° o 4° livello dura fino a 8 ore, con slot di 5° o superiore fino a 24 ore.'
    kid: Con l'azione bonus segni un nemico entro 27 m. Per 1 ora, ogni volta che lo colpisci con un'arma fai 1d6 danni in più, e trovarlo è più facile. Se va a 0 punti ferita, sposti il segno su un altro.
    tip: All'inizio della lotta, sul nemico più forte che colpirai più volte.

