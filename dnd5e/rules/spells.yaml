    kid: 'Con l''azione bonus carichi l''arma di rabbia: al prossimo colpo in mischia fai +1d6 danni psichici. Il nemico tira un d20 per resistere (tiro salvezza su Saggezza contro {cd}): se fallisce ha paura
      di te, attacca con svantaggio (2 d20, tiene il più basso) e non può avvicinarsi.'
    tip: 'Contro un nemico pericoloso: con la paura ti colpirà molto meno.'

