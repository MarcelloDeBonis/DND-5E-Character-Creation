      superiore al 1°. Richiede una coppa d'acqua.
    kid: 'Ti copri di brina magica: per 1 ora hai 5 punti ferita extra. Finché ti restano, chi ti colpisce da vicino subisce 5 danni da freddo. Con uno slot di 2° livello: 10 e 10.'
    tip: Prima di una lotta corpo a corpo, quando i nemici ti verranno addosso.
  arms_of_hadar:
    name: Braccia di Hadar
