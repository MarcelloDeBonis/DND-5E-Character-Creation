    save: wis
    text: Una creatura che vedi entro 9 m deve superare un TS su SAG o, per la durata, ha svantaggio ai tiri per colpire contro creature diverse da te e deve superare un TS su SAG ogni volta che prova a spostarsi
      a più di 9 m da te. Termina se attacchi un'altra creatura, lanci un incantesimo contro un'altra creatura ostile, un tuo alleato danneggia il bersaglio o gli lancia un incantesimo dannoso, o finisci
      il turno a più di 9 m da lui.
    kid: 'Con l''azione bonus sfidi un nemico entro 9 m: tira un d20 per resistere (tiro salvezza su Saggezza contro {cd}). Se fallisce, per 1 minuto attacca gli altri con 2 d20 tenendo il più basso. Finisce
      se attacchi altri o i tuoi amici lo colpiscono.'
    tip: 'Per proteggere un amico debole: il nemico pensa solo a te.'
  detect_evil_and_good:
    name: Individuazione del Bene e del Male
    level: 1
    lists:
    - cleric
    - paladin
    school: divinazione
    range: personale
    conc: true
    cast: 1 azione
    duration: fino a 10 minuti
    text: Per 10 minuti sai se entro 9 m da te ci sono aberrazioni, celestiali, elementali, folletti, immondi o non morti e dove si trovano, e se un luogo o un oggetto entro 9 m è stato consacrato o profanato
      con la magia. Bloccato da 30 cm di pietra, 2,5 cm di metallo comune, una sottile lamina di piombo o 90 cm di legno o terra.
    kid: Per 10 minuti senti se entro 9 m ci sono demoni, angeli, folletti, elementali, non morti o mostri alieni (aberrazioni), e sai dove sono. Senti anche i posti benedetti o maledetti. I muri spessi bloccano
      la magia.
    tip: Quando entri in un posto sospetto, per scoprire mostri nascosti.
  dissonant_whispers:
    name: Sussurri Dissonanti
    level: 1
    lists:
    - bard
    school: ammaliamento
    range: 18
    cast: 1 azione
    duration: istantanea
    save: wis
    damage: 3d6
    damage_type: psichico
    text: 'Una creatura a tua scelta entro 18 m (solo lei sente la melodia) deve effettuare un TS su SAG: se fallisce subisce 3d6 danni psichici e deve usare subito la sua reazione, se può, per allontanarsi
      da te il più possibile (senza entrare in pericoli evidenti come fuoco o burroni); se supera subisce metà danni e non si muove. Una creatura assordata supera automaticamente. +1d6 per slot superiore.'
    kid: 'Sussurri una melodia orribile che sente solo un nemico entro 18 m. Lui tira un d20 per resistere (tiro salvezza su Saggezza contro {cd}): se fallisce subisce 3d6 danni e scappa lontano da te; se
      riesce, metà danni.'
    tip: 'Quando un nemico ti sta addosso: lo ferisce e lo fa scappare.'
