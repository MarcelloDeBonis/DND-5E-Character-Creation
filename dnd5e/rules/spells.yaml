    save: cha
    text: 'Fino a tre creature che vedi entro 9 m devono superare un TS su CAR: chi fallisce, per la durata, sottrae 1d4 a ogni tiro per colpire e tiro salvezza. Una creatura in più per slot superiore. Richiede
      una goccia di sangue.'
    kid: 'Scegli fino a 3 nemici entro 9 m. Ognuno tira un d20 per resistere (tiro salvezza su Carisma contro {cd}). Chi fallisce, per 1 minuto, toglie 1d4 a ogni suo attacco e tiro salvezza: sbaglia più
      spesso.'
    tip: All'inizio di una lotta contro 2 o 3 nemici forti.
  bless:
    name: Benedizione
    level: 1
    lists:
