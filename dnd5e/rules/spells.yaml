      quando l'incantesimo termina perde quelli rimasti. Una creatura in più per slot superiore.
    kid: 'Tocchi un amico (o te stessa): per 1 minuto non ha paura di niente e all''inizio di ogni suo turno ha punti ferita extra pari al tuo modificatore ({mod}). Alla fine li perde.'
