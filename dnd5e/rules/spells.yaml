    range: personale
    conc: true
    cast: 1 azione bonus
    duration: fino a 1 minuto
    save: wis
    damage: 1d6
    damage_type: psichico
    text: 'Azione bonus: la prossima volta che colpisci con un attacco con arma in mischia, infliggi 1d6 danni psichici extra; se il bersaglio è una creatura, deve superare un TS su SAG o è spaventato da
