# Classi del Manuale del Giocatore (PHB 2014). Il Guerriero è completo (privilegi 1-20 + archetipi).
# Le altre classi hanno i dati strutturali (dado vita, TS, competenze, abilità) e i privilegi dei primi livelli.
# features: per livello, lista di {name, short, text}. Le voci con "level" dentro un archetipo seguono lo stesso schema.
fighter:
  name: Guerriero
  name_en: Fighter
  hit_die: 10
  saves: [str, con]
  armor: [light, medium, heavy, shields]
  weapons: [simple, martial]
  tools: []
  skill_choices:
    count: 2
    from: [acrobatics, animal_handling, athletics, history, insight, intimidation, perception, survival]
  starting_equipment:
    - choice: ["Cotta di maglia", "Armatura di cuoio, arco lungo e 20 frecce"]
    - choice: ["Un'arma da guerra e uno scudo", "Due armi da guerra"]
    - choice: ["Una balestra leggera e 20 quadrelli", "Due asce"]
    - choice: ["Dotazione da esploratore di sotterranei", "Dotazione da esploratore"]
  subclass_level: 3
  subclass_label: Archetipo Marziale
  asi_levels: [4, 6, 8, 12, 14, 16, 19]
  features:
    1:
      - name: Stile di Combattimento
        short: "Adotti uno stile di combattimento come specialità (vedi sotto)."
        text: "Il guerriero adotta uno stile di combattimento particolare come sua specialità. Non può scegliere lo stesso stile più di una volta, anche se in seguito può sceglierne un altro."
      - name: Recupero Energie
        short: "Azione bonus: recuperi 1d10 + livello da guerriero PF. 1/riposo breve o lungo."
        text: "Il guerriero dispone di una riserva limitata di resistenza a cui attingere per proteggersi. Nel suo turno può usare un'azione bonus per recuperare un numero di punti ferita pari a 1d10 + il suo livello da guerriero. Una volta usato, deve completare un riposo breve o lungo prima di poterlo usare di nuovo."
    2:
      - name: Azione Impetuosa
        short: "Nel tuo turno effettui un'azione aggiuntiva. 1/riposo breve o lungo (2 usi dal 17°)."
        text: "Il guerriero può spingersi oltre i suoi normali limiti per un momento. Nel suo turno può effettuare un'azione aggiuntiva oltre alla sua azione normale e a un'eventuale azione bonus. Una volta usato, deve completare un riposo breve o lungo prima di poterlo usare di nuovo. Dal 17° livello può usarlo due volte prima di un riposo, ma solo una volta nello stesso turno."
    3:
      - name: Archetipo Marziale
        short: "Scegli un archetipo (Campione, Maestro di Battaglia o Cavaliere Mistico)."
        text: "Al 3° livello il guerriero sceglie un archetipo che si impegna a emulare nei suoi stili e tecniche di combattimento. L'archetipo scelto conferisce privilegi al 3°, 7°, 10°, 15° e 18° livello."
    4:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Il guerriero può aumentare un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegliere un talento."
    5:
      - name: Attacco Extra
        short: "Quando effettui l'azione di Attacco, attacchi due volte."
        text: "Il guerriero può attaccare due volte, anziché una, ogni volta che effettua l'azione di Attacco nel suo turno. Il numero di attacchi aumenta a tre all'11° livello e a quattro al 20°."
    6:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    8:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    9:
      - name: Indomito
        short: "Puoi ripetere un TS fallito. 1/riposo lungo (2 al 13°, 3 al 17°)."
        text: "Il guerriero può ripetere un tiro salvezza fallito, ma deve usare il nuovo risultato. Può usarlo una volta per riposo lungo; due volte dal 13° livello e tre dal 17°."
    11:
      - name: Attacco Extra (2)
        short: "Attacchi tre volte con l'azione di Attacco."
        text: "Il guerriero attacca tre volte quando effettua l'azione di Attacco."
    12:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    13:
      - name: Indomito (2 usi)
        short: "Due usi di Indomito per riposo lungo."
        text: "Vedi 9° livello."
    14:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    16:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    17:
      - name: Azione Impetuosa (2 usi)
        short: "Due usi di Azione Impetuosa per riposo."
        text: "Vedi 2° livello."
      - name: Indomito (3 usi)
        short: "Tre usi di Indomito per riposo lungo."
        text: "Vedi 9° livello."
    19:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    20:
      - name: Attacco Extra (3)
        short: "Attacchi quattro volte con l'azione di Attacco."
        text: "Il guerriero attacca quattro volte quando effettua l'azione di Attacco."
  subclasses:
    champion:
      name: Campione
      name_en: Champion
      features:
        3:
          - name: Critico Migliorato
            short: "I tuoi attacchi con le armi ottengono un colpo critico con 19 o 20."
            text: "Gli attacchi con le armi del guerriero mettono a segno un colpo critico quando il tiro del d20 è 19 o 20."
        7:
          - name: Atleta Straordinario
            short: "Aggiungi metà del bonus di competenza (arrotondato per eccesso) alle prove di FOR, DES e COS senza competenza. Salto in lungo con rincorsa +30 cm."
            text: "Il guerriero aggiunge la metà del suo bonus di competenza (arrotondato per eccesso) a qualsiasi prova di Forza, Destrezza o Costituzione che non usi già il bonus di competenza. Inoltre, quando effettua un salto in lungo con rincorsa, la distanza aumenta di un numero di centimetri pari a 30 x il suo modificatore di Forza."
        10:
          - name: Stile di Combattimento Aggiuntivo
            short: "Scegli un secondo stile di combattimento."
            text: "Il guerriero sceglie una seconda opzione dal privilegio Stile di Combattimento."
        15:
          - name: Critico Superiore
            short: "Colpo critico con 18, 19 o 20."
            text: "Gli attacchi con le armi del guerriero mettono a segno un colpo critico quando il tiro del d20 è 18, 19 o 20."
        18:
          - name: Sopravvissuto
            short: "All'inizio del tuo turno, se hai meno di metà PF e almeno 1, recuperi 5 + mod. COS PF."
            text: "All'inizio di ogni suo turno, il guerriero recupera punti ferita pari a 5 + il suo modificatore di Costituzione se gli rimane non più della metà dei suoi punti ferita (e almeno 1)."
    battle_master:
      name: Maestro di Battaglia
      name_en: Battle Master
      features:
        3:
          - name: Superiorità in Combattimento
            short: "Conosci 3 manovre e hai 4 dadi di superiorità (d8), recuperati con un riposo breve o lungo. CD manovre = 8 + comp. + mod. FOR o DES."
            text: "Il guerriero apprende tre manovre a sua scelta e dispone di quattro dadi di superiorità (d8), che recupera al termine di un riposo breve o lungo. Alcune manovre richiedono un tiro salvezza: CD = 8 + bonus di competenza + modificatore di Forza o Destrezza (a scelta). Apprende altre manovre al 7°, 10° e 15° livello; ottiene un dado in più al 7° e al 15°; i dadi diventano d10 al 10° e d12 al 18°."
          - name: Studioso di Guerra
            short: "Competenza in uno strumento da artigiano a scelta."
            text: "Il guerriero ottiene competenza in uno strumento da artigiano a sua scelta."
        7:
          - name: Conosci il Tuo Nemico
            short: "Osservando una creatura per 1 minuto, scopri alcune delle sue capacità rispetto alle tue."
            text: "Se il guerriero trascorre almeno 1 minuto a osservare o interagire con un'altra creatura fuori dal combattimento, può apprendere alcune informazioni sulle capacità di quella creatura rispetto alle sue (Forza, Destrezza, Costituzione, Classe Armatura, punti ferita attuali, livelli di classe totali, livelli da guerriero): due a scelta."
        10:
          - name: Superiorità Migliorata
            short: "I dadi di superiorità diventano d10."
            text: "I dadi di superiorità diventano d10."
        15:
          - name: Implacabile
            short: "Quando tiri iniziativa senza dadi di superiorità, ne recuperi 1."
            text: "Quando il guerriero tira per l'iniziativa e non ha più dadi di superiorità, ne recupera uno."
        18:
          - name: Superiorità Migliorata (d12)
            short: "I dadi di superiorità diventano d12."
            text: "I dadi di superiorità diventano d12."
    eldritch_knight:
      name: Cavaliere Mistico
      name_en: Eldritch Knight
      spellcasting: {ability: int, list: wizard, type: third}
      features:
        3:
          - name: Incantesimi
            short: "Conosci 2 trucchetti e 3 incantesimi da mago (abiurazione/invocazione). Caratteristica: Intelligenza."
            text: "Il guerriero apprende a lanciare incantesimi da mago: 2 trucchetti e 3 incantesimi di 1° livello (due dalle scuole di abiurazione o invocazione, uno qualsiasi). Caratteristica da incantatore: Intelligenza. CD tiro salvezza = 8 + bonus di competenza + modificatore di Intelligenza; bonus di attacco = bonus di competenza + modificatore di Intelligenza."
          - name: Legame con l'Arma
            short: "Rituale di 1 ora: leghi un'arma (max 2). Non puoi essere disarmato e puoi evocarla come azione bonus."
            text: "Il guerriero può eseguire un rituale di 1 ora per creare un legame magico con un'arma. Non può essere disarmato di quell'arma a meno che non sia incapacitato, e se l'arma si trova sullo stesso piano può evocarla nella sua mano come azione bonus. Può avere fino a due armi legate."
        7:
          - name: Magia da Guerra
            short: "Quando usi l'azione per lanciare un trucchetto, puoi fare un attacco con un'arma come azione bonus."
            text: "Quando il guerriero usa la sua azione per lanciare un trucchetto, può effettuare un attacco con un'arma come azione bonus."
        10:
          - name: Colpo Mistico
            short: "Se colpisci una creatura con un'arma, ha svantaggio al prossimo TS contro un tuo incantesimo entro la fine del tuo turno successivo."
            text: "Quando il guerriero colpisce una creatura con un attacco con un'arma, quella creatura ha svantaggio al prossimo tiro salvezza che effettua contro un incantesimo lanciato dal guerriero prima della fine del suo turno successivo."
        15:
          - name: Carica Arcana
            short: "Quando usi Azione Impetuosa puoi teletrasportarti di 9 m."
            text: "Quando usa Azione Impetuosa, il guerriero può teletrasportarsi fino a 9 metri in uno spazio libero che può vedere, prima o dopo l'azione aggiuntiva."
        18:
          - name: Magia da Guerra Migliorata
            short: "Quando usi l'azione per lanciare un incantesimo, puoi fare un attacco con un'arma come azione bonus."
            text: "Quando il guerriero usa la sua azione per lanciare un incantesimo, può effettuare un attacco con un'arma come azione bonus."

# ---- Altre classi: dati strutturali + privilegi iniziali (da estendere quando servono) ----
barbarian:
  name: Barbaro
  name_en: Barbarian
  hit_die: 12
  saves: [str, con]
  armor: [light, medium, shields]
  weapons: [simple, martial]
  skill_choices: {count: 2, from: [animal_handling, athletics, intimidation, nature, perception, survival]}
  subclass_level: 3
  subclass_label: Cammino Primordiale
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Ira, short: "Azione bonus: entri in ira (2 usi/riposo lungo). Vantaggio a prove e TS di FOR, +2 ai danni in mischia, resistenza a contundente/perforante/tagliente.", text: "In battaglia il barbaro combatte con ferocia primordiale. Nel suo turno può entrare in ira come azione bonus. Finché è in ira e non indossa armature pesanti: vantaggio alle prove e ai tiri salvezza su Forza; +2 ai danni degli attacchi in mischia con Forza; resistenza ai danni contundenti, perforanti e taglienti. L'ira dura 1 minuto."}
      - {name: Difesa Senza Armatura, short: "Senza armatura la CA è 10 + mod. DES + mod. COS (scudo consentito).", text: "Quando non indossa alcuna armatura, la Classe Armatura del barbaro è pari a 10 + modificatore di Destrezza + modificatore di Costituzione. Può usare uno scudo."}
    2:
      - {name: Attacco Irruento, short: "Vantaggio agli attacchi in mischia con FOR per il turno, ma gli attacchi contro di te hanno vantaggio fino al tuo prossimo turno.", text: "Quando effettua il primo attacco del suo turno, il barbaro può decidere di attaccare in modo irruento: ottiene vantaggio ai tiri per colpire in mischia con la Forza durante questo turno, ma i tiri per colpire contro di lui hanno vantaggio fino al suo turno successivo."}
      - {name: Percezione del Pericolo, short: "Vantaggio ai TS su DES contro effetti che puoi vedere.", text: "Il barbaro ha vantaggio ai tiri salvezza su Destrezza contro effetti che può vedere, purché non sia accecato, assordato o incapacitato."}
    3:
      - {name: Cammino Primordiale, short: "Scegli un cammino (Berserker o Combattente Totemico).", text: "Il barbaro sceglie un cammino che plasma la natura della sua ira."}

bard:
  name: Bardo
  name_en: Bard
  hit_die: 8
  saves: [dex, cha]
  armor: [light]
  weapons: [simple, hand_crossbow, longsword, rapier, shortsword]
  tools: ["Tre strumenti musicali a scelta"]
  skill_choices: {count: 3, from: [acrobatics, animal_handling, arcana, athletics, deception, history, insight, intimidation, investigation, medicine, nature, perception, performance, persuasion, religion, sleight_of_hand, stealth, survival]}
  spellcasting: {ability: cha, type: full}
  subclass_level: 3
  subclass_label: Collegio Bardico
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Incantesimi, short: "Incantatore completo (Carisma).", text: "Il bardo lancia incantesimi usando il Carisma come caratteristica da incantatore."}
      - {name: Ispirazione Bardica, short: "Azione bonus: una creatura entro 18 m ottiene un d6 da aggiungere a una prova, attacco o TS. Usi = mod. CAR per riposo lungo.", text: "Il bardo può ispirare gli altri con parole o musica. Come azione bonus concede a una creatura entro 18 metri un dado di Ispirazione Bardica (d6) da aggiungere a una prova, un tiro per colpire o un tiro salvezza entro 10 minuti."}
    2:
      - {name: Tuttofare, short: "Metà bonus di competenza alle prove senza competenza.", text: "Il bardo aggiunge metà del suo bonus di competenza (per difetto) a ogni prova di caratteristica che non ne beneficia già."}
      - {name: Canto di Riposo, short: "Durante un riposo breve, chi recupera PF con i Dadi Vita ne recupera 1d6 in più.", text: "Durante un riposo breve il bardo può usare musica o oratoria per aiutare i suoi alleati a recuperare: ogni creatura che spende Dadi Vita recupera 1d6 punti ferita aggiuntivi."}
    3:
      - {name: Collegio Bardico, short: "Scegli un collegio (Sapienza o Valore).", text: "Il bardo si unisce a un collegio bardico."}
      - {name: Maestria, short: "Raddoppia il bonus di competenza in due abilità.", text: "Il bardo sceglie due abilità in cui ha competenza: il bonus di competenza è raddoppiato per quelle abilità."}

cleric:
  name: Chierico
  name_en: Cleric
  hit_die: 8
  saves: [wis, cha]
  armor: [light, medium, shields]
  weapons: [simple]
  skill_choices: {count: 2, from: [history, insight, medicine, persuasion, religion]}
  spellcasting: {ability: wis, type: full}
  subclass_level: 1
  subclass_label: Dominio Divino
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Incantesimi, short: "Incantatore completo (Saggezza), prepara gli incantesimi.", text: "Il chierico lancia incantesimi usando la Saggezza come caratteristica da incantatore."}
      - {name: Dominio Divino, short: "Scegli un dominio legato alla tua divinità.", text: "Il chierico sceglie un dominio legato alla sua divinità, che conferisce privilegi e incantesimi di dominio."}
    2:
      - {name: Incanalare Divinità, short: "Scacciare Non Morti + opzione del dominio. 1/riposo breve o lungo.", text: "Il chierico può incanalare energia divina direttamente dalla sua divinità per alimentare effetti magici (Scacciare Non Morti e l'effetto del dominio)."}

druid:
  name: Druido
  name_en: Druid
  hit_die: 8
  saves: [int, wis]
  armor: [light, medium, shields]
  no_metal_armor: true
  weapons: [club, dagger, dart, javelin, mace, quarterstaff, scimitar, sickle, sling, spear]
  tools: ["Borsa da erborista"]
  skill_choices: {count: 2, from: [arcana, animal_handling, insight, medicine, nature, perception, religion, survival]}
  starting_equipment:
    - choice: ["Uno scudo di legno", "Un'arma semplice qualsiasi"]
    - choice: ["Una scimitarra", "Un'arma semplice da mischia qualsiasi"]
    - fixed: ["Armatura di cuoio", "Dotazione da esploratore", "Focus druidico"]
  spellcasting: {ability: wis, type: full, prepared: ability_plus_level, list: druid, ritual: true, focus: "focus druidico"}
  subclass_level: 2
  subclass_label: Circolo Druidico
  asi_levels: [4, 8, 12, 16, 19]
  # Forma Selvatica: limiti per livello (GS massimo, volo, nuoto). Il Circolo della Luna li sostituisce (vedi sotto).
  wild_shape:
    2: {cr: 0.25, fly: false, swim: false, uses: 2}
    4: {cr: 0.5, fly: false, swim: true, uses: 2}
    8: {cr: 1, fly: true, swim: true, uses: 2}
  features:
    1:
      - name: Druidico
        short: "Conosci il Druidico, linguaggio segreto dei druidi; messaggi nascosti riconoscibili solo da chi lo conosce."
        text: "Il druido conosce il Druidico, il linguaggio segreto dei druidi. Può parlarlo e usarlo per lasciare messaggi nascosti: chi conosce il Druidico li individua automaticamente, gli altri devono superare una prova di Saggezza (Percezione) con CD 15 per notarli, senza poterli decifrare senza magia."
      - name: Incantesimi
        short: "Incantatrice completa (Saggezza). Prepari un numero di incantesimi pari a mod. SAG + livello da druido; puoi lanciare i rituali; usi un focus druidico."
        text: "Attingendo all'essenza divina della natura, il druido lancia incantesimi. Conosce tutti i trucchetti scelti e prepara ogni giorno, dalla lista del druido, un numero di incantesimi pari al suo modificatore di Saggezza + il suo livello da druido (minimo 1), di livello per cui ha slot. Caratteristica da incantatore: Saggezza (CD = 8 + bonus di competenza + mod. SAG; attacco = bonus di competenza + mod. SAG). Può lanciare come rituale gli incantesimi preparati con il descrittore rituale e usare un focus druidico come focus."
    2:
      - name: Forma Selvatica
        short: "Azione: ti trasformi in una bestia già vista (vedi tabella in appendice). 2 usi per riposo breve o lungo; dura metà livello ore."
        text: "Il druido può usare la sua azione per assumere magicamente la forma di una bestia che ha già visto, due volte per riposo breve o lungo, per un numero di ore pari alla metà del suo livello da druido (arrotondato per difetto). Può tornare alla forma normale con un'azione bonus; torna automaticamente se scende a 0 PF o se scade la durata. In forma di bestia usa le statistiche della bestia (tranne allineamento, personalità, INT, SAG e CAR, competenze nei TS e nelle abilità), non può lanciare incantesimi né parlare, ma mantiene la concentrazione; quando torna normale riprende i PF che aveva prima, e i danni in eccesso si riversano sulla forma normale. Al 2° livello: GS massimo 1/4, senza velocità di volo o nuoto; al 4°: GS 1/2, senza volo; all'8°: GS 1."
      - name: Circolo Druidico
        short: "Scegli un circolo: Terra o Luna."
        text: "Al 2° livello il druido sceglie di identificarsi con un circolo di druidi: il Circolo della Terra o il Circolo della Luna. La scelta conferisce privilegi al 2°, 6°, 10° e 14° livello."
    4:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Il druido può aumentare un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegliere un talento."
      - name: Forma Selvatica Migliorata
        short: "Forma Selvatica: GS massimo 1/2, senza velocità di volo."
        text: "Dal 4° livello la Forma Selvatica permette bestie di GS massimo 1/2, senza velocità di volo."
    8:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
      - name: Forma Selvatica Migliorata
        short: "Forma Selvatica: GS massimo 1, senza restrizioni."
        text: "Dall'8° livello la Forma Selvatica permette bestie di GS massimo 1, anche con velocità di volo o nuoto."
    12:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    16:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    18:
      - name: Corpo Senza Tempo
        short: "Invecchi 1 anno ogni 10."
        text: "La magia primordiale rallenta l'invecchiamento del druido: per ogni 10 anni trascorsi, il suo corpo invecchia di 1 solo anno."
      - name: Incantesimi Bestiali
        short: "Puoi lanciare molti incantesimi da druido anche in Forma Selvatica (senza componenti materiali)."
        text: "Il druido può lanciare molti dei suoi incantesimi da druido in qualsiasi forma assunta con Forma Selvatica, eseguendo le componenti somatiche e verbali, ma non può fornire componenti materiali."
    19:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
    20:
      - name: Arcidruido
        short: "Forma Selvatica illimitata; ignori le componenti verbali, somatiche e materiali degli incantesimi da druido."
        text: "Il druido può usare Forma Selvatica un numero illimitato di volte e può ignorare le componenti verbali e somatiche dei suoi incantesimi da druido, nonché le componenti materiali prive di costo che non vengono consumate."
  subclasses:
    land:
      name: Circolo della Terra
      name_en: Circle of the Land
      choice_label: "Terreno (circle_terrain): arctic, coast, desert, forest, grassland, mountain, swamp, underdark"
      circle_spells:
        arctic:    {3: ["Blocca Persone", "Crescita di Spine"], 5: ["Tempesta di Nevischio", "Lentezza"], 7: ["Libertà di Movimento", "Tempesta di Ghiaccio"], 9: ["Comunione con la Natura", "Cono di Freddo"]}
        coast:     {3: ["Immagine Speculare", "Passo Velato"], 5: ["Respirare Sott'acqua", "Camminare sull'Acqua"], 7: ["Controllare Acqua", "Libertà di Movimento"], 9: ["Evoca Elementale", "Scrutare"]}
        desert:    {3: ["Sfocatura", "Silenzio"], 5: ["Creare Cibo e Acqua", "Protezione dall'Energia"], 7: ["Deperimento", "Terreno Allucinatorio"], 9: ["Piaga degli Insetti", "Muro di Pietra"]}
        forest:    {3: ["Pelle Coriacea", "Scalare come un Ragno"], 5: ["Evoca Fulmini", "Crescita Vegetale"], 7: ["Divinazione", "Libertà di Movimento"], 9: ["Comunione con la Natura", "Passaggio Arboreo"]}
        grassland: {3: ["Invisibilità", "Passare senza Tracce"], 5: ["Luce Diurna", "Velocità"], 7: ["Divinazione", "Libertà di Movimento"], 9: ["Sogno", "Piaga degli Insetti"]}
        mountain:  {3: ["Scalare come un Ragno", "Crescita di Spine"], 5: ["Palla di Fuoco Esplosiva", "Fondersi nella Pietra"], 7: ["Modellare la Pietra", "Pelle di Pietra"], 9: ["Passapareti", "Muro di Pietra"]}
        swamp:     {3: ["Dardo Acido di Melf", "Oscurità"], 5: ["Respirare Sott'acqua", "Nube Maleodorante"], 7: ["Libertà di Movimento", "Individuazione di Creature"], 9: ["Piaga degli Insetti", "Scrutare"]}
        underdark: {3: ["Nube di Gas Tossico", "Ragnatela"], 5: ["Nube Maleodorante", "Forma Gassosa"], 7: ["Invisibilità Superiore", "Modellare la Pietra"], 9: ["Nube Mortale", "Piaga degli Insetti"]}
      features:
        2:
          - name: Trucchetto Bonus
            short: "Conosci un trucchetto da druido in più."
            text: "Il druido apprende un trucchetto aggiuntivo a sua scelta dalla lista del druido."
            cantrip_bonus: 1
          - name: Recupero Naturale
            short: "1/giorno, dopo un riposo breve, recuperi slot per un totale di livelli pari a metà del livello da druido (per eccesso), nessuno di 6° o superiore."
            text: "Una volta al giorno, durante un riposo breve, il druido può recuperare parte della sua energia magica: slot incantesimo spesi per un totale di livelli pari o inferiore alla metà del suo livello da druido (arrotondato per eccesso), nessuno di 6° livello o superiore."
        3:
          - name: Incantesimi del Circolo
            short: "Incantesimi aggiuntivi sempre preparati, legati al terreno scelto (vedi appendice)."
            text: "Il legame mistico del druido con la terra gli conferisce incantesimi aggiuntivi in base al terreno scelto (artico, costa, deserto, foresta, pascolo, montagna, palude o Sottosuolo). Al 3°, 5°, 7° e 9° livello ottiene accesso a incantesimi del circolo che sono sempre considerati preparati e non contano nel numero di incantesimi preparabili."
        6:
          - name: Passo della Terra
            short: "Terreno difficile naturale non ti costa movimento extra; attraversi piante non magiche senza danni; vantaggio ai TS contro piante magiche."
            text: "Muoversi attraverso terreno difficile non magico non costa al druido movimento extra. Può anche attraversare piante non magiche senza esserne rallentato e senza subire danni da spine o simili. Ha vantaggio ai tiri salvezza contro piante create o manipolate magicamente per impedire il movimento."
        10:
          - name: Egida della Natura
            short: "Immune all'essere affascinato o spaventato da elementali e fate; immune a veleno e malattie."
            text: "Il druido non può essere affascinato o spaventato da elementali o fate, ed è immune al veleno e alle malattie."
        14:
          - name: Santuario della Natura
            short: "Bestie e vegetali che ti attaccano devono superare un TS su SAG (CD incantesimi) o scegliere un altro bersaglio."
            text: "Quando una bestia o una creatura vegetale attacca il druido, deve superare un tiro salvezza su Saggezza contro la CD degli incantesimi del druido; se fallisce, deve scegliere un altro bersaglio o l'attacco manca automaticamente."
    moon:
      name: Circolo della Luna
      name_en: Circle of the Moon
      wild_shape:
        2: {cr: 1, fly: false, swim: false, uses: 2}
        4: {cr: 1, fly: false, swim: true, uses: 2}
        6: {cr: "level/3", fly: false, swim: true, uses: 2}
        8: {cr: "level/3", fly: true, swim: true, uses: 2}
      features:
        2:
          - name: Forma Selvatica da Combattimento
            short: "Forma Selvatica come azione bonus. In forma di bestia, azione bonus: spendi uno slot per recuperare 1d8 PF per livello dello slot."
            text: "Il druido può usare Forma Selvatica come azione bonus anziché come azione. Inoltre, mentre è trasformato, può usare un'azione bonus per spendere uno slot incantesimo e recuperare 1d8 punti ferita per ogni livello dello slot speso."
          - name: Forme del Circolo
            short: "Forma Selvatica fino a GS 1 (dal 6°: GS pari a un terzo del livello da druido). Restano i limiti di volo e nuoto per livello."
            text: "I riti del circolo concedono al druido forme animali più potenti: può trasformarsi in una bestia di GS fino a 1 (ignorando la colonna GS massimo della tabella, ma rispettando le altre restrizioni). Dal 6° livello può trasformarsi in bestie di GS pari a un terzo del suo livello da druido (arrotondato per difetto)."
        6:
          - name: Colpo Primordiale
            short: "Gli attacchi in forma di bestia contano come magici."
            text: "Gli attacchi del druido in forma di bestia contano come magici per superare resistenze e immunità ad attacchi e danni non magici."
        10:
          - name: Forma Selvatica Elementale
            short: "Spendendo due usi di Forma Selvatica ti trasformi in un elementale dell'aria, dell'acqua, della terra o del fuoco."
            text: "Il druido può spendere due usi di Forma Selvatica contemporaneamente per trasformarsi in un elementale dell'aria, dell'acqua, della terra o del fuoco."
        14:
          - name: Mille Forme
            short: "Puoi lanciare alterare se stesso a volontà."
            text: "Il druido ha imparato a usare la magia per alterare la sua forma fisica in modi più sottili: può lanciare alterare se stesso a volontà."
monk:
  name: Monaco
  name_en: Monk
  hit_die: 8
  saves: [str, dex]
  armor: []
  weapons: [simple, shortsword]
  tools: ["Uno strumento da artigiano o musicale a scelta"]
  skill_choices: {count: 2, from: [acrobatics, athletics, history, insight, religion, stealth]}
  subclass_level: 3
  subclass_label: Tradizione Monastica
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Difesa Senza Armatura, short: "Senza armatura né scudo la CA è 10 + mod. DES + mod. SAG.", text: "Quando non indossa armatura né scudo, la Classe Armatura del monaco è pari a 10 + modificatore di Destrezza + modificatore di Saggezza."}
      - {name: Arti Marziali, short: "Con colpi senz'armi e armi da monaco usi DES, danno d4 (cresce con il livello) e attacco senz'armi come azione bonus.", text: "Il monaco può usare la Destrezza per i colpi senz'armi e le armi da monaco, usa un d4 per i danni (d6 al 5°, d8 all'11°, d10 al 17°) e, quando attacca con queste armi, può effettuare un colpo senz'armi come azione bonus."}
    2:
      - {name: Ki, short: "Punti ki = livello da monaco (Raffica di Colpi, Difesa Paziente, Passo del Vento). Recuperati con un riposo breve o lungo.", text: "Il monaco dispone di un numero di punti ki pari al suo livello da monaco, che alimentano Raffica di Colpi, Difesa Paziente e Passo del Vento."}
      - {name: Movimento Senza Armatura, short: "+3 m di velocità senza armatura né scudo.", text: "La velocità del monaco aumenta di 3 metri quando non indossa armatura né scudo."}
    3:
      - {name: Tradizione Monastica, short: "Scegli una tradizione (Mano Aperta, Ombra, Quattro Elementi).", text: "Il monaco sceglie una tradizione monastica."}
      - {name: Deviare Proiettili, short: "Reazione: riduci i danni di un attacco a distanza con arma di 1d10 + mod. DES + livello.", text: "Il monaco può usare la sua reazione per deviare o afferrare un proiettile che lo colpisce, riducendone i danni di 1d10 + modificatore di Destrezza + livello da monaco."}

paladin:
  name: Paladino
  name_en: Paladin
  hit_die: 10
  saves: [wis, cha]
  armor: [light, medium, heavy, shields]
  weapons: [simple, martial]
  skill_choices: {count: 2, from: [athletics, insight, intimidation, medicine, persuasion, religion]}
  spellcasting: {ability: cha, type: half}
  subclass_level: 3
  subclass_label: Giuramento Sacro
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Percezione del Divino, short: "Azione: percepisci celestiali, immondi e non morti entro 18 m. Usi = 1 + mod. CAR per riposo lungo.", text: "Il paladino può usare la sua azione per percepire la presenza di celestiali, immondi e non morti entro 18 metri."}
      - {name: Imposizione delle Mani, short: "Riserva di PF curativi = 5 x livello; 5 PF per curare una malattia o neutralizzare un veleno.", text: "Il paladino dispone di una riserva di potere curativo pari a 5 x il suo livello da paladino, che si ricarica con un riposo lungo."}
    2:
      - {name: Stile di Combattimento, short: "Scegli uno stile (Difesa, Duello, Armi Possenti, Protezione).", text: "Il paladino adotta uno stile di combattimento come sua specialità."}
      - {name: Incantesimi, short: "Mezzo incantatore (Carisma), prepara gli incantesimi.", text: "Il paladino lancia incantesimi usando il Carisma."}
      - {name: Punizione Divina, short: "Quando colpisci in mischia puoi spendere uno slot per infliggere 2d8 danni radiosi extra (+1d8 per livello di slot oltre il 1°).", text: "Quando il paladino colpisce una creatura con un attacco con arma da mischia, può spendere uno slot incantesimo per infliggere danni radiosi aggiuntivi: 2d8 per uno slot di 1° livello, +1d8 per ogni livello superiore (max 5d8), +1d8 contro non morti o immondi."}
    3:
      - {name: Salute Divina, short: "Immune alle malattie.", text: "La magia divina che scorre nel paladino lo rende immune alle malattie."}
      - {name: Giuramento Sacro, short: "Scegli un giuramento (Devozione, Antichi, Vendetta).", text: "Il paladino pronuncia il giuramento che lo lega per sempre alla causa della rettitudine."}

ranger:
  name: Ranger
  name_en: Ranger
  hit_die: 10
  saves: [str, dex]
  armor: [light, medium, shields]
  weapons: [simple, martial]
  skill_choices: {count: 3, from: [animal_handling, athletics, insight, investigation, nature, perception, stealth, survival]}
  spellcasting: {ability: wis, type: half}
  subclass_level: 3
  subclass_label: Archetipo del Ranger
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Nemico Prescelto, short: "Scegli un tipo di nemico: vantaggio alle prove di Sopravvivenza per seguirlo e di Intelligenza per ricordare informazioni; impari un linguaggio.", text: "Il ranger sceglie un tipo di nemico prescelto. Ha vantaggio alle prove di Saggezza (Sopravvivenza) per seguire le tracce dei suoi nemici prescelti e alle prove di Intelligenza per ricordare informazioni su di loro."}
      - {name: Esploratore Nato, short: "Scegli un terreno prescelto: prove di INT/SAG raddoppiate, nessun rallentamento, sempre all'erta, cibo doppio, tracce dettagliate.", text: "Il ranger sceglie un terreno prescelto in cui ha particolare familiarità e ottiene vari benefici quando viaggia in quel tipo di terreno."}
    2:
      - {name: Stile di Combattimento, short: "Scegli uno stile (Tiro, Difesa, Duello, Due Armi).", text: "Il ranger adotta uno stile di combattimento come sua specialità."}
      - {name: Incantesimi, short: "Mezzo incantatore (Saggezza).", text: "Il ranger lancia incantesimi usando la Saggezza."}
    3:
      - {name: Archetipo del Ranger, short: "Scegli un archetipo (Cacciatore o Signore delle Bestie).", text: "Il ranger sceglie un archetipo che si impegna a emulare."}
      - {name: Consapevolezza Primordiale, short: "Spendi uno slot: per 1 minuto per livello percepisci aberrazioni, celestiali, draghi, elementali, fate, immondi e non morti entro 1,5 km.", text: "Il ranger può spendere uno slot incantesimo per concentrarsi sulla percezione dell'ambiente circostante."}

rogue:
  name: Ladro
  name_en: Rogue
  hit_die: 8
  saves: [dex, int]
  armor: [light]
  weapons: [simple, hand_crossbow, longsword, rapier, shortsword]
  tools: ["Arnesi da scasso"]
  skill_choices: {count: 4, from: [acrobatics, athletics, deception, insight, intimidation, investigation, perception, performance, persuasion, sleight_of_hand, stealth]}
  subclass_level: 3
  subclass_label: Archetipo del Ladro
  asi_levels: [4, 8, 10, 12, 16, 19]
  features:
    1:
      - {name: Maestria, short: "Raddoppia il bonus di competenza in due abilità (o una e gli arnesi da scasso).", text: "Il ladro sceglie due competenze tra le abilità e gli arnesi da scasso: il bonus di competenza raddoppia. Al 6° livello ne sceglie altre due."}
      - {name: Attacco Furtivo, short: "1 volta per turno, +1d6 danni (cresce con il livello) con arma di precisione o a distanza se hai vantaggio o un alleato è adiacente al bersaglio.", text: "Una volta per turno il ladro può infliggere 1d6 danni extra a una creatura che colpisce con un attacco se ha vantaggio al tiro per colpire, oppure se un alleato è entro 1,5 metri dal bersaglio. L'attacco deve usare un'arma di precisione o a distanza. Il danno aumenta di 1d6 ogni due livelli da ladro."}
      - {name: Gergo dei Ladri, short: "Conosci il gergo segreto dei ladri.", text: "Il ladro conosce il gergo dei ladri, una mescolanza segreta di dialetto, gergo e codice."}
    2:
      - {name: Azione Scaltra, short: "Azione bonus: Scatto, Disimpegno o Nascondersi.", text: "Il ladro può usare un'azione bonus in ogni suo turno per effettuare l'azione di Scatto, Disimpegno o Nascondersi."}
    3:
      - {name: Archetipo del Ladro, short: "Scegli un archetipo (Furfante, Assassino, Mistificatore Arcano).", text: "Il ladro sceglie un archetipo che emula nell'esercizio delle sue capacità."}

sorcerer:
  name: Stregone
  name_en: Sorcerer
  hit_die: 6
  saves: [con, cha]
  armor: []
  weapons: [dagger, dart, sling, quarterstaff, light_crossbow]
  skill_choices: {count: 2, from: [arcana, deception, insight, intimidation, persuasion, religion]}
  spellcasting: {ability: cha, type: full}
  subclass_level: 1
  subclass_label: Origine Stregonesca
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Incantesimi, short: "Incantatore completo (Carisma).", text: "Lo stregone lancia incantesimi usando il Carisma."}
      - {name: Origine Stregonesca, short: "Scegli un'origine (Discendenza Draconica o Magia Selvaggia).", text: "Lo stregone sceglie l'origine del suo potere innato."}
    2:
      - {name: Fonte di Magia, short: "Punti stregoneria = livello; crea slot o converti slot in punti.", text: "Lo stregone dispone di punti stregoneria pari al suo livello, con cui crea slot incantesimo o alimenta la metamagia."}
    3:
      - {name: Metamagia, short: "Scegli due opzioni di metamagia.", text: "Lo stregone apprende due opzioni di metamagia per plasmare i suoi incantesimi."}

warlock:
  name: Warlock
  name_en: Warlock
  hit_die: 8
  saves: [wis, cha]
  armor: [light]
  weapons: [simple]
  skill_choices: {count: 2, from: [arcana, deception, history, intimidation, investigation, nature, religion]}
  spellcasting: {ability: cha, type: pact}
  subclass_level: 1
  subclass_label: Patrono Ultraterreno
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Patrono Ultraterreno, short: "Scegli un patrono (Arcifata, Immondo, Grande Antico).", text: "Il warlock ha stretto un patto con un essere ultraterreno."}
      - {name: Magia del Patto, short: "Incantesimi (Carisma) con slot di patto recuperati con un riposo breve.", text: "Il warlock lancia incantesimi usando il Carisma; i suoi slot si ricaricano dopo un riposo breve o lungo."}
    2:
      - {name: Suppliche Occulte, short: "Scegli due suppliche occulte.", text: "Il warlock apprende frammenti di conoscenza proibita che gli conferiscono capacità magiche permanenti."}
    3:
      - {name: Dono del Patto, short: "Scegli un dono (Catena, Lama, Tomo).", text: "Il patrono concede al warlock un dono per il suo servizio."}

wizard:
  name: Mago
  name_en: Wizard
  hit_die: 6
  saves: [int, wis]
  armor: []
  weapons: [dagger, dart, sling, quarterstaff, light_crossbow]
  skill_choices: {count: 2, from: [arcana, history, insight, investigation, medicine, religion]}
  spellcasting: {ability: int, type: full}
  subclass_level: 2
  subclass_label: Tradizione Arcana
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Incantesimi, short: "Incantatore completo (Intelligenza), libro degli incantesimi, prepara gli incantesimi.", text: "Il mago lancia incantesimi usando l'Intelligenza e li registra nel suo libro degli incantesimi."}
      - {name: Recupero Arcano, short: "1/giorno dopo un riposo breve recuperi slot per un totale di livelli pari a metà del livello da mago (per eccesso).", text: "Una volta al giorno, al termine di un riposo breve, il mago può recuperare slot incantesimo per un valore complessivo pari a metà del suo livello da mago (arrotondato per eccesso), nessuno di livello 6 o superiore."}
    2:
      - {name: Tradizione Arcana, short: "Scegli una scuola di magia.", text: "Il mago sceglie una tradizione arcana che plasma la sua pratica della magia."}
