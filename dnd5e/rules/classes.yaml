    20:
      - name: Ripristino Stregonesco
        short: "Quando completi un riposo breve, recuperi 4 punti stregoneria spesi."
        text: "Al 20° livello lo stregone recupera 4 punti stregoneria spesi ogni volta che completa un riposo breve."
        kid: "Dopo ogni riposo breve recuperi 4 punti stregoneria che avevi già usato."
  option_lists:
    metamagic:
      label: Metamagia
      count_table: metamagic_known
      items:
        careful_spell:
          name: Incantesimo Preciso
          cost: 1
          short: "1 punto stregoneria: quando un tuo incantesimo impone un TS, scegli fino a mod. CAR creature (minimo 1) che lo superano automaticamente."
          text: "Quando lo stregone lancia un incantesimo che obbliga altre creature a effettuare un tiro salvezza, può proteggere alcune di esse dalla piena forza dell'incantesimo: spende 1 punto stregoneria e sceglie un numero di creature pari al massimo al suo modificatore di Carisma (minimo una). Ogni creatura scelta supera automaticamente il suo tiro salvezza contro l'incantesimo."
          kid: "Spendi 1 punto stregoneria quando lanci un incantesimo che fa fare un tiro salvezza: scegli tanti amici quanto il tuo bonus di Carisma ({mod}, almeno 1). Loro superano il tiro salvezza senza tirare il dado."
        distant_spell:
          name: Incantesimo Distante
          cost: 1
          short: "1 punto stregoneria: raddoppi la gittata di un incantesimo (gittata di almeno 1,5 m); se la gittata è a contatto diventa 9 m."
          text: "Quando lo stregone lancia un incantesimo che ha una gittata pari o superiore a 1,5 metri, può spendere 1 punto stregoneria per raddoppiarne la gittata. Quando lancia un incantesimo con gittata a contatto, può spendere 1 punto stregoneria per portare la gittata a 9 metri."
          kid: "Spendi 1 punto stregoneria: il tuo incantesimo arriva al doppio della distanza. Se di solito devi toccare il bersaglio, invece arriva fino a 9 m."
        empowered_spell:
          name: Incantesimo Potenziato
          cost: 1
          short: "1 punto stregoneria: quando tiri i danni di un incantesimo, ritiri fino a mod. CAR dadi (minimo 1) e usi i nuovi risultati. Si può combinare con un'altra Metamagia."
          text: "Quando lo stregone tira i danni di un incantesimo, può spendere 1 punto stregoneria per ripetere il tiro di un numero di dadi dei danni pari al massimo al suo modificatore di Carisma (minimo uno). Deve usare i nuovi risultati. Può usare Incantesimo Potenziato anche se ha già usato un'opzione di Metamagia diversa durante il lancio dell'incantesimo."
          kid: "Quando tiri i danni di un incantesimo, spendi 1 punto stregoneria: ritira i dadi andati male (quanti il tuo bonus di Carisma {mod}, almeno 1) e tieni i nuovi numeri."
        extended_spell:
          name: Incantesimo Esteso
          cost: 1
          short: "1 punto stregoneria: raddoppi la durata di un incantesimo che dura almeno 1 minuto (massimo 24 ore)."
          text: "Quando lo stregone lancia un incantesimo che ha una durata pari o superiore a 1 minuto, può spendere 1 punto stregoneria per raddoppiarne la durata, fino a un massimo di 24 ore."
          kid: "Spendi 1 punto stregoneria: un incantesimo che dura almeno 1 minuto dura il doppio (al massimo 24 ore)."
        heightened_spell:
          name: Incantesimo Intensificato
          cost: 3
          short: "3 punti stregoneria: un bersaglio dell'incantesimo ha svantaggio al primo TS contro di esso."
          text: "Quando lo stregone lancia un incantesimo che obbliga una creatura a effettuare un tiro salvezza per resistere ai suoi effetti, può spendere 3 punti stregoneria per infliggere svantaggio a un bersaglio dell'incantesimo al primo tiro salvezza che effettua contro di esso."
          kid: "Spendi 3 punti stregoneria: un nemico colpito dal tuo incantesimo, per resistere la prima volta, tira 2 d20 e tiene il più basso (svantaggio)."
        quickened_spell:
          name: Incantesimo Rapido
          cost: 2
          short: "2 punti stregoneria: un incantesimo con tempo di lancio di 1 azione si lancia con 1 azione bonus. Nello stesso turno puoi lanciare solo un altro trucchetto da 1 azione."
          text: "Quando lo stregone lancia un incantesimo che ha un tempo di lancio di 1 azione, può spendere 2 punti stregoneria per cambiare il tempo di lancio in 1 azione bonus per quel lancio. Regola generale: se lancia un incantesimo come azione bonus, nello stesso turno può lanciare solo un altro incantesimo, che deve essere un trucchetto con tempo di lancio di 1 azione."
          kid: "Spendi 2 punti stregoneria: un incantesimo che di solito richiede 1 azione lo lanci con l'azione bonus. Ricorda: in quel turno, come altra magia, puoi lanciare solo un trucchetto."
        subtle_spell:
          name: Incantesimo Celato
          cost: 1
          short: "1 punto stregoneria: lanci un incantesimo senza componenti verbali né somatiche."
          text: "Quando lo stregone lancia un incantesimo, può spendere 1 punto stregoneria per lanciarlo senza alcuna componente somatica o verbale."
          kid: "Spendi 1 punto stregoneria: lanci l'incantesimo senza parlare e senza muovere le mani, così nessuno si accorge che stai facendo una magia."
        twinned_spell:
          name: Incantesimo Raddoppiato
          cost: "livello dell'incantesimo (1 per un trucchetto)"
          short: "Punti stregoneria pari al livello dell'incantesimo (1 per un trucchetto): un incantesimo che bersaglia una sola creatura (gittata non incantatore) ne bersaglia una seconda entro gittata."
          text: "Quando lo stregone lancia un incantesimo che bersaglia una sola creatura e non ha gittata «incantatore», può spendere un numero di punti stregoneria pari al livello dell'incantesimo (1 se è un trucchetto) per bersagliare con lo stesso incantesimo una seconda creatura entro gittata. L'incantesimo non deve poter bersagliare più di una creatura al livello a cui viene lanciato: per esempio dardo incantato e raggio rovente non sono idonei, raggio di gelo sì."
          kid: "Un incantesimo che può colpire una sola creatura (e non solo te stesso) ne colpisce due, se sono entrambe a gittata! Costa tanti punti stregoneria quanto il livello dell'incantesimo (1 per un trucchetto)."
  subclasses:
    draconic_bloodline:
      name: Discendenza Draconica
      name_en: Draconic Bloodline
      option_lists:
        dragon_ancestor:
          label: Antenato Draconico
          level: 1
          count_table: null
          count: 1
          items:
            black:
              name: Nero
              damage_type: acido
              short: "Drago nero: danni da acido."
              text: "Antenato draconico: drago nero. Tipo di danno associato: acido."
              kid: "Il tuo antenato è un drago nero: la tua magia draconica è legata all'acido."
            blue:
              name: Blu
              damage_type: fulmine
              short: "Drago blu: danni da fulmine."
              text: "Antenato draconico: drago blu. Tipo di danno associato: fulmine."
              kid: "Il tuo antenato è un drago blu: la tua magia draconica è legata al fulmine."
            brass:
              name: Ottone
              damage_type: fuoco
              short: "Drago d'ottone: danni da fuoco."
              text: "Antenato draconico: drago d'ottone. Tipo di danno associato: fuoco."
              kid: "Il tuo antenato è un drago d'ottone: la tua magia draconica è legata al fuoco."
            bronze:
              name: Bronzo
              damage_type: fulmine
              short: "Drago di bronzo: danni da fulmine."
              text: "Antenato draconico: drago di bronzo. Tipo di danno associato: fulmine."
              kid: "Il tuo antenato è un drago di bronzo: la tua magia draconica è legata al fulmine."
            copper:
              name: Rame
              damage_type: acido
              short: "Drago di rame: danni da acido."
              text: "Antenato draconico: drago di rame. Tipo di danno associato: acido."
              kid: "Il tuo antenato è un drago di rame: la tua magia draconica è legata all'acido."
            gold:
              name: Oro
              damage_type: fuoco
              short: "Drago d'oro: danni da fuoco."
              text: "Antenato draconico: drago d'oro. Tipo di danno associato: fuoco."
              kid: "Il tuo antenato è un drago d'oro: la tua magia draconica è legata al fuoco."
            green:
              name: Verde
              damage_type: veleno
              short: "Drago verde: danni da veleno."
              text: "Antenato draconico: drago verde. Tipo di danno associato: veleno."
              kid: "Il tuo antenato è un drago verde: la tua magia draconica è legata al veleno."
            red:
              name: Rosso
              damage_type: fuoco
              short: "Drago rosso: danni da fuoco."
              text: "Antenato draconico: drago rosso. Tipo di danno associato: fuoco."
              kid: "Il tuo antenato è un drago rosso: la tua magia draconica è legata al fuoco."
            silver:
              name: Argento
              damage_type: freddo
              short: "Drago d'argento: danni da freddo."
              text: "Antenato draconico: drago d'argento. Tipo di danno associato: freddo."
              kid: "Il tuo antenato è un drago d'argento: la tua magia draconica è legata al freddo."
            white:
              name: Bianco
              damage_type: freddo
              short: "Drago bianco: danni da freddo."
              text: "Antenato draconico: drago bianco. Tipo di danno associato: freddo."
              kid: "Il tuo antenato è un drago bianco: la tua magia draconica è legata al freddo."
      features:
        1:
          - name: Antenato Draconico
            short: "Scegli un tipo di drago come antenato (vedi elenco): il suo tipo di danno serve ai privilegi successivi. Parli, leggi e scrivi il Draconico; bonus di competenza raddoppiato alle prove di CAR per interagire con i draghi (se applicabile)."
            text: "Al 1° livello lo stregone sceglie un tipo di drago come suo antenato: il tipo di danno associato a quel drago (argento e bianco: freddo; blu e bronzo: fulmine; nero e rame: acido; oro, ottone e rosso: fuoco; verde: veleno) sarà usato dai privilegi che otterrà in seguito. Lo stregone sa parlare, leggere e scrivere in Draconico. Inoltre, ogni volta che effettua una prova di Carisma per interagire con i draghi, il suo bonus di competenza raddoppia se è applicabile alla prova."
            kid: "Un tuo antenato era un drago! Parli e scrivi il Draconico, la lingua dei draghi. Quando provi a convincere o ingannare un drago, se hai l'abilità giusta il tuo bonus di competenza conta doppio."
            languages: [draconic]
          - name: Resilienza Draconica
            short: "+1 PF massimo al 1° livello e +1 per ogni livello da stregone successivo. Senza armatura, CA = 13 + mod. DES."
            text: "La magia che scorre nel corpo dello stregone fa emergere alcuni tratti fisici dei draghi suoi antenati. Al 1° livello il suo massimo dei punti ferita aumenta di 1, e aumenta di nuovo di 1 ogni volta che acquisisce un livello in questa classe. Inoltre, alcune parti della sua pelle si ricoprono di un sottile strato di scaglie simili a quelle di un drago: quando non indossa armature, la sua CA è pari a 13 + il suo modificatore di Destrezza."
            kid: "Hai scaglie da drago sulla pelle: senza armatura la tua Classe Armatura (CA) è 13 + la tua Destrezza. Hai anche 1 punto ferita in più per ogni livello ({livello} in tutto)."
            hp_per_level: 1
            unarmored_ac: {base: 13, ability: dex}
        6:
          - name: Affinità Elementale
            short: "Quando lanci un incantesimo che infligge il tipo di danno del tuo antenato, aggiungi il mod. CAR a un tiro per i danni. Puoi anche spendere 1 punto stregoneria per avere resistenza a quel tipo di danno per 1 ora."
            text: "A partire dal 6° livello, quando lo stregone lancia un incantesimo che infligge danni del tipo associato al suo antenato draconico, può aggiungere il suo modificatore di Carisma a un tiro per i danni di quell'incantesimo. Allo stesso tempo, può spendere 1 punto stregoneria per ottenere resistenza a quel tipo di danno per 1 ora."
            kid: "Quando un tuo incantesimo fa danni del tipo del tuo drago, aggiungi {mod} ai danni (una volta per incantesimo). In quel momento puoi anche spendere 1 punto stregoneria: per 1 ora quel tipo di danni ti fa solo metà."
        14:
          - name: Ali di Drago
            short: "Azione bonus: ti spuntano ali di drago e ottieni una velocità di volare pari alla tua velocità attuale, finché non le congedi con un'azione bonus. Non con un'armatura non fatta per accoglierle."
            text: "Al 14° livello lo stregone sviluppa la capacità di far spuntare un paio di ali di drago dalla schiena, ottenendo una velocità di volare pari alla sua velocità attuale. Può creare le ali come azione bonus nel suo turno; durano finché non le congeda con un'azione bonus nel suo turno. Non può manifestarle mentre indossa un'armatura, a meno che l'armatura non sia fatta per accoglierle; i vestiti non adatti possono essere distrutti quando le ali spuntano."
            kid: "Con un'azione bonus ti spuntano ali da drago e puoi volare veloce quanto cammini. Restano finché non le fai sparire (un'altra azione bonus). Non funzionano se indossi un'armatura."
        18:
          - name: Presenza Draconica
            short: "Azione, 5 punti stregoneria: aura di soggezione o di paura di 18 m per 1 minuto (concentrazione). Ogni creatura ostile che inizia il turno nell'aura: TS su SAG (CD {cd}) o è affascinata o spaventata finché l'aura dura; se lo supera è immune per 24 ore."
            text: "A partire dal 18° livello lo stregone può incanalare la presenza terrificante del suo antenato draconico. Con un'azione spende 5 punti stregoneria ed emana un'aura di soggezione o di paura (a sua scelta) entro 18 metri. Per 1 minuto o finché non perde la concentrazione (come se si concentrasse su un incantesimo), ogni creatura ostile che inizia il suo turno nell'aura deve superare un tiro salvezza su Saggezza o è affascinata (se lo stregone ha scelto soggezione) o spaventata (se ha scelto paura) finché l'aura non termina. Una creatura che supera il tiro salvezza è immune all'aura dello stregone per 24 ore. Il PHB non specifica la CD: di norma si usa la CD del tiro salvezza degli incantesimi dello stregone."
            kid: "Azione + 5 punti stregoneria: per 1 minuto (con concentrazione) emani paura o meraviglia, scegli tu. Ogni nemico che inizia il turno entro 18 m tira un d20 per resistere (tiro salvezza su Saggezza contro {cd}): se fallisce è spaventato o affascinato."
    wild_magic:
      name: Magia Selvaggia
      name_en: Wild Magic
      features:
        1:
          - name: Impulso di Magia Selvaggia
            short: "Subito dopo che lanci un incantesimo da stregone di 1° livello o superiore, il DM può farti tirare un d20: con 1 tiri d100 sulla tabella degli impulsi di magia selvaggia."
            text: "La magia dello stregone può scatenarsi in impulsi di magia incontrollata. Subito dopo che lo stregone ha lanciato un incantesimo da stregone di 1° livello o superiore, il DM può fargli tirare un d20: se ottiene 1, tira sulla tabella Impulso di Magia Selvaggia per creare un effetto magico casuale. Se l'effetto è un incantesimo, è troppo selvaggio per essere modificato dalla Metamagia e, se normalmente richiede concentrazione, in questo caso non la richiede e dura per tutta la sua durata."
            kid: "La tua magia è imprevedibile! Dopo che lanci un incantesimo (non un trucchetto), il DM può farti tirare un d20: se esce 1, tiri d100 sulla tabella della magia selvaggia e succede qualcosa di strano."
          - name: Maree del Caos
            short: "Ottieni vantaggio a un tiro per colpire, una prova di caratteristica o un TS. Torna con un riposo lungo, oppure quando il DM ti fa tirare sulla tabella degli impulsi dopo un tuo incantesimo di 1° livello o superiore."
            text: "Lo stregone può manipolare le forze del caso e del caos per ottenere vantaggio a un tiro per colpire, una prova di caratteristica o un tiro salvezza. Una volta usato questo privilegio, deve completare un riposo lungo prima di poterlo usare di nuovo. In qualsiasi momento prima di recuperarne l'uso, il DM può fargli tirare sulla tabella Impulso di Magia Selvaggia subito dopo che ha lanciato un incantesimo da stregone di 1° livello o superiore: in quel caso recupera l'uso del privilegio."
            kid: "Una volta, quando vuoi tu, tira 2 d20 e tieni il più alto (vantaggio) su un attacco, una prova o un tiro salvezza. Torna dopo un riposo lungo, o prima se il DM ti fa tirare sulla tabella della magia selvaggia."
        6:
          - name: Piegare la Fortuna
            short: "Reazione, 2 punti stregoneria: quando un'altra creatura che vedi effettua un tiro per colpire, una prova o un TS, tiri 1d4 e lo aggiungi o lo sottrai al suo tiro (anche dopo il tiro, prima che abbia effetto)."
            text: "A partire dal 6° livello lo stregone può alterare il destino con la sua magia selvaggia. Quando un'altra creatura che può vedere effettua un tiro per colpire, una prova di caratteristica o un tiro salvezza, può usare la sua reazione e spendere 2 punti stregoneria per tirare 1d4 e applicare il risultato come bonus o penalità (a sua scelta) al tiro della creatura. Può farlo dopo che la creatura ha tirato, ma prima che si applichino gli effetti del tiro."
            kid: "Quando un'altra creatura che vedi tira il d20 (attacco, prova o tiro salvezza), usi la reazione (una mossa anche fuori dal tuo turno) e 2 punti stregoneria: tira 1d4 e aggiungilo o toglilo dal suo risultato, anche dopo aver visto il dado."
        14:
          - name: Caos Controllato
            short: "Quando tiri sulla tabella degli impulsi di magia selvaggia, tiri due volte e scegli quale risultato usare."
            text: "Al 14° livello lo stregone ottiene un certo controllo sugli impulsi della sua magia selvaggia: ogni volta che tira sulla tabella Impulso di Magia Selvaggia, può tirare due volte e usare uno qualsiasi dei due risultati."
            kid: "Quando tiri sulla tabella della magia selvaggia, tiri due volte e scegli tu quale dei due risultati usare."
        18:
          - name: Bombardamento di Incantesimi
            short: "Quando tiri i danni di un incantesimo e un dado ottiene il massimo, ne scegli uno, lo ritiri e aggiungi il risultato ai danni. 1 volta per turno."
            text: "A partire dal 18° livello l'energia dannosa degli incantesimi dello stregone si intensifica. Quando tira i danni di un incantesimo e ottiene il numero più alto possibile su uno qualsiasi dei dadi, sceglie uno di quei dadi, lo tira di nuovo e aggiunge il risultato ai danni. Può usare questo privilegio una sola volta per turno."
            kid: "Quando tiri i danni di un incantesimo e un dado fa il numero più alto (per esempio 8 su un d8), tiri di nuovo quel dado e aggiungi anche il nuovo numero. Una volta per turno."
      surge_table:
        - {min: 1, max: 2, roll: "01-02", text: "Per il prossimo minuto tiri su questa tabella all'inizio di ogni tuo turno, ignorando questo risultato nei tiri successivi."}
        - {min: 3, max: 4, roll: "03-04", text: "Per il prossimo minuto puoi vedere qualsiasi creatura invisibile, se hai una linea di vista verso di essa."}
        - {min: 5, max: 6, roll: "05-06", text: "Un modron scelto e controllato dal DM appare in uno spazio libero entro 1,5 m da te e scompare dopo 1 minuto."}
        - {min: 7, max: 8, roll: "07-08", text: "Lanci palla di fuoco come incantesimo di 3° livello centrato su di te."}
        - {min: 9, max: 10, roll: "09-10", text: "Lanci dardo incantato come incantesimo di 5° livello."}
        - {min: 11, max: 12, roll: "11-12", text: "Tira un d10: la tua altezza cambia di 2,5 cm per ogni punto del risultato. Se il risultato è dispari rimpicciolisci, se è pari cresci."}
        - {min: 13, max: 14, roll: "13-14", text: "Lanci confusione centrato su di te."}
        - {min: 15, max: 16, roll: "15-16", text: "Per il prossimo minuto recuperi 5 punti ferita all'inizio di ogni tuo turno."}
        - {min: 17, max: 18, roll: "17-18", text: "Ti cresce una lunga barba di piume che resta finché non starnutisci: allora le piume esplodono via dalla tua faccia."}
        - {min: 19, max: 20, roll: "19-20", text: "Lanci unto centrato su di te."}
        - {min: 21, max: 22, roll: "21-22", text: "Le creature hanno svantaggio ai tiri salvezza contro il prossimo incantesimo che lanci entro 1 minuto e che richiede un tiro salvezza."}
        - {min: 23, max: 24, roll: "23-24", text: "La tua pelle diventa di un blu acceso. Un incantesimo rimuovi maledizione può porre fine all'effetto."}
        - {min: 25, max: 26, roll: "25-26", text: "Per il prossimo minuto ti appare un occhio sulla fronte: hai vantaggio alle prove di Saggezza (Percezione) basate sulla vista."}
        - {min: 27, max: 28, roll: "27-28", text: "Per il prossimo minuto tutti i tuoi incantesimi con tempo di lancio di 1 azione hanno tempo di lancio di 1 azione bonus."}
        - {min: 29, max: 30, roll: "29-30", text: "Ti teletrasporti fino a 18 m in uno spazio libero a tua scelta che puoi vedere."}
        - {min: 31, max: 32, roll: "31-32", text: "Vieni trasportato sul Piano Astrale fino alla fine del tuo prossimo turno; poi torni nello spazio che occupavi o, se è occupato, in quello libero più vicino."}
        - {min: 33, max: 34, roll: "33-34", text: "Il prossimo incantesimo che infligge danni lanciato da te entro 1 minuto infligge il massimo dei danni."}
        - {min: 35, max: 36, roll: "35-36", text: "Tira un d10: la tua età cambia di tanti anni quanto il risultato. Se è dispari ringiovanisci (minimo 1 anno di età), se è pari invecchi."}
        - {min: 37, max: 38, roll: "37-38", text: "Appaiono 1d6 flumph controllati dal DM in spazi liberi entro 18 m da te: sono spaventati da te e svaniscono dopo 1 minuto."}
        - {min: 39, max: 40, roll: "39-40", text: "Recuperi 2d10 punti ferita."}
        - {min: 41, max: 42, roll: "41-42", text: "Ti trasformi in una pianta in vaso fino all'inizio del tuo prossimo turno. Come pianta sei incapacitato e hai vulnerabilità a tutti i danni; se scendi a 0 punti ferita il vaso si rompe e torni alla tua forma."}
        - {min: 43, max: 44, roll: "43-44", text: "Per il prossimo minuto, in ognuno dei tuoi turni puoi teletrasportarti fino a 6 m come azione bonus."}
        - {min: 45, max: 46, roll: "45-46", text: "Lanci levitazione su di te."}
        - {min: 47, max: 48, roll: "47-48", text: "Un unicorno controllato dal DM appare in uno spazio entro 1,5 m da te e scompare dopo 1 minuto."}
        - {min: 49, max: 50, roll: "49-50", text: "Per il prossimo minuto non puoi parlare: ogni volta che ci provi, dalla tua bocca escono bolle rosa."}
        - {min: 51, max: 52, roll: "51-52", text: "Per il prossimo minuto uno scudo spettrale fluttua vicino a te: ottieni +2 alla CA e immunità a dardo incantato."}
        - {min: 53, max: 54, roll: "53-54", text: "Per i prossimi 5d6 giorni l'alcol non può ubriacarti."}
        - {min: 55, max: 56, roll: "55-56", text: "Ti cadono i capelli, ma ricrescono entro 24 ore."}
        - {min: 57, max: 58, roll: "57-58", text: "Per il prossimo minuto ogni oggetto infiammabile che tocchi, se non è indossato o trasportato da un'altra creatura, prende fuoco."}
        - {min: 59, max: 60, roll: "59-60", text: "Recuperi lo slot incantesimo speso di livello più basso."}
        - {min: 61, max: 62, roll: "61-62", text: "Per il prossimo minuto devi urlare quando parli."}
        - {min: 63, max: 64, roll: "63-64", text: "Lanci nube di nebbia centrata su di te."}
        - {min: 65, max: 66, roll: "65-66", text: "Fino a tre creature a tua scelta entro 9 m da te subiscono 4d10 danni da fulmine."}
        - {min: 67, max: 68, roll: "67-68", text: "Sei spaventato dalla creatura più vicina fino alla fine del tuo prossimo turno."}
        - {min: 69, max: 70, roll: "69-70", text: "Ogni creatura entro 9 m da te diventa invisibile per il prossimo minuto. L'invisibilità di una creatura termina quando attacca o lancia un incantesimo."}
        - {min: 71, max: 72, roll: "71-72", text: "Per il prossimo minuto ottieni resistenza a tutti i danni."}
        - {min: 73, max: 74, roll: "73-74", text: "Una creatura casuale entro 18 m da te è avvelenata per 1d4 ore."}
        - {min: 75, max: 76, roll: "75-76", text: "Per il prossimo minuto emani luce intensa in un raggio di 9 m. Ogni creatura che termina il suo turno entro 1,5 m da te è accecata fino alla fine del suo turno successivo."}
        - {min: 77, max: 78, roll: "77-78", text: "Lanci metamorfosi su di te. Se fallisci il tiro salvezza, diventi una pecora per la durata dell'incantesimo."}
        - {min: 79, max: 80, roll: "79-80", text: "Per il prossimo minuto farfalle e petali di fiori illusori svolazzano nell'aria entro 3 m da te."}
        - {min: 81, max: 82, roll: "81-82", text: "Puoi effettuare subito un'azione aggiuntiva."}
        - {min: 83, max: 84, roll: "83-84", text: "Ogni creatura entro 9 m da te subisce 1d10 danni necrotici. Recuperi punti ferita pari al totale dei danni necrotici inflitti."}
        - {min: 85, max: 86, roll: "85-86", text: "Lanci immagine speculare."}
        - {min: 87, max: 88, roll: "87-88", text: "Lanci volare su una creatura casuale entro 18 m da te."}
        - {min: 89, max: 90, roll: "89-90", text: "Per il prossimo minuto diventi invisibile e le altre creature non possono sentirti. L'invisibilità termina se attacchi o lanci un incantesimo."}
        - {min: 91, max: 92, roll: "91-92", text: "Se muori entro il prossimo minuto, torni subito in vita come con l'incantesimo reincarnazione."}
        - {min: 93, max: 94, roll: "93-94", text: "Per il prossimo minuto la tua taglia aumenta di una categoria."}
        - {min: 95, max: 96, roll: "95-96", text: "Per il prossimo minuto tu e tutte le creature entro 9 m da te ottenete vulnerabilità ai danni perforanti."}
        - {min: 97, max: 98, roll: "97-98", text: "Per il prossimo minuto sei circondato da una leggera musica eterea."}
        - {min: 99, max: 100, roll: "99-00", text: "Recuperi tutti i punti stregoneria spesi."}

warlock:
  name: Warlock
  name_f: Warlock
  name_en: Warlock
  hit_die: 8
  saves: [wis, cha]
  armor: [light]
  weapons: [simple]
  skill_choices: {count: 2, from: [arcana, deception, history, intimidation, investigation, nature, religion]}
  spellcasting: {ability: cha, type: pact}
  subclass_level: 1
  subclass_label: Patrono Ultraterreno
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - {name: Patrono Ultraterreno, short: "Scegli un patrono (Arcifata, Immondo, Grande Antico).", text: "Il warlock ha stretto un patto con un essere ultraterreno."}
      - {name: Magia del Patto, short: "Incantesimi (Carisma) con slot di patto recuperati con un riposo breve.", text: "Il warlock lancia incantesimi usando il Carisma; i suoi slot si ricaricano dopo un riposo breve o lungo."}
    2:
      - {name: Suppliche Occulte, short: "Scegli due suppliche occulte.", text: "Il warlock apprende frammenti di conoscenza proibita che gli conferiscono capacità magiche permanenti."}
    3:
      - {name: Dono del Patto, short: "Scegli un dono (Catena, Lama, Tomo).", text: "Il patrono concede al warlock un dono per il suo servizio."}

wizard:
  name: Mago
  name_f: Maga
  name_en: Wizard
  hit_die: 6
  saves: [int, wis]
  armor: []
  weapons: [dagger, dart, sling, quarterstaff, light_crossbow]
  tools: []
  skill_choices: {count: 2, from: [arcana, history, insight, investigation, medicine, religion]}
  starting_equipment:
    - choice: ["Un bastone ferrato", "Un pugnale"]
    - choice: ["Una borsa per componenti", "Un focus arcano"]
    - choice: ["Dotazione da studioso", "Dotazione da esploratore"]
    - fixed: ["Libro degli incantesimi"]
  spellcasting: {ability: int, type: full, prepared: ability_plus_level, list: wizard, ritual: true, spellbook: true, focus: "focus arcano"}
  subclass_level: 2
  subclass_label: Tradizione Arcana
  asi_levels: [4, 8, 12, 16, 19]
  features:
    1:
      - name: Incantesimi
        short: "Incantatore completo (Intelligenza). Libro con 6 incantesimi di 1° livello (+2 gratis a ogni livello); prepari mod. INT + livello da mago incantesimi dal libro; rituali dal libro senza prepararli; focus arcano."
        text: "Il mago è uno studioso di magia arcana. Conosce tre trucchetti da mago (quattro dal 4° livello, cinque dal 10°) e possiede un libro degli incantesimi che al 1° livello contiene sei incantesimi da mago di 1° livello a sua scelta; ogni volta che sale di livello ne aggiunge gratuitamente due, di un livello per cui ha slot. Ogni giorno prepara dal libro un numero di incantesimi pari al suo modificatore di Intelligenza + il suo livello da mago (minimo 1), di livello per cui ha slot; può cambiarli dopo un riposo lungo (1 minuto di studio per livello di ogni incantesimo). Caratteristica da incantatore: Intelligenza (CD = 8 + bonus di competenza + mod. INT; attacco = bonus di competenza + mod. INT). Può lanciare come rituale qualsiasi incantesimo da mago con il descrittore rituale presente nel suo libro, anche se non lo ha preparato, e può usare un focus arcano. Può copiare nel libro altri incantesimi da mago trovati durante l'avventura: servono 2 ore e 50 mo per livello dell'incantesimo."
        kid_hide: true
      - name: Recupero Arcano
        short: "1/giorno, dopo un riposo breve, recuperi slot per un totale di livelli pari a metà del livello da mago (per eccesso), nessuno di 6° livello o superiore."
        text: "Il mago impara a recuperare parte della sua energia magica studiando il suo libro degli incantesimi. Una volta al giorno, quando completa un riposo breve, sceglie quali slot incantesimo spesi recuperare: il loro livello totale può essere pari o inferiore alla metà del suo livello da mago (arrotondato per eccesso) e nessuno può essere di 6° livello o superiore. Per esempio, un mago di 4° livello può recuperare uno slot di 2° livello oppure due slot di 1° livello."
        kid: "Una volta al giorno, dopo un riposo breve, studi il tuo libro e recuperi slot già usati: in tutto tanti livelli quanto la metà del tuo livello ({livello}), arrotondata per eccesso."
    2:
      - name: Tradizione Arcana
        short: "Scegli una scuola di magia (Abiurazione, Ammaliamento, Divinazione, Evocazione, Illusione, Invocazione, Necromanzia o Trasmutazione)."
        text: "Al 2° livello il mago sceglie una tradizione arcana, che modella la sua pratica della magia secondo i precetti di una delle otto scuole di magia. La scelta conferisce privilegi al 2°, 6°, 10° e 14° livello."
        kid_hide: true
    4:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Il mago può aumentare un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegliere un talento."
        kid_hide: true
    8:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
        kid_hide: true
    12:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
        kid_hide: true
    16:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
        kid_hide: true
    18:
      - name: Maestria negli Incantesimi
        name_en: Spell Mastery
        short: "Scegli un incantesimo da mago di 1° e uno di 2° livello del libro: se preparati, li lanci al loro livello più basso senza spendere slot. Puoi cambiarli con 8 ore di studio."
        text: "Il mago sceglie un incantesimo da mago di 1° livello e uno di 2° livello contenuti nel suo libro degli incantesimi. Quando li ha preparati, può lanciarli al loro livello più basso senza spendere uno slot incantesimo; per lanciarli a un livello superiore deve spendere uno slot come di consueto. Dedicando 8 ore allo studio, può sostituire uno o entrambi gli incantesimi scelti con altri degli stessi livelli."
        kid: "Scegli un incantesimo di 1° e uno di 2° livello dal tuo libro: puoi lanciarli tutte le volte che vuoi senza usare slot."
    19:
      - name: Aumento dei Punteggi di Caratteristica
        short: "+2 a una caratteristica o +1 a due (max 20), oppure un talento."
        text: "Vedi 4° livello."
        kid_hide: true
    20:
      - name: Incantesimi Personali
        name_en: Signature Spells
        short: "Scegli due incantesimi da mago di 3° livello del libro: sempre preparati (non contano nel limite) e lanciabili una volta ciascuno al 3° livello senza slot, 1/riposo breve o lungo."
        text: "Il mago sceglie due incantesimi da mago di 3° livello contenuti nel suo libro degli incantesimi come suoi incantesimi personali. Li considera sempre preparati, non li conta nel numero di incantesimi preparati e può lanciare ognuno di essi una volta al 3° livello senza spendere uno slot incantesimo; quando lo fa, non può farlo di nuovo finché non completa un riposo breve o lungo. Per lanciarli a un livello superiore deve spendere uno slot come di consueto."
        kid: "Scegli 2 incantesimi di 3° livello: sono sempre pronti e puoi lanciarli una volta ciascuno senza usare slot, poi devi riposare (anche breve)."
  subclasses:
    abjuration:
      name: Scuola di Abiurazione
      name_en: School of Abjuration
      features:
        2:
          - name: Abiuratore Esperto
            name_f: Abiuratrice Esperta
            short: "Copiare un incantesimo di abiurazione nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di abiurazione nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di abiurazione ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Interdizione Arcana
            short: "Quando lanci un incantesimo di abiurazione di 1° livello o superiore puoi creare su di te un'interdizione (PF = 2 x livello da mago + mod. INT) che assorbe i danni al posto tuo. Creabile 1/riposo lungo; recupera 2 PF per livello di ogni incantesimo di abiurazione che lanci."
            text: "Quando il mago lancia un incantesimo di abiurazione di 1° livello o superiore, può usare un filo della magia dell'incantesimo per creare su se stesso un'interdizione magica che dura finché non completa un riposo lungo. L'interdizione ha punti ferita pari al doppio del livello da mago + il modificatore di Intelligenza. Quando il mago subisce danni, è l'interdizione a subirli; se la riducono a 0 punti ferita, il mago subisce i danni rimanenti. A 0 punti ferita l'interdizione non può assorbire danni, ma la sua magia rimane. Ogni volta che il mago lancia un incantesimo di abiurazione di 1° livello o superiore, l'interdizione recupera punti ferita pari al doppio del livello dell'incantesimo. Una volta creata, il mago non può crearla di nuovo finché non completa un riposo lungo."
            kid: "Quando lanci un incantesimo di abiurazione crei su di te uno scudo magico che prende i danni al posto tuo (PF = 2 x livello + Intelligenza), una volta per riposo lungo. Ogni altro incantesimo di abiurazione lo ricarica."
        6:
          - name: Interdizione Proiettata
            short: "Reazione: quando una creatura che vedi entro 9 m subisce danni, la tua Interdizione Arcana li assorbe al suo posto."
            text: "Quando una creatura che il mago può vedere entro 9 metri da lui subisce danni, il mago può usare la sua reazione per far sì che sia la sua Interdizione Arcana ad assorbirli. Se i danni riducono l'interdizione a 0 punti ferita, la creatura protetta subisce i danni rimanenti."
            kid: "Con la tua reazione, il tuo scudo magico può prendere i danni al posto di un amico che vedi entro 9 m."
        10:
          - name: Abiurazione Migliorata
            short: "Quando un tuo incantesimo di abiurazione richiede una prova di caratteristica (es. controincantesimo, dissolvi magie), aggiungi il bonus di competenza."
            text: "Quando il mago lancia un incantesimo di abiurazione che richiede di effettuare una prova di caratteristica come parte del lancio (come controincantesimo e dissolvi magie), aggiunge il suo bonus di competenza a quella prova."
            kid: "Quando un tuo incantesimo di abiurazione ti fa tirare una prova (come controincantesimo o dissolvi magie), aggiungi la tua competenza."
        14:
          - name: Resistenza agli Incantesimi
            short: "Vantaggio ai TS contro gli incantesimi e resistenza ai danni degli incantesimi."
            text: "Il mago ha vantaggio ai tiri salvezza contro gli incantesimi e resistenza ai danni degli incantesimi."
            kid: "Hai vantaggio sui tiri salvezza contro gli incantesimi, e i loro danni ti fanno solo la metà."
    conjuration:
      name: Scuola di Evocazione
      name_en: School of Conjuration
      features:
        2:
          - name: Evocatore Esperto
            name_f: Evocatrice Esperta
            short: "Copiare un incantesimo di evocazione nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di evocazione nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di evocazione ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Evocazione Minore
            short: "Azione: evochi in mano o a terra entro 3 m un oggetto non magico che hai già visto (max 90 cm per lato e 5 kg). Sparisce dopo 1 ora, se subisce o infligge danni o se usi di nuovo il privilegio."
            text: "Il mago può usare la sua azione per evocare un oggetto inanimato nella sua mano o sul terreno, in uno spazio libero che può vedere entro 3 metri. L'oggetto non può essere più grande di 90 cm per lato né pesare più di 5 kg, e deve avere la forma di un oggetto non magico che il mago ha già visto. È visibilmente magico e irradia luce fioca entro 1,5 metri. Scompare dopo 1 ora, quando il mago usa di nuovo questo privilegio, oppure se subisce o infligge danni."
            kid: "Con un'azione fai apparire un oggetto normale che hai già visto (al massimo 90 cm e 5 kg). Sparisce dopo 1 ora, o se colpisce o viene colpito."
        6:
          - name: Trasposizione Benevola
            short: "Azione: ti teletrasporti fino a 9 m in uno spazio libero che vedi, o scambi di posto con una creatura consenziente Piccola o Media entro 9 m. Di nuovo dopo un riposo lungo o lanciando un incantesimo di evocazione di 1° livello o superiore."
            text: "Il mago può usare la sua azione per teletrasportarsi fino a 9 metri in uno spazio libero che può vedere. In alternativa, può scegliere uno spazio entro gittata occupato da una creatura Piccola o Media: se la creatura è consenziente, si teletrasportano entrambi scambiandosi di posto. Una volta usato questo privilegio, non può usarlo di nuovo finché non completa un riposo lungo o non lancia un incantesimo di evocazione di 1° livello o superiore."
            kid: "Con un'azione ti teletrasporti fino a 9 m, oppure scambi di posto con un amico. Per rifarlo devi fare un riposo lungo o lanciare un incantesimo di evocazione."
        10:
          - name: Evocazione Focalizzata
            short: "Subire danni non può interrompere la tua concentrazione su un incantesimo di evocazione."
            text: "Mentre il mago è concentrato su un incantesimo di evocazione, la sua concentrazione non può essere interrotta a causa dei danni subiti."
            kid: "Quando ti concentri su un incantesimo di evocazione, le ferite non ti fanno perdere la concentrazione."
        14:
          - name: Evocazioni Durature
            short: "Le creature che evochi o crei con un incantesimo di evocazione hanno 30 PF temporanei."
            text: "Qualsiasi creatura evocata o creata dal mago con un incantesimo di evocazione ha 30 punti ferita temporanei."
            kid: "Le creature che fai comparire con un incantesimo di evocazione hanno 30 PF temporanei in più."
    divination:
      name: Scuola di Divinazione
      name_en: School of Divination
      features:
        2:
          - name: Divinatore Esperto
            name_f: Divinatrice Esperta
            short: "Copiare un incantesimo di divinazione nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di divinazione nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di divinazione ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Presagio
            short: "Dopo un riposo lungo tira 2d20 e annota i risultati: puoi sostituire con uno di essi un tiro per colpire, un TS o una prova tua o di una creatura che vedi (prima del tiro, 1 volta per turno)."
            text: "Quando completa un riposo lungo, il mago tira due d20 e ne annota i risultati. Può sostituire qualsiasi tiro per colpire, tiro salvezza o prova di caratteristica effettuato da lui o da una creatura che può vedere con uno di questi tiri premonitori, decidendolo prima del tiro; può farlo una sola volta per turno. Ogni tiro premonitore si usa una volta sola; quelli non usati si perdono al riposo lungo successivo."
            kid: "Dopo un riposo lungo tiri 2 d20 e segni i numeri. Prima che tu o qualcuno che vedi tiri un d20, puoi decidere che il risultato è uno dei tuoi numeri!"
        6:
          - name: Divinazione Esperta
            short: "Quando lanci un incantesimo di divinazione di 2° livello o superiore con uno slot, recuperi uno slot speso di livello inferiore (max 5°)."
            text: "Quando il mago lancia un incantesimo di divinazione di 2° livello o superiore usando uno slot incantesimo, recupera uno slot incantesimo speso. Lo slot recuperato deve essere di livello inferiore a quello dell'incantesimo lanciato e non può essere superiore al 5°."
            kid: "Quando lanci un incantesimo di divinazione di 2° livello o più, recuperi uno slot già usato di livello più basso."
        10:
          - name: Il Terzo Occhio
            short: "Azione: scegli scurovisione 18 m, vista eterea 18 m, comprensione di ogni lingua scritta o vedere l'invisibile entro 3 m, fino al prossimo riposo o finché sei incapacitato. 1/riposo breve o lungo."
            text: "Il mago può usare la sua azione per accrescere i suoi poteri di percezione, scegliendo uno dei benefici seguenti, che dura finché non diventa incapacitato o non effettua un riposo breve o lungo: scurovisione entro 18 metri; vista eterea (vede nel Piano Etereo entro 18 metri); comprensione superiore (sa leggere qualsiasi linguaggio); vedere l'invisibile (vede creature e oggetti invisibili entro 3 metri nella sua linea di vista). Una volta usato, non può usarlo di nuovo finché non completa un riposo breve o lungo."
            kid: "Con un'azione ottieni un super-senso fino al prossimo riposo: vedere al buio, vedere l'invisibile, vedere il mondo degli spiriti o leggere ogni lingua."
        14:
          - name: Presagio Superiore
            short: "Per Presagio tiri 3d20 invece di 2."
            text: "Le visioni nei sogni del mago si intensificano: quando usa il privilegio Presagio tira tre d20 anziché due."
            kid: "Per il Presagio tiri 3 d20 invece di 2."
    enchantment:
      name: Scuola di Ammaliamento
      name_en: School of Enchantment
      features:
        2:
          - name: Ammaliatore Esperto
            name_f: Ammaliatrice Esperta
            short: "Copiare un incantesimo di ammaliamento nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di ammaliamento nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di ammaliamento ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Sguardo Ipnotico
            short: "Azione: una creatura entro 1,5 m che ti vede o ti sente fa un TS su SAG (CD incantesimi); se fallisce è affascinata fino alla fine del tuo prossimo turno (velocità 0, incapacitata). Puoi mantenerlo con un'azione a ogni turno."
            text: "Come azione, il mago sceglie una creatura entro 1,5 metri che possa vederlo o udirlo. Il bersaglio deve superare un tiro salvezza su Saggezza contro la CD degli incantesimi da mago o essere affascinato dal mago fino alla fine del turno successivo del mago: la sua velocità scende a 0 ed è incapacitato e visibilmente frastornato. Nei turni successivi il mago può usare la sua azione per mantenere l'effetto fino alla fine del suo turno successivo. L'effetto termina se il mago si allontana di più di 1,5 metri, se la creatura non può più vederlo né udirlo o se subisce danni. Quando l'effetto termina, o se la creatura supera il tiro salvezza iniziale, il mago non può usare di nuovo questo privilegio su di essa finché non completa un riposo lungo."
            kid: "Con un'azione fissi negli occhi una creatura vicinissima (1,5 m): se fallisce un tiro salvezza su Saggezza con CD {cd}, resta incantata e immobile fino al tuo prossimo turno. Ogni turno puoi usare un'azione per tenerla incantata."
        6:
          - name: Charme Istintivo
            short: "Reazione: quando una creatura che vedi entro 9 m ti attacca, deve superare un TS su SAG (CD incantesimi) o attaccare invece la creatura più vicina a lei. Se lo supera, non puoi riusarlo su di lei fino a un riposo lungo."
            text: "Quando una creatura che il mago può vedere entro 9 metri effettua un tiro per colpire contro di lui, il mago può usare la sua reazione per deviare l'attacco, purché un'altra creatura si trovi entro la gittata dell'attacco. L'attaccante deve effettuare un tiro salvezza su Saggezza contro la CD degli incantesimi da mago: se lo fallisce, deve bersagliare la creatura più vicina a sé, escludendo il mago e se stesso (se ce n'è più d'una, sceglie l'attaccante). Se lo supera, il mago non può usare di nuovo questo privilegio su di esso finché non completa un riposo lungo. Il mago deve decidere prima di sapere se l'attacco colpisce. Le creature che non possono essere affascinate sono immuni."
            kid: "Quando qualcuno entro 9 m ti attacca, con la tua reazione puoi confonderlo: se fallisce un tiro salvezza su Saggezza con CD {cd}, attacca la creatura più vicina a lui invece di te."
        10:
          - name: Dividere l'Ammaliamento
            short: "Un incantesimo di ammaliamento di 1° livello o superiore che bersaglia una sola creatura può bersagliarne una seconda."
            text: "Quando il mago lancia un incantesimo di ammaliamento di 1° livello o superiore che bersaglia una sola creatura, può fare in modo che bersagli anche una seconda creatura."
            kid: "Gli incantesimi di ammaliamento che colpiscono una sola creatura possono colpirne due."
        14:
          - name: Alterare i Ricordi
            short: "Chi affascini con un incantesimo di ammaliamento può non accorgersene; con un'azione puoi fargli dimenticare fino a 1 + mod. CAR ore (TS su INT)."
            text: "Quando il mago lancia un incantesimo di ammaliamento per affascinare una o più creature, può alterare la percezione di una di esse in modo che non si renda conto di essere stata affascinata. Inoltre, una volta prima che l'incantesimo termini, può usare la sua azione per cercare di farle dimenticare parte del tempo trascorso affascinata: la creatura deve superare un tiro salvezza su Intelligenza contro la CD degli incantesimi da mago o perdere i ricordi di un numero di ore pari a 1 + il modificatore di Carisma del mago (minimo 1). Il mago può farle dimenticare meno tempo, e comunque non più della durata dell'incantesimo."
            kid: "Chi incanti con un incantesimo di ammaliamento non si accorge di essere stato incantato, e puoi provare a fargli dimenticare un po' di quel tempo."
    evocation:
      name: Scuola di Invocazione
      name_en: School of Evocation
      features:
        2:
          - name: Invocatore Esperto
            name_f: Invocatrice Esperta
            short: "Copiare un incantesimo di invocazione nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di invocazione nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di invocazione ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Plasmare Incantesimi
            short: "Con un incantesimo di invocazione che colpisce creature che vedi, scegline fino a 1 + livello dell'incantesimo: superano automaticamente il TS e non subiscono danni se ne subirebbero la metà."
            text: "Il mago può creare sacche di relativa sicurezza all'interno degli effetti dei suoi incantesimi di invocazione. Quando lancia un incantesimo di invocazione che influenza altre creature che può vedere, può sceglierne un numero pari a 1 + il livello dell'incantesimo: le creature scelte superano automaticamente i tiri salvezza contro l'incantesimo e non subiscono danni se normalmente ne subirebbero la metà con un tiro salvezza superato."
            kid: "Quando lanci un incantesimo di invocazione su un'area, puoi proteggere alcuni amici (1 + il livello dell'incantesimo): non subiscono danni."
        6:
          - name: Trucchetto Potente
            short: "Chi supera il TS contro un tuo trucchetto che infligge danni subisce comunque metà dei danni (ma nessun altro effetto)."
            text: "I trucchetti del mago che infliggono danni influenzano anche le creature che altrimenti eviterebbero il grosso dell'effetto: quando una creatura supera un tiro salvezza contro un trucchetto del mago, subisce la metà dei danni del trucchetto (se previsti), ma nessun effetto aggiuntivo."
            kid: "Anche chi supera il tiro salvezza contro i tuoi trucchetti subisce metà dei danni."
        10:
          - name: Invocazione Potente
            short: "Aggiungi il mod. INT a un tiro per i danni di ogni incantesimo di invocazione da mago."
            text: "Il mago aggiunge il suo modificatore di Intelligenza a un tiro per i danni di qualsiasi incantesimo di invocazione da mago che lancia."
            kid: "Aggiungi {mod} (la tua Intelligenza) ai danni dei tuoi incantesimi di invocazione."
        14:
          - name: Saturazione Magica
            short: "Un incantesimo da mago di 1°-5° livello che infligge danni può infliggere il massimo. Dal secondo uso prima di un riposo lungo subisci 2d12 danni necrotici per livello dell'incantesimo (+1d12 per ogni uso successivo)."
            text: "Quando il mago lancia un incantesimo da mago compreso tra il 1° e il 5° livello che infligge danni, può infliggere il massimo dei danni con quell'incantesimo. La prima volta non subisce alcun effetto avverso; se usa di nuovo questo privilegio prima di completare un riposo lungo, subito dopo il lancio subisce 2d12 danni necrotici per ogni livello dell'incantesimo, e ogni uso successivo prima del riposo lungo aumenta questi danni di 1d12 per livello. Questi danni ignorano resistenze e immunità."
            kid: "Un incantesimo da 1° a 5° livello che fa danni può fare il massimo dei danni. La prima volta va bene, ma se lo rifai prima di un riposo lungo ti ferisci tu."
    illusion:
      name: Scuola di Illusione
      name_en: School of Illusion
      features:
        2:
          - name: Illusionista Esperto
            name_f: Illusionista Esperta
            short: "Copiare un incantesimo di illusione nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di illusione nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di illusione ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Illusione Minore Migliorata
            short: "Impari illusione minore senza contarla tra i trucchetti (se la conosci già, un altro trucchetto da mago); con un solo lancio crei sia un suono sia un'immagine."
            text: "Quando il mago sceglie questa scuola al 2° livello, impara il trucchetto illusione minore; se lo conosce già, impara invece un altro trucchetto da mago a sua scelta. Questo trucchetto non conta nel numero di trucchetti conosciuti. Quando lancia illusione minore, può creare sia un suono sia un'immagine con un singolo lancio dell'incantesimo."
            grants_cantrip: minor_illusion
            kid: "Conosci il trucchetto illusione minore in regalo, e con un solo lancio crei insieme un suono e un'immagine."
        6:
          - name: Illusioni Malleabili
            short: "Con un'azione puoi modificare un tuo incantesimo di illusione che dura 1 minuto o più, se puoi vedere l'illusione."
            text: "Quando il mago lancia un incantesimo di illusione con una durata di 1 minuto o più, può usare la sua azione per cambiare la natura di quell'illusione (rispettando i normali parametri dell'incantesimo), purché possa vederla."
            kid: "Con un'azione puoi cambiare le tue illusioni che durano 1 minuto o più, purché tu le veda."
        10:
          - name: Sé Illusorio
            short: "Reazione: quando una creatura ti attacca, interponi un tuo doppio illusorio e l'attacco ti manca automaticamente. 1/riposo breve o lungo."
            text: "Quando una creatura effettua un tiro per colpire contro il mago, egli può usare la sua reazione per interporre un duplicato illusorio tra sé e l'attaccante. L'attacco manca automaticamente il mago, poi l'illusione si dissolve. Una volta usato questo privilegio, non può usarlo di nuovo finché non completa un riposo breve o lungo."
            kid: "Quando qualcuno ti attacca, con la tua reazione crei un tuo doppio illusorio e l'attacco ti manca. Poi devi riposare (anche breve) per rifarlo."
        14:
          - name: Realtà Illusoria
            short: "Quando lanci un incantesimo di illusione di 1° livello o superiore, con un'azione bonus rendi reale per 1 minuto un oggetto inanimato non magico dell'illusione (non può infliggere danni)."
            text: "Quando il mago lancia un incantesimo di illusione di 1° livello o superiore, può scegliere un oggetto inanimato e non magico che fa parte dell'illusione e renderlo reale, come azione bonus nel suo turno finché l'incantesimo dura. L'oggetto resta reale per 1 minuto. Per esempio, può creare l'illusione di un ponte su un precipizio e poi renderlo reale per attraversarlo. L'oggetto non può infliggere danni né danneggiare direttamente nessuno."
            kid: "Con un'azione bonus puoi rendere vero per 1 minuto un oggetto delle tue illusioni (per esempio un ponte), ma non può fare male a nessuno."
    necromancy:
      name: Scuola di Necromanzia
      name_en: School of Necromancy
      features:
        2:
          - name: Necromante Esperto
            name_f: Necromante Esperta
            short: "Copiare un incantesimo di necromanzia nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di necromanzia nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di necromanzia ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Raccolto Sinistro
            short: "1 volta per turno, quando uccidi una o più creature con un incantesimo di 1° livello o superiore, recuperi PF pari al doppio del livello dell'incantesimo (triplo se di necromanzia). Non con costrutti o non morti."
            text: "Il mago ottiene la capacità di raccogliere energia vitale dalle creature che uccide con i suoi incantesimi. Una volta per turno, quando uccide una o più creature con un incantesimo di 1° livello o superiore, recupera punti ferita pari al doppio del livello dell'incantesimo, o al triplo se l'incantesimo appartiene alla scuola di necromanzia. Non ottiene questo beneficio uccidendo costrutti o non morti."
            kid: "Quando sconfiggi un nemico con un incantesimo di 1° livello o più, recuperi PF: il doppio del livello dell'incantesimo (il triplo se è di necromanzia)."
        6:
          - name: Servitori Non Morti
            short: "Aggiungi animare morti al libro; quando lo lanci animi un cadavere in più. I non morti che crei con la necromanzia hanno PF massimi + livello da mago e aggiungono il tuo bonus di competenza ai danni delle armi."
            text: "Il mago aggiunge l'incantesimo animare morti al suo libro degli incantesimi, se non lo possiede già. Quando lancia animare morti, può bersagliare un cadavere o un mucchio di ossa aggiuntivo, creando un altro zombi o scheletro. Ogni non morto che crea con un incantesimo di necromanzia ottiene due benefici: il suo massimo dei punti ferita aumenta di un ammontare pari al livello da mago, e aggiunge il bonus di competenza del mago ai tiri per i danni delle sue armi."
            kid: "Quando animi dei non morti ne crei uno in più, e sono più forti del normale."
        10:
          - name: Abituato alla Non Morte
            name_f: Abituata alla Non Morte
            short: "Resistenza ai danni necrotici; il tuo massimo dei PF non può essere ridotto."
            text: "Il mago ha resistenza ai danni necrotici e il suo massimo dei punti ferita non può essere ridotto."
            kid: "I danni necrotici ti fanno solo metà danno, e nessuno può abbassare i tuoi PF massimi."
        14:
          - name: Comandare Non Morti
            short: "Azione: un non morto entro 18 m fa un TS su CAR (CD incantesimi); se fallisce diventa amichevole e ti obbedisce finché non riusi il privilegio. Vantaggio al TS se ha INT 8+; se ha INT 12+ ripete il TS ogni ora."
            text: "Il mago può usare la magia per porre i non morti sotto il suo controllo, anche quelli creati da altri. Come azione, sceglie un non morto che può vedere entro 18 metri: la creatura deve effettuare un tiro salvezza su Carisma contro la CD degli incantesimi da mago. Se lo supera, il mago non può usare di nuovo questo privilegio su di essa; se lo fallisce, diventa amichevole nei suoi confronti e obbedisce ai suoi ordini finché il mago non usa di nuovo questo privilegio. Un non morto con Intelligenza pari o superiore a 8 ha vantaggio al tiro salvezza; se lo fallisce e ha Intelligenza pari o superiore a 12, può ripeterlo alla fine di ogni ora finché non lo supera e si libera."
            kid: "Con un'azione puoi provare a comandare un non morto entro 18 m: se fallisce un tiro salvezza su Carisma con CD {cd}, diventa tuo amico e ti obbedisce."
    transmutation:
      name: Scuola di Trasmutazione
      name_en: School of Transmutation
      features:
        2:
          - name: Trasmutatore Esperto
            name_f: Trasmutatrice Esperta
            short: "Copiare un incantesimo di trasmutazione nel libro costa metà tempo e metà oro."
            text: "A partire da quando sceglie questa scuola al 2° livello, il tempo e il denaro che il mago deve spendere per copiare un incantesimo di trasmutazione nel suo libro degli incantesimi sono dimezzati."
            kid: "Copiare nel tuo libro un incantesimo di trasmutazione ti costa metà tempo e metà oro."
            kid_hide: true
          - name: Alchimia Minore
            short: "Trasformi temporaneamente un oggetto non magico di legno, pietra (non preziosa), ferro, rame o argento in un altro di questi materiali (10 minuti per ogni cubo di 30 cm); dura 1 ora o finché non perdi la concentrazione."
            text: "Il mago può alterare temporaneamente le proprietà fisiche di un oggetto non magico, trasformandolo da una sostanza a un'altra. Esegue una speciale procedura alchemica su un oggetto composto interamente di legno, pietra (ma non pietre preziose), ferro, rame o argento, trasformandolo in uno degli altri materiali; servono 10 minuti per ogni cubo di 30 cm di lato. Dopo 1 ora, o se il mago perde la concentrazione (come se si stesse concentrando su un incantesimo), il materiale torna alla sostanza originale."
            kid: "Con un po' di lavoro trasformi per 1 ora un oggetto di legno, pietra, ferro, rame o argento in uno di questi altri materiali."
        6:
          - name: Pietra del Trasmutatore
            short: "In 8 ore crei una pietra che dà a chi la porta un beneficio a scelta: scurovisione 18 m, +3 m di velocità, competenza nei TS su COS o resistenza ad acido, freddo, fuoco, fulmine o tuono. Puoi cambiarlo quando lanci un incantesimo di trasmutazione di 1° livello o superiore."
            text: "Il mago può dedicare 8 ore a creare una pietra del trasmutatore che immagazzina magia di trasmutazione; può tenerla o darla a un'altra creatura. Chi la possiede ottiene un beneficio scelto dal mago alla creazione: scurovisione entro 18 metri; velocità aumentata di 3 metri finché non è ingombrato; competenza nei tiri salvezza su Costituzione; resistenza ai danni da acido, freddo, fuoco, fulmine o tuono (a scelta del mago). Ogni volta che il mago lancia un incantesimo di trasmutazione di 1° livello o superiore, può cambiare l'effetto della pietra se la ha con sé. Se crea una nuova pietra, la precedente smette di funzionare."
            kid: "In 8 ore crei una pietra magica che dà un dono a chi la porta: vedere al buio, correre più veloce, resistere a un tipo di danno o essere più tenace (tiri salvezza su Costituzione)."
        10:
          - name: Mutaforma
            short: "Aggiungi metamorfosi al libro; puoi lanciarla senza slot, solo su te stesso, trasformandoti in una bestia di GS 1 o inferiore. 1/riposo breve o lungo."
            text: "Il mago aggiunge l'incantesimo metamorfosi al suo libro degli incantesimi, se non lo possiede già. Può lanciare metamorfosi senza spendere uno slot incantesimo: quando lo fa, può bersagliare solo se stesso e trasformarsi in una bestia di grado di sfida pari o inferiore a 1. Una volta lanciato così, non può farlo di nuovo finché non completa un riposo breve o lungo, anche se può comunque lanciarlo normalmente usando uno slot."
            kid: "Una volta per riposo (anche breve) puoi diventare un animale fino a GS 1, lanciando metamorfosi su di te senza usare slot."
        14:
          - name: Maestro Trasmutatore
            name_f: Maestra Trasmutatrice
            short: "Azione: consumi la pietra del trasmutatore per un effetto: Trasformazione Superiore, Panacea, Ripristinare la Vita (rianimare morti senza slot) o Ripristinare la Giovinezza. Non puoi crearne un'altra fino a un riposo lungo."
            text: "Il mago può usare la sua azione per consumare in un colpo solo la magia contenuta nella sua pietra del trasmutatore, che viene distrutta (non può crearne un'altra finché non completa un riposo lungo), scegliendo uno degli effetti seguenti. Trasformazione Superiore: trasmuta un oggetto non magico che entra in un cubo di 1,5 metri in un altro oggetto non magico di taglia e massa simili e di valore pari o inferiore, manipolandolo per 10 minuti. Panacea: una creatura toccata con la pietra viene liberata da tutte le maledizioni, le malattie e i veleni e recupera tutti i punti ferita. Ripristinare la Vita: lancia rianimare morti su una creatura toccata con la pietra senza spendere slot e senza averlo nel libro. Ripristinare la Giovinezza: l'età apparente di una creatura consenziente toccata con la pietra si riduce di 3d10 anni (minimo 13), senza allungarne la vita."
            kid: "Puoi consumare la tua pietra per una grande magia: trasformare un oggetto, guarire del tutto qualcuno, riportarlo in vita o farlo ringiovanire."
