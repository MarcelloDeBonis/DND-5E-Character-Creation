fighting_styles:
  archery:
    name: Tiro
    text: "+2 ai tiri per colpire con le armi a distanza."
    ranged_attack_bonus: 2
  defense:
    name: Difesa
    text: "+1 alla CA quando indossi un'armatura."
    ac_bonus_armored: 1
  dueling:
    name: Duello
    text: "+2 ai danni quando impugni un'arma da mischia in una mano e nessun'altra arma."
    dueling_damage_bonus: 2
  great_weapon_fighting:
    name: Combattere con Armi Possenti
    text: "Quando ottieni 1 o 2 a un dado di danno con un'arma da mischia a due mani o versatile usata a due mani, puoi ripetere il tiro (usa il nuovo risultato)."
  protection:
    name: Protezione
    text: "Reazione (con scudo): imponi svantaggio a un attacco contro una creatura entro 1,5 m da te."
  two_weapon_fighting:
    name: Combattere con Due Armi
    text: "Aggiungi il modificatore di caratteristica ai danni del secondo attacco quando combatti con due armi."

wizard_cantrips:
  acid_splash: {name: Spruzzo Acido, text: "Fino a 2 creature entro 1,5 m l'una dall'altra, a 18 m: TS DES o 1d6 danni da acido."}
  blade_ward: {name: Barriera di Lame, text: "Resistenza ai danni contundenti, perforanti e taglienti da attacchi con armi fino alla fine del tuo prossimo turno."}
  chill_touch: {name: Tocco Gelido, text: "Attacco a distanza (36 m): 1d8 danni necrotici, il bersaglio non recupera PF fino al tuo prossimo turno."}
  dancing_lights: {name: Luci Danzanti, text: "Crei fino a 4 luci fluttuanti (concentrazione, 1 minuto)."}
  fire_bolt: {name: Dardo di Fuoco, text: "Attacco a distanza (36 m): 1d10 danni da fuoco."}
  friends: {name: Amici, text: "Vantaggio alle prove di Carisma contro una creatura non ostile per 1 minuto (concentrazione)."}
  light: {name: Luce, text: "Un oggetto emette luce intensa per 6 m e fioca per altri 6 m, per 1 ora."}
  mage_hand: {name: Mano Magica, text: "Una mano spettrale manipola oggetti (max 5 kg) entro 9 m per 1 minuto."}
  mending: {name: Riparare, text: "Ripari una singola rottura o strappo in un oggetto."}
  message: {name: Messaggio, text: "Sussurri un messaggio a una creatura entro 36 m, che può rispondere."}
  minor_illusion: {name: Illusione Minore, text: "Crei un suono o un'immagine di un oggetto per 1 minuto."}
  poison_spray: {name: Spruzzo Velenoso, text: "Una creatura entro 3 m: TS COS o 1d12 danni da veleno."}
  prestidigitation: {name: Prestidigitazione, text: "Piccoli trucchi magici (accendere/spegnere, pulire, aromatizzare, un piccolo segno)."}
  ray_of_frost: {name: Raggio di Gelo, text: "Attacco a distanza (18 m): 1d8 danni da freddo e velocità -3 m fino al tuo prossimo turno."}
  shocking_grasp: {name: Stretta Folgorante, text: "Attacco in mischia (vantaggio contro armature di metallo): 1d8 danni da fulmine, niente reazioni."}
  true_strike: {name: Colpo Accurato, text: "Vantaggio al primo tiro per colpire contro il bersaglio nel tuo prossimo turno (concentrazione)."}
