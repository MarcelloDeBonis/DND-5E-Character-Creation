  whip:          {name: Frusta,            category: martial, type: melee,  damage: 1d4,  damage_type: tagliente,   properties: [finesse, reach], weight: 1.5, cost: "2 mo"}
  # --- Armi da guerra a distanza ---
  blowgun:       {name: Cerbottana,        category: martial, type: ranged, damage: "1",  damage_type: perforante,  properties: [ammunition, loading], range: "7,5/30", weight: 0.5, cost: "10 mo"}
  hand_crossbow: {name: Balestra a Mano,   category: martial, type: ranged, damage: 1d6,  damage_type: perforante,  properties: [ammunition, light, loading], range: "9/36", weight: 1.5, cost: "75 mo"}
  heavy_crossbow: {name: Balestra Pesante, category: martial, type: ranged, damage: 1d10, damage_type: perforante,  properties: [ammunition, heavy, loading, two_handed], range: "30/120", weight: 9, cost: "50 mo"}
