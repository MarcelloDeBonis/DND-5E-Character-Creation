  shawm:                  {name: Ciaramella,                  category: musical}
  viol:                   {name: Viola,                       category: musical}
  # --- altri strumenti ---
  disguise_kit:           {name: Trucchi per il camuffamento, category: other}
  forgery_kit:            {name: Arnesi da falsario,          category: other}
  herbalism_kit:          {name: Borsa da erborista,          category: other}
  navigators_tools:       {name: Strumenti da navigatore,     category: other}
  poisoners_kit:          {name: Sostanze da avvelenatore,    category: other}
  thieves_tools:          {name: Arnesi da scasso,            category: other}
  land_vehicles:          {name: Veicoli (terrestri),         category: other}
  water_vehicles:         {name: Veicoli (acquatici),         category: other}
