# Armi e armature (PHB 2014, cap. 5). Danni in notazione dadi; gittata in metri (normale/lunga).
# Anche: weapon_categories (nomi italiani delle categorie di armi), tools (strumenti), packs (dotazioni), fighting_styles.
# properties: finesse, light, heavy, two_handed, versatile (con danno), thrown, ammunition, reach, loading, special
weapons:
  # --- Armi semplici da mischia ---
  club:          {name: Randello,          category: simple,  type: melee,  damage: 1d4,  damage_type: contundente, properties: [light], weight: 1, cost: "1 ma"}
  dagger:        {name: Pugnale,           category: simple,  type: melee,  damage: 1d4,  damage_type: perforante,  properties: [finesse, light, thrown], range: "6/18", weight: 0.5, cost: "2 mo"}
  greatclub:     {name: Randello Pesante,  category: simple,  type: melee,  damage: 1d8,  damage_type: contundente, properties: [two_handed], weight: 5, cost: "2 ma"}
  handaxe:       {name: Ascia,             category: simple,  type: melee,  damage: 1d6,  damage_type: tagliente,   properties: [light, thrown], range: "6/18", weight: 1, cost: "5 mo"}
  javelin:       {name: Giavellotto,       category: simple,  type: melee,  damage: 1d6,  damage_type: perforante,  properties: [thrown], range: "9/36", weight: 1, cost: "5 ma"}
  light_hammer:  {name: Martello Leggero,  category: simple,  type: melee,  damage: 1d4,  damage_type: contundente, properties: [light, thrown], range: "6/18", weight: 1, cost: "2 mo"}
  mace:          {name: Mazza,             category: simple,  type: melee,  damage: 1d6,  damage_type: contundente, properties: [], weight: 2, cost: "5 mo"}
  quarterstaff:  {name: Bastone Ferrato,   category: simple,  type: melee,  damage: 1d6,  damage_type: contundente, properties: [versatile], versatile: 1d8, weight: 2, cost: "2 ma"}
  sickle:        {name: Falcetto,          category: simple,  type: melee,  damage: 1d4,  damage_type: tagliente,   properties: [light], weight: 1, cost: "1 mo"}
