fighting_styles:
  archery:
    name: Tiro
    text: "+2 ai tiri per colpire con le armi a distanza."
    ranged_attack_bonus: 2
  defense:
    name: Difesa
    text: "+1 alla CA quando indossi un'armatura."
    ac_bonus_armored: 1
  dueling:
    name: Duello
    text: "+2 ai danni quando impugni un'arma da mischia in una mano e nessun'altra arma."
    dueling_damage_bonus: 2
  great_weapon_fighting:
    name: Combattere con Armi Possenti
    text: "Quando ottieni 1 o 2 a un dado di danno con un'arma da mischia a due mani o versatile usata a due mani, puoi ripetere il tiro (usa il nuovo risultato)."
  protection:
    name: Protezione
    text: "Reazione (con scudo): imponi svantaggio a un attacco contro una creatura entro 1,5 m da te."
  two_weapon_fighting:
    name: Combattere con Due Armi
    text: "Aggiungi il modificatore di caratteristica ai danni del secondo attacco quando combatti con due armi."

# Categorie di armi usate nelle competenze (classi, talenti): chiave -> nome italiano per la scheda.
weapon_categories:
  simple: armi semplici
  martial: armi da guerra
  improvised: armi improvvisate

# Strumenti (PHB 2014, cap. 5; nomi dell'SRD 5.1 in italiano). La chiave serve a expertise_tools, tool_choices e a
# evitare doppioni; "name" è la stringa che compare in tools / background_tools (deve coincidere).
# category: artisan = strumenti da artigiano, gaming = giochi, musical = strumenti musicali, other = gli altri.
tools:
  # --- strumenti da artigiano ---
  alchemists_supplies:    {name: Scorte da alchimista,        category: artisan}
  brewers_supplies:       {name: Scorte da birraio,           category: artisan}
  calligraphers_supplies: {name: Scorte da calligrafo,        category: artisan}
  carpenters_tools:       {name: Strumenti da falegname,      category: artisan}
  cartographers_tools:    {name: Strumenti da cartografo,     category: artisan}
  cobblers_tools:         {name: Strumenti da calzolaio,      category: artisan}
  cooks_utensils:         {name: Utensili da cuoco,           category: artisan}
  glassblowers_tools:     {name: Strumenti da soffiatore,     category: artisan}
  jewelers_tools:         {name: Strumenti da gioielliere,    category: artisan}
  leatherworkers_tools:   {name: Strumenti da conciatore,     category: artisan}
  masons_tools:           {name: Strumenti da muratore,       category: artisan}
  painters_supplies:      {name: Strumenti da pittore,        category: artisan}
  potters_tools:          {name: Strumenti da vasaio,         category: artisan}
  smiths_tools:           {name: Strumenti da fabbro,         category: artisan}
  tinkers_tools:          {name: Strumenti da inventore,      category: artisan}
  weavers_tools:          {name: Strumenti da tessitore,      category: artisan}
  woodcarvers_tools:      {name: Strumenti da intagliatore,   category: artisan}
  # --- giochi ---
  dice_set:               {name: Dadi,                        category: gaming}
