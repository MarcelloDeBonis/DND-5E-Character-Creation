  sling:         {name: Fionda,            category: simple,  type: ranged, damage: 1d4,  damage_type: contundente, properties: [ammunition], range: "9/36", weight: 0, cost: "1 ma"}
  # --- Armi da guerra da mischia ---
  battleaxe:     {name: Ascia da Battaglia, category: martial, type: melee, damage: 1d8,  damage_type: tagliente,   properties: [versatile], versatile: 1d10, weight: 2, cost: "10 mo"}
  flail:         {name: Mazzafrusto,       category: martial, type: melee,  damage: 1d8,  damage_type: contundente, properties: [], weight: 1, cost: "10 mo"}
  glaive:        {name: Falcione,          category: martial, type: melee,  damage: 1d10, damage_type: tagliente,   properties: [heavy, reach, two_handed], weight: 3, cost: "20 mo"}
  greataxe:      {name: Ascia Bipenne,     category: martial, type: melee,  damage: 1d12, damage_type: tagliente,   properties: [heavy, two_handed], weight: 3.5, cost: "30 mo"}
  greatsword:    {name: Spadone,           category: martial, type: melee,  damage: 2d6,  damage_type: tagliente,   properties: [heavy, two_handed], weight: 3, cost: "50 mo"}
  halberd:       {name: Alabarda,          category: martial, type: melee,  damage: 1d10, damage_type: tagliente,   properties: [heavy, reach, two_handed], weight: 3, cost: "20 mo"}
  lance:         {name: Lancia da Cavaliere, category: martial, type: melee, damage: 1d12, damage_type: perforante, properties: [reach, special], weight: 3, cost: "10 mo"}
  longsword:     {name: Spada Lunga,       category: martial, type: melee,  damage: 1d8,  damage_type: tagliente,   properties: [versatile], versatile: 1d10, weight: 1.5, cost: "15 mo"}
