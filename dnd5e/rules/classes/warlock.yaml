  features:
    1:
    - name: Patrono Ultraterreno
      short: 'Scegli il patrono del tuo patto: Arcifata, Immondo o Grande Antico. Dà privilegi al 1°, 6°, 10° e 14° livello e allarga la tua lista di incantesimi.'
      text: Il warlock deve i suoi poteri a un patto con un essere ultraterreno, scelto tra Arcifata, Immondo e Grande Antico. Il patrono concede privilegi al 1°, 6°, 10° e 14° livello e aggiunge alcuni
        incantesimi tra quelli che il warlock può imparare.
      kid: 'La tua magia è un regalo di un essere potentissimo: il tuo patrono. Leggi i poteri che ti dà; altri arrivano al 6°, 10° e 14° livello.'
      kid_hide: true
    - name: Magia del Patto
      short: 'Incantatore del patto (Carisma): conosci {t_cantrips} trucchetti e {t_spells_known} incantesimi da warlock; slot del patto: {t_slots} di {t_slot_level}° livello (sempre tutti dello stesso
        livello), recuperati con un riposo breve o lungo. CD {cd}, attacco {att}; focus arcano; rituali solo col Libro dei Segreti Antichi.'
      text: Il warlock conosce {t_cantrips} trucchetti e {t_spells_known} incantesimi della sua lista. Ha {t_slots} slot del patto di {t_slot_level}° livello (sono sempre tutti dello stesso livello) e li
        recupera con un riposo breve o lungo. Ogni incantesimo di 1° livello o superiore costa uno slot del patto e viene lanciato sempre al livello degli slot; si imparano solo incantesimi di quel livello o inferiore, e a ogni nuovo
        livello se ne può scambiare uno conosciuto con un altro della lista. CD = 8 + bonus di competenza + mod. CAR; attacco con incantesimo = bonus di competenza + mod. CAR. Focus arcano.
      kid: Conosci {t_cantrips} trucchetti (magie gratis) e {t_spells_known} incantesimi. Gli slot (ne hai {t_slots}, di {t_slot_level}° livello) si ricaricano anche con un riposo breve di 1 ora. Per colpire
        con una magia tira d20{att}.
    2:
    - name: Suppliche Occulte
      short: 'Conosci {t_invocations_known} suppliche occulte a scelta (2 al 2°, fino a 8 al 18°): poteri magici sempre attivi o usabili a comando. Alcune richiedono un livello, un dono del patto o un trucchetto;
        a ogni livello puoi sostituirne una.'
      text: Il warlock sceglie 2 suppliche occulte al 2° livello e ne aggiunge altre come indica la tabella, fino a 8. Ogni volta che sale di livello può scambiarne una conosciuta con un'altra di cui soddisfa
        i prerequisiti.
      kid: 'Conosci {t_invocations_known} suppliche: poteri segreti insegnati dal tuo patrono, sempre pronti da usare. Quando sali di livello puoi cambiarne una.'
    3:
    - name: Dono del Patto
      short: 'Scegli un dono: Patto della Catena (un famiglio speciale), Patto della Lama (un''arma magica che evochi) o Patto del Tomo (un libro con 3 trucchetti di qualsiasi classe).'
      text: Al 3° livello il patrono concede al warlock un dono permanente, scelto tra Catena, Lama e Tomo. Il dono scelto è anche il prerequisito di alcune suppliche occulte.
      kid: 'Il patrono ti fa un regalo: un aiutante magico (Catena), un''arma che fai apparire (Lama) o un libro con magie in più (Tomo). Leggi il tuo nella guida.'
      kid_hide: true
    4:
    - name: Aumento dei Punteggi di Caratteristica
      short: +2 a una caratteristica o +1 a due (max 20), oppure un talento.
      text: Il warlock può aumentare di 2 un punteggio di caratteristica, o di 1 due punteggi (massimo 20), oppure scegliere un talento.
      kid: Aumenti una caratteristica di 2 (o due caratteristiche di 1), oppure scegli un talento. I numeri sulla scheda sono già aggiornati.
      kid_hide: true
    8:
    - name: Aumento dei Punteggi di Caratteristica
      short: +2 a una caratteristica o +1 a due (max 20), oppure un talento.
      text: Il warlock può aumentare di 2 un punteggio di caratteristica, o di 1 due punteggi (massimo 20), oppure scegliere un talento.
      kid: Aumenti una caratteristica di 2 (o due caratteristiche di 1), oppure scegli un talento. I numeri sulla scheda sono già aggiornati.
      kid_hide: true
    11:
    - name: Arcanum Mistico (6° livello)
      short: 'Scegli un incantesimo da warlock di 6° livello: lo lanci 1 volta senza usare slot, poi ti serve un riposo lungo per rifarlo.'
      text: 'All''11° livello il warlock sceglie come arcanum un incantesimo di 6° livello della sua lista e può lanciarlo una volta senza spendere slot, recuperando l''uso con un riposo lungo. Ne ottiene
        altri allo stesso modo: uno di 7° livello al 13°, uno di 8° al 15° e uno di 9° al 17°.'
      kid: Impari una magia potentissima di 6° livello. La lanci 1 volta senza usare slot; poi torna dopo un riposo lungo (una notte di sonno).
      arcanum_level: 6
    12:
    - name: Aumento dei Punteggi di Caratteristica
      short: +2 a una caratteristica o +1 a due (max 20), oppure un talento.
      text: Il warlock può aumentare di 2 un punteggio di caratteristica, o di 1 due punteggi (massimo 20), oppure scegliere un talento.
      kid: Aumenti una caratteristica di 2 (o due caratteristiche di 1), oppure scegli un talento. I numeri sulla scheda sono già aggiornati.
      kid_hide: true
    13:
    - name: Arcanum Mistico (7° livello)
      short: 'Scegli un incantesimo da warlock di 7° livello: 1 lancio senza slot per riposo lungo.'
      text: Al 13° livello il warlock sceglie come arcanum anche un incantesimo di 7° livello della sua lista e può lanciarlo una volta senza spendere slot, recuperando l'uso con un riposo lungo.
      kid: 'Impari un''altra magia potentissima, di 7° livello: anche questa la lanci 1 volta senza slot e torna dopo un riposo lungo.'
      arcanum_level: 7
    15:
    - name: Arcanum Mistico (8° livello)
      short: 'Scegli un incantesimo da warlock di 8° livello: 1 lancio senza slot per riposo lungo.'
      text: Al 15° livello il warlock sceglie come arcanum anche un incantesimo di 8° livello della sua lista e può lanciarlo una volta senza spendere slot, recuperando l'uso con un riposo lungo.
      kid: 'Impari un''altra magia potentissima, di 8° livello: la lanci 1 volta senza slot e torna dopo un riposo lungo.'
      arcanum_level: 8
    16:
    - name: Aumento dei Punteggi di Caratteristica
      short: +2 a una caratteristica o +1 a due (max 20), oppure un talento.
      text: Il warlock può aumentare di 2 un punteggio di caratteristica, o di 1 due punteggi (massimo 20), oppure scegliere un talento.
      kid: Aumenti una caratteristica di 2 (o due caratteristiche di 1), oppure scegli un talento. I numeri sulla scheda sono già aggiornati.
      kid_hide: true
    17:
    - name: Arcanum Mistico (9° livello)
      short: 'Scegli un incantesimo da warlock di 9° livello: 1 lancio senza slot per riposo lungo.'
      text: Al 17° livello il warlock sceglie come arcanum anche un incantesimo di 9° livello della sua lista e può lanciarlo una volta senza spendere slot, recuperando l'uso con un riposo lungo.
      kid: 'Impari la magia più forte che esista, di 9° livello: la lanci 1 volta senza slot e torna dopo un riposo lungo.'
      arcanum_level: 9
    19:
    - name: Aumento dei Punteggi di Caratteristica
      short: +2 a una caratteristica o +1 a due (max 20), oppure un talento.
      text: Il warlock può aumentare di 2 un punteggio di caratteristica, o di 1 due punteggi (massimo 20), oppure scegliere un talento.
      kid: Aumenti una caratteristica di 2 (o due caratteristiche di 1), oppure scegli un talento. I numeri sulla scheda sono già aggiornati.
      kid_hide: true
    20:
    - name: Maestro dell'Occulto
      short: Con 1 minuto di suppliche al patrono recuperi tutti gli slot del patto spesi. 1 volta per riposo lungo.
      text: Al 20° livello il warlock può implorare il patrono per 1 minuto e recuperare tutti gli slot di Magia del Patto spesi. Per rifarlo deve prima completare un riposo lungo.
      kid: 'Una volta, chiedi aiuto al tuo patrono per 1 minuto: tutti i tuoi slot di magia tornano pieni. Per rifarlo ti serve un riposo lungo.'
  option_lists:
    invocations:
      label: Suppliche Occulte
      level: 2
      count_table: invocations_known
      items:
        agonizing_blast:
          name: Deflagrazione Agonizzante
          prerequisite: Trucchetto deflagrazione occulta
          requires_cantrip: eldritch_blast
          cantrip_damage_bonus:
            ability: cha
            spells:
            - eldritch_blast
            per_beam: true
          short: Ogni raggio di deflagrazione occulta che colpisce aggiunge il mod. di Carisma ai danni.
          text: Quando un raggio di deflagrazione occulta va a segno, il warlock somma il proprio modificatore di Carisma ai danni di quel raggio.
          kid: Ogni raggio della tua Deflagrazione Occulta che colpisce fa {mod} danni in più. Se lanci più raggi, il bonus vale per ognuno!
        armor_of_shadows:
          name: Armatura delle Ombre
          prerequisite: null
          spell: mage_armor
          spell_uses: at_will
          short: Lanci armatura magica su di te a volontà, senza slot né componenti materiali (senza armatura CA 13 + mod. DES per 8 ore).
          text: Il warlock può lanciare armatura magica su se stesso quando vuole, senza spendere slot né componenti materiali. Se non indossa armature, la sua CA diventa 13 + modificatore di Destrezza
            per 8 ore.
          kid: 'Quando vuoi, senza usare slot, ti avvolgi di ombre che ti proteggono: se non porti un''armatura, la tua Classe Armatura diventa 13 + il tuo bonus di Destrezza per 8 ore.'
        ascendant_step:
          name: Passo Ascendente
          prerequisite: 9° livello
          min_level: 9
          spell: levitate
          spell_uses: at_will
          short: Lanci levitazione su di te a volontà, senza slot né componenti materiali (sali o scendi fino a 6 m per turno; concentrazione, fino a 10 minuti).
          text: Il warlock può lanciare levitazione su se stesso quando vuole, senza slot né componenti materiali. Finché mantiene la concentrazione (massimo 10 minuti) può spostarsi in verticale di 6 m
            per turno.
          kid: 'Quando vuoi, senza usare slot, fluttui in aria: sali o scendi fino a 6 m per turno, fino a 10 minuti. Devi mantenere la concentrazione.'
        beast_speech:
          name: Linguaggio delle Bestie
          prerequisite: null
          spell: speak_with_animals
          spell_uses: at_will
          short: Lanci parlare con gli animali a volontà, senza slot (10 minuti).
          text: Il warlock può lanciare parlare con gli animali quando vuole, senza spendere slot. Per 10 minuti capisce le bestie e si fa capire da loro.
          kid: 'Quando vuoi, senza usare slot, parli con gli animali per 10 minuti: capisci quello che dicono e loro capiscono te.'
        beguiling_influence:
          name: Influenza Ammaliante
          prerequisite: null
          skills:
          - deception
          - persuasion
          short: Ottieni competenza nelle abilità Inganno e Persuasione.
          text: Il warlock diventa competente nelle abilità Inganno e Persuasione.
          kid: 'Diventi bravissim{o} a convincere le persone e a raccontare bugie credibili: aggiungi il bonus di competenza alle prove di Persuasione e di Inganno.'
        bewitching_whispers:
          name: Sussurri Ammalianti
          prerequisite: 7° livello
          min_level: 7
          spell: compulsion
          spell_uses: long_rest_slot
          short: Una volta per riposo lungo lanci compulsione con uno slot da warlock (creature a scelta entro 9 m che ti sentono, TS su SAG; concentrazione, fino a 1 minuto).
          text: Il warlock può lanciare compulsione spendendo uno slot di Magia del Patto, poi deve completare un riposo lungo per farlo di nuovo. Chi fallisce il TS su Saggezza deve muoversi nella direzione
            che il warlock indica con un'azione bonus.
          kid: 'Una volta, poi serve un riposo lungo (usi uno slot): i nemici entro 9 m che ti sentono tirano un d20 (Saggezza contro {cd}). Chi fallisce si sposta dove dici tu, fino a 1 minuto.'
        book_of_ancient_secrets:
          name: Libro dei Segreti Antichi
          prerequisite: Patto del Tomo
          requires_pact: pact_of_the_tome
          spell_choice:
            count: 2
            level: 1
            ritual_only: true
            lists: any
          short: Copi nel Libro delle Ombre due incantesimi rituali di 1° livello di qualsiasi classe (non contano tra quelli conosciuti) e, col libro in mano, li lanci solo come rituali; così puoi lanciare
            come rituali anche gli incantesimi da warlock che conosci con l'etichetta rituale. Puoi aggiungere altri rituali che trovi (livello massimo metà del tuo livello da warlock, per eccesso; 2 ore e
            50 mo per livello).
          text: Il warlock trascrive nel Libro delle Ombre due incantesimi rituali di 1° livello presi da liste di qualsiasi classe, che non contano tra gli incantesimi conosciuti e che può lanciare solo
            come rituali tenendo in mano il libro; da quel momento può lanciare come rituale anche ogni incantesimo da warlock conosciuto che abbia l'etichetta rituale. In seguito può copiarvi altri rituali
            trovati, di livello non superiore alla metà del suo livello da warlock arrotondata per eccesso, spendendo 2 ore e 50 mo per ogni livello dell'incantesimo.
          kid: 'Nel tuo libro magico scrivi 2 incantesimi rituali di 1° livello presi da qualsiasi classe. Li lanci solo come rituali, con il libro in mano: ci metti 10 minuti in più, ma non consumi slot.'
        chains_of_carceri:
          name: Catene di Carceri
          prerequisite: 15° livello, Patto della Catena
          min_level: 15
          requires_pact: pact_of_the_chain
          spell: hold_monster
          spell_uses: at_will
          short: Lanci blocca mostri a volontà, senza slot né componenti materiali, ma solo su celestiali, immondi ed elementali; una creatura già bersagliata non può esserlo di nuovo prima del tuo riposo
            lungo.
          text: Il warlock può lanciare blocca mostri a volontà, senza slot né componenti materiali, purché il bersaglio sia un celestiale, un immondo o un elementale. Non può bersagliare di nuovo la stessa
            creatura finché non completa un riposo lungo.
          kid: 'Quando vuoi, senza usare slot, provi a bloccare un angelo, un demone o un elementale entro 27 m: se fallisce il tiro (Saggezza contro {cd}) resta paralizzato fino a 1 minuto. Stesso bersaglio:
            solo dopo un riposo lungo.'
        devils_sight:
          name: Vista del Diavolo
          prerequisite: null
          short: Vedi normalmente nell'oscurità, sia normale sia magica, fino a 36 m.
          text: Entro 36 m il warlock vede senza problemi al buio, anche quando l'oscurità è magica.
          kid: Al buio vedi come se fosse giorno, fino a 36 m. Funziona anche nel buio magico, dove nessun altro vede niente!
        dreadful_word:
          name: Parola Terribile
          prerequisite: 7° livello
          min_level: 7
          spell: confusion
          spell_uses: long_rest_slot
          short: Una volta per riposo lungo lanci confusione con uno slot da warlock (sfera di 3 m di raggio entro 27 m, TS su SAG; concentrazione, fino a 1 minuto).
          text: Il warlock può lanciare confusione spendendo uno slot di Magia del Patto, poi deve completare un riposo lungo per farlo di nuovo.
          kid: 'Una volta, poi serve un riposo lungo (usi uno slot): confondi i nemici in una zona di 3 m di raggio entro 27 m. Chi fallisce il tiro (Saggezza contro {cd}) si comporta a caso fino a 1 minuto.'
        eldritch_sight:
          name: Vista Occulta
          prerequisite: null
          spell: detect_magic
          spell_uses: at_will
          short: Lanci individuazione del magico a volontà, senza slot (percepisci la magia entro 9 m; concentrazione, fino a 10 minuti).
          text: Il warlock può lanciare individuazione del magico quando vuole, senza spendere slot.
          kid: Quando vuoi, senza usare slot, senti la magia attorno a te fino a 9 m e vedi brillare oggetti e creature magiche, fino a 10 minuti.
        eldritch_spear:
          name: Lancia Occulta
          prerequisite: Trucchetto deflagrazione occulta
          requires_cantrip: eldritch_blast
          range_override:
            eldritch_blast: 90
          short: La gittata di deflagrazione occulta passa da 36 m a 90 m.
          text: Quando il warlock lancia deflagrazione occulta, la gittata dell'incantesimo diventa di 90 m.
          kid: 'La tua Deflagrazione Occulta arriva lontanissimo: fino a 90 m invece di 36 m.'
        eyes_of_the_rune_keeper:
          name: Occhi del Custode delle Rune
          prerequisite: null
          short: Sai leggere qualsiasi scrittura.
          text: Il warlock riesce a leggere qualunque testo scritto, in qualsiasi lingua o alfabeto.
          kid: Riesci a leggere qualunque scritta, in qualsiasi lingua, anche alfabeti antichissimi che non hai mai visto.
        fiendish_vigor:
          name: Vigore Immondo
          prerequisite: null
          spell: false_life
          spell_uses: at_will
          short: Lanci vita falsata su di te a volontà come incantesimo di 1° livello, senza slot né componenti materiali (1d4 + 4 punti ferita temporanei per 1 ora).
          text: Il warlock può lanciare vita falsata su se stesso a volontà, sempre come incantesimo di 1° livello e senza slot né componenti materiali.
          kid: 'Quando vuoi, senza usare slot, ti dai 1d4 + 4 punti ferita temporanei per 1 ora: si consumano prima dei tuoi punti ferita veri. Non si sommano: se lo rifai, tieni quelli che preferisci.'
        gaze_of_two_minds:
          name: Sguardo delle Due Menti
          prerequisite: null
          short: 'Azione: tocchi un umanoide consenziente e percepisci con i suoi sensi fino alla fine del tuo turno successivo; finché siete sullo stesso piano puoi prolungare con un''azione ogni turno.
            Intanto sei ciec{o} e sord{o} verso ciò che ti circonda.'
          text: Con un'azione il warlock tocca un umanoide consenziente e vede e sente ciò che percepisce lui fino alla fine del proprio turno successivo; finché la creatura resta sul suo stesso piano di
            esistenza può rinnovare l'effetto con un'azione nei turni seguenti. Nel frattempo ne usa anche i sensi speciali ed è cieco e sordo rispetto a ciò che ha attorno.
          kid: Con un'azione tocchi una persona che è d'accordo e vedi e senti quello che vede e sente lei. Intanto però non vedi e non senti niente attorno a te. Ogni turno spendi un'azione per continuare.
        lifedrinker:
          name: Bevitore di Vita
          prerequisite: 12° livello, Patto della Lama
          min_level: 12
          requires_pact: pact_of_the_blade
          short: Quando colpisci con l'arma del patto infliggi danni necrotici extra pari al mod. di Carisma (minimo 1).
          text: Ogni colpo andato a segno con l'arma del patto infligge anche danni necrotici pari al modificatore di Carisma del warlock, con un minimo di 1.
          kid: Quando colpisci con la tua arma del patto, fai danni necrotici in più pari al tuo bonus di Carisma ({mod}, almeno 1).
        mask_of_many_faces:
          name: Maschera dai Molti Volti
          prerequisite: null
          spell: disguise_self
          spell_uses: at_will
          short: Lanci camuffare se stesso a volontà, senza slot (cambi aspetto e abiti con un'illusione per 1 ora).
          text: Il warlock può lanciare camuffare se stesso quando vuole, senza spendere slot.
          kid: 'Quando vuoi, senza usare slot, cambi faccia e vestiti per 1 ora. È solo un''illusione: chi ti tocca o ti osserva con molta attenzione può accorgersene.'
        master_of_myriad_forms:
          name: Maestro delle Miriadi di Forme
          prerequisite: 15° livello
          min_level: 15
          spell: alter_self
          spell_uses: at_will
          short: Lanci alterare se stesso a volontà, senza slot (concentrazione, fino a 1 ora).
          text: Il warlock può lanciare alterare se stesso quando vuole, senza spendere slot.
          kid: 'Quando vuoi, senza usare slot, cambi il tuo corpo fino a 1 ora: respiri sott''acqua, cambi aspetto, oppure ti spuntano artigli o zanne magiche da 1d6 danni. Devi mantenere la concentrazione.'
        minions_of_chaos:
          name: Servitori del Caos
          prerequisite: 9° livello
          min_level: 9
          spell: conjure_elemental
          spell_uses: long_rest_slot
          short: Una volta per riposo lungo lanci evoca elementale con uno slot da warlock (tempo di lancio 1 minuto; concentrazione, fino a 1 ora).
          text: Il warlock può lanciare evoca elementale spendendo uno slot di Magia del Patto, poi deve completare un riposo lungo per farlo di nuovo.
          kid: 'Una volta, poi serve un riposo lungo (usi uno slot): chiami un elementale di aria, terra, fuoco o acqua che ti obbedisce fino a 1 ora. Se perdi la concentrazione diventa tuo nemico!'
        mire_the_mind:
          name: Impantanare la Mente
          prerequisite: 5° livello
          min_level: 5
          spell: slow
          spell_uses: long_rest_slot
          short: Una volta per riposo lungo lanci lentezza con uno slot da warlock (fino a 6 creature in un cubo di 12 m entro 36 m, TS su SAG; concentrazione, fino a 1 minuto).
          text: Il warlock può lanciare lentezza spendendo uno slot di Magia del Patto, poi deve completare un riposo lungo per farlo di nuovo.
          kid: 'Una volta, poi serve un riposo lungo (usi uno slot): fino a 6 nemici entro 36 m tirano un d20 (Saggezza contro {cd}). Chi fallisce diventa lento fino a 1 minuto: metà velocità, -2 alla CA
            e niente reazioni.'
        misty_visions:
          name: Visioni Nebbiose
          prerequisite: null
          spell: silent_image
          spell_uses: at_will
          short: Lanci immagine silenziosa a volontà, senza slot né componenti materiali (illusione muta grande fino a un cubo di 4,5 m entro 18 m; concentrazione, fino a 10 minuti).
          text: Il warlock può lanciare immagine silenziosa quando vuole, senza slot né componenti materiali.
          kid: Quando vuoi, senza usare slot, crei un'illusione che si vede ma non fa rumore, grande fino a 4,5 m ed entro 18 m da te. Dura fino a 10 minuti se mantieni la concentrazione.
        one_with_shadows:
          name: Uno con le Ombre
          prerequisite: 5° livello
          min_level: 5
          short: In luce fioca o al buio, con un'azione diventi invisibile finché non ti muovi o non usi un'azione o una reazione.
          text: Se si trova in luce fioca o nell'oscurità, il warlock può usare un'azione per diventare invisibile. Torna visibile appena si sposta oppure compie un'azione o una reazione.
          kid: Se sei nella penombra o al buio, con un'azione diventi invisibile. Appena ti muovi o fai qualcosa (azione o reazione) torni visibile.
        otherworldly_leap:
          name: Balzo Ultraterreno
          prerequisite: 9° livello
          min_level: 9
          spell: jump
          spell_uses: at_will
          short: Lanci salto su di te a volontà, senza slot né componenti materiali (distanza di salto triplicata per 1 minuto).
          text: Il warlock può lanciare salto su se stesso quando vuole, senza slot né componenti materiali.
          kid: Quando vuoi, senza usare slot, per 1 minuto salti tre volte più lontano del normale.
        repelling_blast:
          name: Deflagrazione Respingente
          prerequisite: Trucchetto deflagrazione occulta
          requires_cantrip: eldritch_blast
          short: Ogni raggio di deflagrazione occulta che colpisce una creatura può spingerla fino a 3 m lontano da te in linea retta.
          text: Quando un raggio di deflagrazione occulta colpisce una creatura, il warlock può allontanarla da sé fino a 3 m in linea retta.
          kid: Quando un raggio della tua Deflagrazione Occulta colpisce, puoi spingere il nemico indietro fino a 3 m. Con più raggi lo spingi ancora più lontano!
        sculptor_of_flesh:
          name: Scultore di Carne
          prerequisite: 7° livello
          min_level: 7
          spell: polymorph
          spell_uses: long_rest_slot
          short: Una volta per riposo lungo lanci metamorfosi con uno slot da warlock (una creatura entro 18 m, TS su SAG se non consenziente; concentrazione, fino a 1 ora).
          text: Il warlock può lanciare metamorfosi spendendo uno slot di Magia del Patto, poi deve completare un riposo lungo per farlo di nuovo.
          kid: 'Una volta, poi serve un riposo lungo (usi uno slot): trasformi una creatura entro 18 m in un animale, fino a 1 ora. Se non vuole, tira un d20 (Saggezza contro {cd}) per resistere.'
        sign_of_ill_omen:
          name: Segno di Cattivo Presagio
          prerequisite: 5° livello
          min_level: 5
          spell: bestow_curse
          spell_uses: long_rest_slot
          short: Una volta per riposo lungo lanci scagliare maledizione con uno slot da warlock (a contatto, TS su SAG; con slot di 3° concentrazione fino a 1 minuto, di 4° fino a 10 minuti, di 5° 8 ore
            senza concentrazione).
          text: Il warlock può lanciare scagliare maledizione spendendo uno slot di Magia del Patto, poi deve completare un riposo lungo per farlo di nuovo.
          kid: 'Una volta, poi serve un riposo lungo (usi uno slot): tocchi un nemico e, se fallisce il tiro (Saggezza contro {cd}), lo maledici, per esempio con svantaggio su una caratteristica. Con uno
            slot di 5° livello dura 8 ore senza concentrazione.'
        thief_of_five_fates:
          name: Ladro dei Cinque Fati
          prerequisite: null
          spell: bane
          spell_uses: long_rest_slot
          short: Una volta per riposo lungo lanci anatema con uno slot da warlock (3 creature entro 9 m, +1 per ogni livello dello slot oltre il 1°; TS su CAR; -1d4 ai tiri per colpire e ai TS; concentrazione,
            fino a 1 minuto).
          text: Il warlock può lanciare anatema spendendo uno slot di Magia del Patto, poi deve completare un riposo lungo per farlo di nuovo.
          kid: 'Una volta, poi serve un riposo lungo (usi uno slot): fino a 3 nemici entro 9 m, di più con slot alti, tirano un d20 (Carisma contro {cd}). Chi fallisce toglie 1d4 ai suoi attacchi e tiri
            salvezza per 1 minuto.'
        thirsting_blade:
          name: Lama Assetata
          prerequisite: 5° livello, Patto della Lama
          min_level: 5
          requires_pact: pact_of_the_blade
          short: Quando usi l'azione di Attacco nel tuo turno, attacchi due volte con l'arma del patto.
          text: Ogni volta che effettua l'azione di Attacco nel proprio turno, il warlock può attaccare due volte con l'arma del patto invece di una.
          kid: Quando attacchi con la tua arma del patto, nello stesso turno colpisci 2 volte invece di 1.
        visions_of_distant_realms:
          name: Visioni di Reami Lontani
          prerequisite: 15° livello
          min_level: 15
          spell: arcane_eye
          spell_uses: at_will
          short: Lanci occhio arcano a volontà, senza slot (occhio invisibile che si muove e ti mostra ciò che vede; concentrazione, fino a 1 ora).
          text: Il warlock può lanciare occhio arcano quando vuole, senza spendere slot.
          kid: Quando vuoi, senza usare slot, crei un occhio magico invisibile che vola dove dici tu (9 m per turno) e ti fa vedere cosa c'è, anche al buio. Dura fino a 1 ora con la concentrazione.
        voice_of_the_chain_master:
          name: Voce del Signore della Catena
          prerequisite: Patto della Catena
          requires_pact: pact_of_the_chain
          short: Parli col famiglio nella mente e usi i suoi sensi a qualsiasi distanza, se siete sullo stesso piano; intanto puoi far parlare il famiglio con la tua voce.
          text: Finché è sul suo stesso piano di esistenza, il warlock comunica telepaticamente con il famiglio e percepisce attraverso i suoi sensi a qualunque distanza. Mentre usa i sensi del famiglio
            può far uscire la propria voce dalla sua bocca.
          kid: Parli nella mente del tuo famiglio e vedi e senti quello che vede e sente lui, anche se è lontanissimo. Puoi perfino parlare con la tua voce attraverso di lui!
        whispers_of_the_grave:
          name: Sussurri della Tomba
          prerequisite: 9° livello
          min_level: 9
          spell: speak_with_dead
          spell_uses: at_will
          short: Lanci parlare con i morti a volontà, senza slot (fino a 5 domande a un cadavere entro 3 m, in 10 minuti).
          text: Il warlock può lanciare parlare con i morti quando vuole, senza spendere slot.
          kid: Quando vuoi, senza usare slot, fai fino a 5 domande a un cadavere che ha ancora la bocca. Risponde con quello che sapeva da vivo, a volte in modo misterioso.
        witch_sight:
          name: Vista Stregata
          prerequisite: 15° livello
          min_level: 15
          short: Vedi la vera forma di mutaforma e di creature nascoste da illusioni o trasmutazioni entro 9 m, se sono in linea di vista.
          text: Il warlock scorge l'aspetto reale dei mutaforma e delle creature celate da magie di illusione o di trasmutazione, purché siano entro 9 m e in linea di vista.
          kid: 'Chi cambia forma o si nasconde dietro un''illusione non ti inganna: entro 9 m vedi com''è davvero.'
    pact_boons:
      label: Dono del Patto
      level: 3
      count_table: null
      count: 1
      items:
        pact_of_the_chain:
          name: Patto della Catena
          prerequisite: null
          spell: find_familiar
          spell_uses: ritual
          short: Impari trova famiglio e lo lanci come rituale (non conta tra gli incantesimi conosciuti); il famiglio può essere anche un imp, uno pseudodrago, un quasit o un folletto. Quando usi l'azione
            di Attacco puoi rinunciare a un tuo attacco perché il famiglio attacchi con la sua reazione.
          text: Il warlock conosce trova famiglio, lo lancia come rituale e può dare al famiglio anche forme speciali (imp, pseudodrago, quasit o folletto). Durante l'azione di Attacco può cedere uno dei
            propri attacchi al famiglio, che lo esegue usando la reazione.
          kid: 'Hai un famiglio, un piccolo aiutante magico: un animaletto oppure un diavoletto, un demonietto, un minidrago o un folletto. Puoi rinunciare a uno dei tuoi attacchi per farlo attaccare al
            posto tuo.'
        pact_of_the_blade:
          name: Patto della Lama
          prerequisite: null
          short: 'Azione: crei in mano un''arma del patto da mischia della forma che vuoi; sei competente, conta come magica e svanisce se resta a più di 1,5 m da te per 1 minuto. Con un rituale di 1 ora
            durante un riposo breve puoi legarti un''arma magica ed evocare quella.'
          text: Con un'azione il warlock fa comparire in mano un'arma da mischia a scelta, che sa usare e che conta come magica; sparisce se resta a più di 1,5 m da lui per 1 minuto, se ne crea un'altra,
            se la congeda o se lui muore. Con un rituale di 1 ora durante un riposo breve può invece legarsi un'arma magica (non un artefatto né un'arma senziente) e richiamarla nello stesso modo.
          kid: Con un'azione fai apparire in mano un'arma magica a tua scelta (spada, ascia, lancia...) e la sai usare. Se resta lontana da te per 1 minuto sparisce, ma con un'altra azione la fai riapparire.
        pact_of_the_tome:
          name: Patto del Tomo
          prerequisite: null
          cantrip_choice:
            count: 3
            lists: any
            ability: cha
          short: 'Ricevi il Libro delle Ombre: scegli 3 trucchetti da qualsiasi lista di classe, che lanci a volontà finché hai il libro con te (non contano tra i trucchetti conosciuti). Se lo perdi, un
            rito di 1 ora durante un riposo te ne dà uno nuovo.'
          text: Il warlock riceve un grimorio con tre trucchetti scelti da liste di qualsiasi classe, che per lui contano come incantesimi da warlock e si lanciano a volontà finché il libro è con lui. Un
            libro perso si ricrea con un rito di 1 ora durante un riposo breve o lungo, e quello vecchio si distrugge.
          kid: Ricevi un libro magico con 3 trucchetti presi da qualsiasi classe (anche dal mago o dal chierico!). Li puoi lanciare quando vuoi, ma solo se hai il libro con te.
  subclasses:
    archfey:
      name: Arcifata
      name_en: The Archfey
      expanded_spells:
        1:
        - faerie_fire
        - sleep
        2:
        - calm_emotions
        - phantasmal_force
        3:
        - blink
        - plant_growth
        4:
        - dominate_beast
        - greater_invisibility
        5:
        - dominate_person
        - seeming
      features:
        1:
        - name: Lista degli Incantesimi Ampliata
          name_en: Expanded Spell List
          short: 'Puoi scegliere come incantesimi da warlock anche: 1° luminescenza, sonno; 2° calmare emozioni, forza fantasmatica; 3° intermittenza, crescita vegetale; 4° dominare bestie, invisibilità
            superiore; 5° dominare persone, sembianza.'
          text: 'Quando impari un incantesimo da warlock puoi prenderlo anche da questo elenco, diviso per livello: 1° luminescenza e sonno; 2° calmare emozioni e forza fantasmatica; 3° intermittenza e
            crescita vegetale; 4° dominare bestie e invisibilità superiore; 5° dominare persone e sembianza. Non li conosci in automatico: per te contano solo come incantesimi da warlock.'
          kid: Il tuo patrono fatato ti offre magie extra, come sonno e luminescenza. Quando impari un nuovo incantesimo puoi sceglierlo anche da questo elenco.
          kid_hide: true
        - name: Presenza Fatata
          name_en: Fey Presence
          short: 'Azione: ogni creatura in un cubo di 3 m che parte da te fa un TS su SAG (CD {cd}); se fallisce è affascinata o spaventata (scegli tu) fino alla fine del tuo prossimo turno. 1/riposo breve
            o lungo.'
          text: 'Con un''azione sprigioni un fascino fatato in un cubo di 3 m adiacente a te: chi ci si trova fa un tiro salvezza su Saggezza contro la CD dei tuoi incantesimi e, se fallisce, resta affascinato
            o spaventato (a tua scelta) fino al termine del tuo turno successivo. Recuperi l''uso con un riposo breve o lungo.'
          kid: 'Con un''azione lanci la magia delle fate su chi è nel cubo di 3 m accanto a te: chi non fa almeno {cd} ti adora o ti teme (scegli tu) fino alla fine del tuo prossimo turno. Una volta per
            riposo.'
        6:
        - name: Fuga Nebbiosa
          name_en: Misty Escape
          short: 'Reazione quando subisci danni: diventi invisibile e ti teletrasporti fino a 18 m in uno spazio libero che vedi. L''invisibilità dura fino all''inizio del tuo prossimo turno o finché non
            attacchi o lanci un incantesimo. 1/riposo breve o lungo.'
          text: 'Appena subisci danni puoi usare la reazione per svanire: diventi invisibile e ricompari fino a 18 m più in là, in uno spazio libero che vedi. L''invisibilità finisce all''inizio del tuo
            turno successivo, o prima se attacchi o lanci un incantesimo; l''uso si ricarica con un riposo breve o lungo.'
          kid: 'Quando ti fanno male, puoi sparire subito: diventi invisibile e ti teletrasporti fino a 18 m. Resti invisibile fino al tuo turno, se non attacchi e non fai magie. Una volta per riposo.'
        10:
        - name: Difese Seducenti
          name_en: Beguiling Defenses
          short: 'Sei immune all''essere affascinat{o}. Se una creatura ci prova, con la reazione le rimandi l''effetto: TS su SAG (CD {cd}) o è affascinata da te per 1 minuto o finché non subisce danni.'
          text: 'Nessun effetto può renderti affascinato. Quando una creatura tenta di affascinarti puoi usare la reazione per ritorcerle contro il tentativo: se fallisce un tiro salvezza su Saggezza contro
            la tua CD degli incantesimi, resta affascinata da te per 1 minuto o finché non subisce danni.'
          kid: 'Nessuno può incantarti. Se qualcuno ci prova, con la reazione gli rimandi la magia: se non fa almeno {cd}, diventa lui tuo amico per 1 minuto, o finché qualcuno non gli fa male.'
        14:
        - name: Delirio Oscuro
          name_en: Dark Delirium
          short: 'Azione: una creatura che vedi entro 18 m fa un TS su SAG (CD {cd}); se fallisce, per 1 minuto (concentrazione) è affascinata o spaventata (scegli tu) e si crede in un mondo illusorio.
            Finisce se subisce danni. 1/riposo breve o lungo.'
          text: 'Con un''azione scegli una creatura entro 18 m che vedi: se fallisce un tiro salvezza su Saggezza contro la tua CD, per 1 minuto (con concentrazione, come per un incantesimo) è affascinata
            o spaventata a tua scelta e percepisce solo te e un mondo illusorio. L''effetto finisce prima se la creatura subisce danni; l''uso si ricarica con un riposo breve o lungo.'
          kid: 'Con un''azione chiudi un nemico entro 18 m in un sogno strano: se non fa almeno {cd}, per 1 minuto vede solo te e ti adora o ti teme. Devi restare concentrat{o}; se viene ferito si sveglia.
            Una volta per riposo.'
    fiend:
      name: Immondo
      name_en: The Fiend
      expanded_spells:
        1:
        - burning_hands
        - command
        2:
        - blindness_deafness
        - scorching_ray
        3:
        - fireball
        - stinking_cloud
        4:
        - fire_shield
        - wall_of_fire
        5:
        - flame_strike
        - hallow
      features:
        1:
        - name: Lista degli Incantesimi Ampliata
          name_en: Expanded Spell List
          short: 'Puoi scegliere come incantesimi da warlock anche: 1° mani brucianti, comando; 2° cecità/sordità, raggio rovente; 3° palla di fuoco, nube maleodorante; 4° scudo di fuoco, muro di fuoco;
            5° colpo infuocato, santificare.'
          text: 'Quando impari un incantesimo da warlock puoi prenderlo anche da questo elenco, diviso per livello: 1° mani brucianti e comando; 2° cecità/sordità e raggio rovente; 3° palla di fuoco e nube
            maleodorante; 4° scudo di fuoco e muro di fuoco; 5° colpo infuocato e santificare. Non li conosci in automatico: per te contano solo come incantesimi da warlock.'
          kid: Il tuo patrono infernale ti offre magie di fuoco e di comando, come mani brucianti e palla di fuoco. Quando impari un nuovo incantesimo puoi sceglierlo anche da questo elenco.
          kid_hide: true
        - name: Benedizione dell'Oscuro
          name_en: Dark One's Blessing
          short: Quando porti a 0 PF una creatura ostile, ottieni PF temporanei pari a mod. CAR + livello da warlock (minimo 1).
          text: Ogni volta che riduci a 0 punti ferita una creatura ostile, guadagni punti ferita temporanei pari al tuo modificatore di Carisma più il tuo livello da warlock, con un minimo di 1.
          kid: 'Ogni volta che sconfiggi un nemico ricevi punti ferita temporanei: il tuo livello ({livello}) più il tuo Carisma ({mod}). Sono uno scudo extra che si consuma per primo.'
        6:
        - name: Fortuna dell'Oscuro
          name_en: Dark One's Own Luck
          short: Quando fai una prova di caratteristica o un TS puoi aggiungere 1d10 al tiro, anche dopo aver visto il d20 (prima dell'esito). 1/riposo breve o lungo.
          text: Quando effettui una prova di caratteristica o un tiro salvezza puoi aggiungere 1d10 al risultato, decidendolo dopo aver visto il d20 ma prima che l'esito venga applicato. L'uso si ricarica
            con un riposo breve o lungo.
          kid: Una volta per riposo, quando una prova o un tiro salvezza va male, aggiungi 1d10 al risultato. Puoi deciderlo dopo aver visto il d20.
        10:
        - name: Resilienza Immonda
          name_en: Fiendish Resilience
          short: 'Dopo ogni riposo breve o lungo scegli un tipo di danno: hai resistenza a quel tipo finché non ne scegli un altro. Non vale contro armi magiche o d''argento.'
          text: Al termine di un riposo breve o lungo scegli un tipo di danno e ottieni resistenza a quel tipo finché non lo cambi con una nuova scelta. I danni inflitti da armi magiche o d'argento ignorano
            questa resistenza.
          kid: 'Dopo ogni riposo scegli un tipo di danno (fuoco, freddo, veleno...): quei danni ti fanno solo metà. Non vale contro armi magiche o d''argento.'
        14:
        - name: Scagliare all'Inferno
          name_en: Hurl Through Hell
          short: Quando colpisci una creatura con un attacco, la fai sparire fino alla fine del tuo prossimo turno; quando torna, se non è un immondo subisce 10d10 danni psichici. 1/riposo lungo.
          text: 'Quando colpisci una creatura con un attacco puoi spedirla in un viaggio da incubo nei piani inferiori: sparisce e riappare alla fine del tuo turno successivo nel suo spazio, o in quello
            libero più vicino. Al ritorno subisce 10d10 danni psichici se non è un immondo; l''uso si ricarica con un riposo lungo.'
          kid: 'Quando colpisci un nemico puoi spedirlo in un posto da incubo: sparisce fino alla fine del tuo prossimo turno. Al ritorno subisce 10d10 danni (se non è un demone o un diavolo). Una volta
            per riposo lungo.'
    great_old_one:
      name: Grande Antico
      name_en: The Great Old One
      expanded_spells:
        1:
        - dissonant_whispers
        - tashas_hideous_laughter
        2:
        - detect_thoughts
        - phantasmal_force
        3:
        - clairvoyance
        - sending
        4:
        - dominate_beast
        - evards_black_tentacles
        5:
        - dominate_person
        - telekinesis
      features:
        1:
        - name: Lista degli Incantesimi Ampliata
          name_en: Expanded Spell List
          short: 'Puoi scegliere come incantesimi da warlock anche: 1° sussurri dissonanti, risata incontenibile di Tasha; 2° individuazione dei pensieri, forza fantasmatica; 3° chiaroveggenza, inviare;
            4° dominare bestie, tentacoli neri di Evard; 5° dominare persone, telecinesi.'
          text: 'Quando impari un incantesimo da warlock puoi prenderlo anche da questo elenco, diviso per livello: 1° sussurri dissonanti e risata incontenibile di Tasha; 2° individuazione dei pensieri
            e forza fantasmatica; 3° chiaroveggenza e inviare; 4° dominare bestie e tentacoli neri di Evard; 5° dominare persone e telecinesi. Non li conosci in automatico: per te contano solo come incantesimi
            da warlock.'
          kid: Il tuo patrono misterioso ti offre magie della mente, come sussurri dissonanti e risata di Tasha. Quando impari un nuovo incantesimo puoi sceglierlo anche da questo elenco.
          kid_hide: true
        - name: Mente Risvegliata
          name_en: Awakened Mind
          short: Parli telepaticamente con qualsiasi creatura che vedi entro 9 m; non serve una lingua in comune, ma deve conoscerne almeno una.
          text: Puoi comunicare con la mente con qualunque creatura che vedi entro 9 m, anche se non avete una lingua in comune. Basta che la creatura conosca almeno un linguaggio.
          kid: Puoi parlare con la mente a chiunque vedi entro 9 m, anche se non parlate la stessa lingua. Deve però conoscere almeno una lingua.
        6:
        - name: Interdizione Entropica
          name_en: Entropic Ward
          short: 'Reazione quando una creatura ti attacca: il suo tiro ha svantaggio. Se ti manca, hai vantaggio al tuo prossimo tiro per colpire contro di lei entro la fine del tuo prossimo turno. 1/riposo
            breve o lungo.'
          text: Quando una creatura effettua un tiro per colpire contro di te puoi usare la reazione per imporle svantaggio. Se l'attacco manca, il tuo primo tiro per colpire contro di lei ha vantaggio,
            purché avvenga entro la fine del tuo turno successivo; l'uso si ricarica con un riposo breve o lungo.
          kid: Quando un nemico ti attacca, con la reazione gli fai tirare 2 d20 e tenere il più basso. Se ti manca, al tuo prossimo attacco contro di lui (entro il tuo turno) tiri 2 d20 e tieni il più
            alto. Una volta per riposo.
        10:
        - name: Scudo del Pensiero
          name_en: Thought Shield
          short: Nessuno ti legge la mente senza il tuo permesso. Hai resistenza ai danni psichici e chi te ne infligge subisce gli stessi danni.
          text: Telepatia e altri modi di leggere i pensieri non funzionano su di te, a meno che tu non lo permetta. Hai resistenza ai danni psichici, e ogni creatura che te ne infligge subisce la stessa
            quantità di danni che subisci tu.
          kid: Nessuno può leggerti nella mente se non vuoi. I danni alla mente (psichici) ti fanno solo metà, e chi te li fa subisce gli stessi danni.
        14:
        - name: Creare Servitore
          name_en: Create Thrall
          short: 'Azione: tocchi un umanoide incapacitato, che resta affascinato da te finché non riceve rimuovi maledizione, la condizione non viene tolta o usi di nuovo il privilegio. Se siete sullo stesso
            piano, gli parli telepaticamente.'
          text: Con un'azione tocchi un umanoide incapacitato e lo rendi affascinato da te, finché qualcuno non gli lancia rimuovi maledizione, la condizione non viene rimossa o tu non usi di nuovo questo
            privilegio. Finché vi trovate sullo stesso piano di esistenza potete comunicare telepaticamente.
          kid: 'Con un''azione tocchi una persona che non può agire (incapacitata): diventa tua amica e, se siete nello stesso mondo, puoi parlarle con la mente. Dura finché una magia non la libera o finché
            non usi di nuovo questo potere.'
