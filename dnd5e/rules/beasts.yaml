# Bestie del Manuale dei Mostri / SRD 5.1 utilizzabili con Forma Selvatica (GS fino a 1).
# cr: grado di sfida. speed in metri (walk; climb/burrow/fly/swim se presenti). attacks: testo riassuntivo. traits: capacità speciali.
# Nomi italiani della traduzione ufficiale Asmodee del Manuale dei Mostri.
#
# Campi per la guida illustrata (una scheda per bestia, linguaggio semplice, seconda persona):
#   role:        combattere | esplorare | viaggiare | nuotare | volare  (a cosa serve di più questa forma)
#   kid:         una frase semplice su cosa sa fare bene
#   multi:       (solo se ha Multiattacco) quali attacchi puoi fare nello stesso turno
#   kid_attacks: un elemento per attacco: name, hit (bonus per colpire), damage (dadi; "1" se fisso;
