# Bestie del Manuale dei Mostri / SRD 5.1 utilizzabili con Forma Selvatica: GS fino a 1 per tutti i druidi, fino a 6
# per il Circolo della Luna (GS = livello da druido / 3 dal 6° livello), più gli elementali dal 10° livello.
# cr: grado di sfida. speed in metri (walk; climb/burrow/fly/swim se presenti). attacks: testo riassuntivo. traits: capacità speciali.
# Nomi italiani della traduzione ufficiale Asmodee del Manuale dei Mostri.
#
# Campi per la guida illustrata (una scheda per bestia, linguaggio semplice, seconda persona):
#   role:        combattere | esplorare | viaggiare | nuotare | volare  (a cosa serve di più questa forma)
#   kid:         una frase semplice su cosa sa fare bene
#   multi:       (solo se ha Multiattacco) quali attacchi puoi fare nello stesso turno
#   kid_attacks: un elemento per attacco: name, hit (bonus per colpire), damage (dadi; "1" se fisso;
#                "-" se non fa danni), type (tipo di danno), extra (opzionale: effetto spiegato semplice)
#   kid_traits:  "Nome: spiegazione semplice" (lista vuota se non ne ha)
# I testi kid sono in seconda persona (chi gioca è l'animale): niente aggettivi al maschile o al femminile riferiti
# a chi gioca; se servono si scrive {o} ("attent{o}" -> attento / attenta), che il motore sostituisce.
#   elemental: true = elementale (solo con Forma Selvatica Elementale); cost = usi di Forma Selvatica spesi.

