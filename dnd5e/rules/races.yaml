half_orc:
  name: Mezzorco
  name_f: Mezzorca
  name_en: Half-Orc
  size: Medio
  speed: 30
  ability_bonus: {str: 2, con: 1}
  languages: [common, orc]
  traits:
    - name: Scurovisione
      short: "Vedi a 18 m nella luce fioca come se fosse luce intensa, e nell'oscurità come se fosse luce fioca."
      text: "Il mezzorco vede a 18 metri nella luce fioca come se fosse luce intensa e nell'oscurità come se fosse luce fioca."
      kid: "Vedi al buio fino a 18 m, ma solo in bianco e nero."
    - name: Minaccioso
      name_f: Minacciosa
      short: "Competenza nell'abilità Intimidire."
      text: "Il mezzorco ha competenza nell'abilità Intimidire."
      skills: [intimidation]
      kid_hide: true
    - name: Tenacia Implacabile
      short: "Se scendi a 0 PF senza morire, resti a 1 PF (1/riposo lungo)."
      text: "Quando il mezzorco scende a 0 punti ferita ma non viene ucciso sul colpo, può invece scendere a 1 punto ferita. Non può usare di nuovo questo privilegio finché non completa un riposo lungo."
      kid: "Se finisci a 0 PF, puoi restare in piedi con 1 PF. Funziona una volta, poi devi fare un riposo lungo."
    - name: Attacchi Selvaggi
      short: "Con un critico in mischia tiri un dado di danno dell'arma in più."
      text: "Quando il mezzorco mette a segno un colpo critico con un attacco con arma da mischia, può tirare uno dei dadi di danno dell'arma una volta in più e aggiungerlo al danno extra del critico."
      kid: "Quando fai un colpo critico in mischia, tiri un dado di danno dell'arma in più."

tiefling:
  name: Tiefling
  name_f: Tiefling
  name_en: Tiefling
  size: Medio
  speed: 30
  ability_bonus: {int: 1, cha: 2}
  languages: [common, infernal]
  traits:
    - name: Scurovisione
      short: "Vedi a 18 m nella luce fioca come se fosse luce intensa, e nell'oscurità come se fosse luce fioca."
      text: "Il tiefling vede a 18 metri nella luce fioca come se fosse luce intensa e nell'oscurità come se fosse luce fioca."
      kid: "Vedi al buio fino a 18 m, ma solo in bianco e nero."
    - name: Resistenza Infernale
      short: "Resistenza ai danni da fuoco."
      text: "Il tiefling ha resistenza ai danni da fuoco."
      kid: "Il fuoco ti fa solo metà danno."
    - name: Retaggio Infernale
      short: "Conosci taumaturgia; dal 3° livello intimorire infernale (2° liv.) e dal 5° oscurità, 1/riposo lungo. Caratteristica: Carisma."
      fixed_cantrips: [thaumaturgy]
      innate_ability: cha
      text: "Il tiefling conosce il trucchetto taumaturgia. Al 3° livello può lanciare intimorire infernale come incantesimo di 2° livello una volta per riposo lungo; al 5° livello può lanciare oscurità una volta per riposo lungo. La caratteristica da incantatore è il Carisma."
      kid: "Sai fare piccoli prodigi con taumaturgia. Dal 3° livello puoi lanciare intimorire infernale e dal 5° oscurità, una volta ciascuno per riposo lungo."

dragonborn:
  name: Dragonide
  name_f: Dragonide
  name_en: Dragonborn
  size: Medio
  speed: 30
  ability_bonus: {str: 2, cha: 1}
  languages: [common, draconic]
  # Discendenza draconica (PHB 2014): il personaggio sceglie la chiave in 'draconic_ancestry'.
  # damage_type = danno del soffio e resistenza; area = forma del soffio; save = TS richiesto (dex/con).
  ancestry:
    black:  {name: Nero,    damage_type: acido,   area: "una linea di 1,5 x 9 m", save: dex}
    blue:   {name: Blu,     damage_type: fulmine, area: "una linea di 1,5 x 9 m", save: dex}
    brass:  {name: Ottone,  damage_type: fuoco,   area: "una linea di 1,5 x 9 m", save: dex}
    bronze: {name: Bronzo,  damage_type: fulmine, area: "una linea di 1,5 x 9 m", save: dex}
    copper: {name: Rame,    damage_type: acido,   area: "una linea di 1,5 x 9 m", save: dex}
    gold:   {name: Oro,     damage_type: fuoco,   area: "un cono di 4,5 m",       save: dex}
    green:  {name: Verde,   damage_type: veleno,  area: "un cono di 4,5 m",       save: con}
    red:    {name: Rosso,   damage_type: fuoco,   area: "un cono di 4,5 m",       save: dex}
    silver: {name: Argento, damage_type: freddo,  area: "un cono di 4,5 m",       save: con}
    white:  {name: Bianco,  damage_type: freddo,  area: "un cono di 4,5 m",       save: con}
  traits:
    - name: Discendenza Draconica
      short: "Scegli un tipo di drago: determina il tipo di danno del soffio e della resistenza."
      text: "Il dragonide discende da un drago: il tipo di drago determina il danno e la forma dell'arma a soffio e la resistenza ai danni."
      kid_hide: true
    - name: Arma a Soffio
      short: "Azione: esali energia distruttiva (area e danno dalla discendenza). TS con CD 8 + mod. COS + comp.: 2d6 danni, metà se riesce (3d6 al 6°, 4d6 all'11°, 5d6 al 16°). 1/riposo breve o lungo."
      text: "Il dragonide può usare la sua azione per esalare energia distruttiva; dimensioni, forma e tipo di danno dipendono dalla discendenza draconica. Ogni creatura nell'area deve effettuare un tiro salvezza (del tipo indicato dalla discendenza) con CD 8 + modificatore di Costituzione + bonus di competenza, subendo 2d6 danni in caso di fallimento o la metà in caso di successo. Il danno aumenta a 3d6 al 6° livello, 4d6 all'11° e 5d6 al 16°. Dopo l'uso non può riutilizzarlo finché non completa un riposo breve o lungo."
      kid: "Con un'azione soffi {soffio_tipo} in {soffio_area}: chi è lì fa un tiro salvezza su {soffio_ts} (CD {soffio_cd}) e subisce {soffio_danni} danni, la metà se lo supera. Poi devi riposare per rifarlo."
    - name: Resistenza ai Danni
      short: "Resistenza al tipo di danno della tua discendenza draconica."
      text: "Il dragonide ha resistenza al tipo di danno associato alla sua discendenza draconica."
      kid: "I danni da {soffio_tipo} ti fanno solo metà danno."

gnome:
  name: Gnomo
  name_f: Gnoma
  name_en: Gnome
  size: Piccolo
  speed: 25
  ability_bonus: {int: 2}
  languages: [common, gnomish]
  traits:
    - name: Scurovisione
      short: "Vedi a 18 m nella luce fioca come se fosse luce intensa, e nell'oscurità come se fosse luce fioca."
      text: "Lo gnomo vede a 18 metri nella luce fioca come se fosse luce intensa e nell'oscurità come se fosse luce fioca."
      kid: "Vedi al buio fino a 18 m, ma solo in bianco e nero."
    - name: Astuzia Gnomesca
      short: "Vantaggio ai TS su INT, SAG e CAR contro la magia."
      text: "Lo gnomo ha vantaggio a tutti i tiri salvezza su Intelligenza, Saggezza e Carisma contro la magia."
      kid: "Contro la magia hai vantaggio sui tiri salvezza di Intelligenza, Saggezza e Carisma."
  subraces:
    forest_gnome:
      name: Gnomo delle Foreste
      name_f: Gnoma delle Foreste
      name_en: Forest Gnome
      ability_bonus: {dex: 1}
      traits:
        - name: Illusionista Nato
          name_f: Illusionista Nata
          short: "Conosci il trucchetto illusione minore (caratteristica: Intelligenza)."
          text: "Lo gnomo delle foreste conosce il trucchetto illusione minore. La caratteristica da incantatore è l'Intelligenza."
          fixed_cantrips: [minor_illusion]
          innate_ability: int
          kid_hide: true
        - name: Parlare con le Piccole Bestie
          short: "Puoi comunicare idee semplici a bestie di taglia Piccola o inferiore."
          text: "Attraverso suoni e gesti lo gnomo delle foreste può comunicare idee semplici alle bestie di taglia Piccola o inferiore."
          kid: "Con suoni e gesti fai capire idee semplici agli animali piccoli, come gatti, topi e uccellini."
    rock_gnome:
      name: Gnomo delle Rocce
      name_f: Gnoma delle Rocce
      name_en: Rock Gnome
      ability_bonus: {con: 1}
      traits:
        - name: Sapienza dell'Artefice
          short: "Doppio bonus di competenza alle prove di Storia su oggetti magici, alchemici o tecnologici."
          text: "Quando effettua una prova di Intelligenza (Storia) relativa a oggetti magici, alchemici o tecnologici, lo gnomo delle rocce aggiunge il doppio del bonus di competenza."
          kid: "Quando studi oggetti magici, pozioni o congegni, sei bravissima a capire cosa sono e da dove vengono."
        - name: Trafficone
          name_f: Trafficona
          short: "Competenza negli strumenti da inventore; puoi costruire piccoli congegni meccanici."
          text: "Lo gnomo delle rocce ha competenza negli strumenti da inventore. Con 1 ora di lavoro e 10 mo di materiali può costruire un congegno meccanico Minuscolo (CA 5, 1 PF): un giocattolo a molla, un accendifuoco o un carillon. Il congegno smette di funzionare dopo 24 ore (a meno di spendere 1 ora per ripararlo) e non se ne possono avere più di tre attivi alla volta."
          tool_proficiencies: ["Strumenti da inventore"]
          kid: "Con 1 ora di lavoro costruisci un piccolo congegno: un giocattolo a molla, un accendifuoco o un carillon. Funziona per 24 ore."
