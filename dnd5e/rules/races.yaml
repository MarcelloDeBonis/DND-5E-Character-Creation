# Razze del Manuale del Giocatore (PHB 2014). Testi in italiano (traduzione ufficiale Asmodee dove nota).
# ability_bonus: bonus fissi. ability_choice: {count, bonus, exclude} per bonus a scelta (es. mezzelfo).
# name_f: nome al femminile (razza, sottorazza, variante e tratti con nome di genere).
# traits: ogni tratto ha "name", "short" (riga breve per la pagina 1) e "text" (descrizione per la pagina 2).
#   kid: testo semplicissimo per le bambine (seconda persona, cosa significa in gioco). Segnaposto: {cd} {att} {mod}
#        {livello} {soffio_cd} {soffio_danni} {soffio_tipo} {soffio_area} {soffio_ts} {forma_ore}.
#   kid_hide: true = voce di sola contabilità (già riportata altrove sulla scheda), nascosta nella versione semplice.
elf:
  name: Elfo
  name_f: Elfa
  name_en: Elf
  size: Medio
  speed: 30
  ability_bonus: {dex: 2}
  languages: [common, elvish]
  age: "Un elfo raggiunge la maturità fisica verso i 20 anni ma è considerato adulto intorno ai 100 anni; può vivere fino a 750 anni."
  traits:
    - name: Scurovisione
      short: "Vedi a 18 m nella luce fioca come se fosse luce intensa, e nell'oscurità come se fosse luce fioca (solo in scala di grigi)."
      text: "Abituato alle foreste crepuscolari e al cielo notturno, l'elfo vede a 18 metri nella luce fioca come se fosse luce intensa e nell'oscurità come se fosse luce fioca. Nell'oscurità non distingue i colori, solo sfumature di grigio."
      kid: "Vedi al buio fino a 18 m, ma solo in bianco e nero."
    - name: Sensi Acuti
      short: "Competenza nell'abilità Percezione."
      text: "L'elfo ha competenza nell'abilità Percezione."
      skills: [perception]
      kid_hide: true
    - name: Retaggio Fatato
      short: "Vantaggio ai TS contro l'essere affascinato; la magia non può addormentarti."
      text: "L'elfo ha vantaggio ai tiri salvezza per non essere affascinato e la magia non può addormentarlo."
      kid: "Nessuna magia può farti addormentare. Se qualcuno prova a incantarti, hai vantaggio sul tiro salvezza."
    - name: Trance
      short: "Non dormi: 4 ore di meditazione semicosciente equivalgono a 8 ore di sonno."
      text: "Gli elfi non hanno bisogno di dormire: meditano in uno stato di semicoscienza per 4 ore al giorno (trance), sognando a occhi aperti. Dopo questo riposo l'elfo ottiene gli stessi benefici di 8 ore di sonno umano."
      kid: "Non dormi: ti bastano 4 ore di meditazione per riposare come gli altri in 8 ore di sonno."
  subraces:
    high_elf:
      name: Elfo Alto
      name_f: Elfa Alta
      name_en: High Elf
      ability_bonus: {int: 1}
      traits:
        - name: Addestramento nelle Armi Elfiche
          short: "Competenza in spada lunga, spada corta, arco corto e arco lungo."
          text: "L'elfo alto ha competenza nella spada lunga, nella spada corta, nell'arco corto e nell'arco lungo."
          weapon_proficiencies: [longsword, shortsword, shortbow, longbow]
          kid_hide: true
        - name: Trucchetto
          short: "Conosci un trucchetto dalla lista del mago (caratteristica: Intelligenza)."
          text: "L'elfo alto conosce un trucchetto a sua scelta dalla lista degli incantesimi del mago. La sua caratteristica da incantatore per questo trucchetto è l'Intelligenza."
          cantrip_choice: {list: wizard, ability: int}
          kid_hide: true
        - name: Linguaggio Extra
          short: "Parli, leggi e scrivi un linguaggio aggiuntivo a tua scelta."
          text: "L'elfo alto può parlare, leggere e scrivere un linguaggio aggiuntivo a sua scelta."
          extra_languages: 1
          kid_hide: true
    wood_elf:
      name: Elfo dei Boschi
      name_f: Elfa dei Boschi
      name_en: Wood Elf
      ability_bonus: {wis: 1}
      speed: 35
      traits:
        - name: Addestramento nelle Armi Elfiche
          short: "Competenza in spada lunga, spada corta, arco corto e arco lungo."
          text: "L'elfo dei boschi ha competenza nella spada lunga, nella spada corta, nell'arco corto e nell'arco lungo."
          weapon_proficiencies: [longsword, shortsword, shortbow, longbow]
          kid_hide: true
        - name: Piede Lesto
          short: "Velocità base di 10,5 m."
          text: "La velocità base sul terreno dell'elfo dei boschi aumenta a 10,5 metri."
          kid: "Sei veloce: nel tuo turno puoi muoverti di 10,5 m."
          kid_hide: true
        - name: Maschera della Natura
          short: "Puoi tentare di nasconderti anche quando sei solo leggermente oscurato da fogliame, pioggia o neve."
          text: "L'elfo dei boschi può tentare di nascondersi anche quando è solo leggermente oscurato da fogliame, pioggia battente, neve che cade, foschia o altri fenomeni naturali."
          kid: "Puoi provare a nasconderti anche solo dietro foglie, pioggia, neve o nebbia."
    drow:
      name: Elfo Oscuro (Drow)
      name_f: Elfa Oscura (Drow)
      name_en: Dark Elf (Drow)
      ability_bonus: {cha: 1}
      traits:
        - name: Scurovisione Superiore
          short: "La tua scurovisione arriva a 36 m."
          text: "La scurovisione del drow ha un raggio di 36 metri."
          kid: "Vedi al buio fino a 36 m, ma solo in bianco e nero."
        - name: Sensibilità alla Luce del Sole
          short: "Svantaggio ai tiri per colpire e alle prove di Percezione (vista) alla luce diretta del sole."
          text: "Il drow subisce svantaggio ai tiri per colpire e alle prove di Saggezza (Percezione) basate sulla vista quando lui, il bersaglio o l'oggetto che cerca di percepire si trova alla luce diretta del sole."
          kid: "Sotto il sole diretto hai svantaggio quando attacchi e quando cerchi qualcosa con gli occhi."
        - name: Magia dei Drow
          short: "Conosci il trucchetto luci danzanti; dal 3° livello luminescenza e dal 5° oscurità (1/riposo lungo). Caratteristica: Carisma."
          fixed_cantrips: [dancing_lights]
          innate_ability: cha
          text: "Il drow conosce il trucchetto luci danzanti. Al 3° livello può lanciare luminescenza una volta per riposo lungo; al 5° livello può lanciare oscurità una volta per riposo lungo. La caratteristica da incantatore è il Carisma."
          kid: "Sai creare luci danzanti. Dal 3° livello puoi lanciare luminescenza e dal 5° oscurità, una volta ciascuno, poi devi fare un riposo lungo."
        - name: Addestramento nelle Armi dei Drow
          short: "Competenza in stocco, spada corta e balestra a mano."
          text: "Il drow ha competenza nello stocco, nella spada corta e nella balestra a mano."
          weapon_proficiencies: [rapier, shortsword, hand_crossbow]
          kid_hide: true

human:
  name: Umano
  name_f: Umana
  name_en: Human
  size: Medio
  speed: 30
  ability_bonus: {str: 1, dex: 1, con: 1, int: 1, wis: 1, cha: 1}
  languages: [common]
  extra_languages: 1
  traits:
    - name: Linguaggio Extra
      short: "Parli, leggi e scrivi un linguaggio aggiuntivo a tua scelta."
      text: "L'umano può parlare, leggere e scrivere un linguaggio aggiuntivo a sua scelta."
      kid_hide: true
  variants:
    variant_human:
      name: Umano (Variante)
      name_f: Umana (Variante)
      name_en: Variant Human
      replaces_base_bonus: true          # sostituisce il +1 a tutte le caratteristiche
      ability_bonus: {}
      ability_choice: {count: 2, bonus: 1}
      traits:
        - name: Abilità
          short: "Competenza in un'abilità a scelta."
          text: "L'umano variante ottiene competenza in un'abilità a sua scelta."
